<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0D1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SPARE PARTS MANAGEMENT SYSTEM — Spare Parts &amp; Tools</title>
<style>
:root{
  --bg:#EDF1F6; --surface:#fff; --surface2:#F6F9FC; --surface3:#EEF3F9;
  --ink:#0B1220; --ink2:#4A5A70; --ink3:#8695AA; --line:#DEE6EF; --line2:#CBD6E3;
  --rail:#0D1626; --rail2:#16233A; --rail3:#233350; --railInk:#93A4BD;
  --brand:#0F766E; --brand2:#14958B; --brandSoft:#E2F4F1;
  --ok:#12805C; --okSoft:#E3F5EC;
  --low:#A55A08; --lowSoft:#FDF0DC;
  --out:#B42318; --outSoft:#FCE9E7;
  --ord:#1D4ED8; --ordSoft:#E8EEFE;
  --mute:#64748B; --muteSoft:#EEF2F7;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px; --sh:0 1px 2px rgba(11,18,32,.06),0 1px 3px rgba(11,18,32,.04);
  --shL:0 10px 30px rgba(11,18,32,.14);
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand);text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ LOCK SCREEN ============ */
#lock{position:fixed;inset:0;z-index:200;background:
   radial-gradient(1200px 600px at 20% -10%,#1B3350 0%,transparent 60%),
   radial-gradient(900px 500px at 110% 110%,#0F4F4A 0%,transparent 55%),#0A1220;
  display:flex;flex-direction:column;color:#fff;
  padding:calc(var(--sat) + 22px) 22px calc(var(--sab) + 22px)}
#lock.gone{display:none}
.lk-top{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.lk-clock{font-family:var(--mono);font-size:60px;font-weight:200;letter-spacing:-2px;line-height:1}
.lk-date{color:#8FA3BE;font-size:13px;margin-top:8px;letter-spacing:.5px}
.lk-brand{display:flex;align-items:center;gap:10px;margin-top:34px}
.lk-brand img{width:38px;height:38px;border-radius:9px;object-fit:contain;background:#fff}
.lk-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(140deg,var(--brand2),#0B5F70);
  display:grid;place-items:center;font-weight:800;font-size:16px}
.lk-name{font-size:19px;font-weight:700;letter-spacing:-.3px}
.lk-sub{font-size:11px;color:#7F93AE;letter-spacing:1.6px;text-transform:uppercase;margin-top:2px}
.lk-form{width:100%;max-width:380px;margin:0 auto}
.lk-field{position:relative;margin-bottom:11px}
.lk-field input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  color:#fff;border-radius:12px;padding:15px 46px 15px 15px;font-size:16px;outline:none}
.lk-field input:focus{border-color:var(--brand2);background:rgba(255,255,255,.1)}
.lk-field input::placeholder{color:#7186A2}
.lk-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:10px;color:#8FA3BE;font-size:12px}
.lk-go{width:100%;background:var(--brand2);color:#fff;font-weight:700;border-radius:12px;padding:15px;font-size:15px;
  margin-top:4px}
.lk-go:active{transform:scale(.99)}
.lk-err{background:rgba(180,35,24,.2);border:1px solid rgba(255,120,110,.35);color:#FFB4AD;
  border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:11px}
.lk-hint{margin-top:16px;font-size:11.5px;color:#6D82A0;text-align:center;line-height:1.7}
.lk-hint b{color:#9FB4D0;font-weight:600}
.lk-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:9px}
.lk-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#B7C7DC;
  padding:6px 11px;border-radius:999px;font-size:11.5px}
.lk-chip:active{background:rgba(255,255,255,.16)}

/* ============ SHELL ============ */
#app{display:none;min-height:100%}
#app.on{display:block}
.rail{position:fixed;top:0;left:0;bottom:0;width:236px;background:var(--rail);z-index:60;
  display:flex;flex-direction:column;padding-top:var(--sat);transition:transform .22s ease}
.rail-head{padding:16px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rail3)}
.rail-head img{width:32px;height:32px;border-radius:8px;object-fit:contain;background:#fff;flex:none}
.rail-mark{width:32px;height:32px;border-radius:8px;flex:none;background:linear-gradient(140deg,var(--brand2),#0B5F70);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.rail-nm{color:#fff;font-weight:700;font-size:14.5px;letter-spacing:-.2px;line-height:1.2}
.rail-sb{color:#6E829E;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-lbl{color:#56698A;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;padding:12px 8px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:8px;color:var(--railInk);
  font-size:13.5px;font-weight:500;margin-bottom:2px;cursor:pointer}
.nav a .ic{width:18px;text-align:center;font-size:15px;flex:none;opacity:.9}
.nav a .bdg{margin-left:auto;background:var(--out);color:#fff;font-size:10px;font-weight:800;
  padding:1px 6px;border-radius:999px;min-width:18px;text-align:center}
.nav a .bdg.amber{background:#C2740D}
.nav a:hover{background:var(--rail2);color:#D6E1EE}
.nav a.on{background:var(--rail3);color:#fff;box-shadow:inset 3px 0 0 var(--brand2)}
.rail-foot{padding:11px 16px calc(11px + var(--sab));border-top:1px solid var(--rail3);
  color:#54678A;font-size:10.5px;display:flex;justify-content:space-between;align-items:center}
.scrim{position:fixed;inset:0;background:rgba(6,11,20,.55);z-index:55;display:none}
.scrim.on{display:block}

.main{margin-left:236px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:var(--sat)}
.top-in{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px}
.burger{display:none;width:36px;height:36px;border-radius:8px;background:var(--surface3);
  place-items:center;font-size:16px;flex:none}
.pg-t{font-size:15.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.sitesel{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;
  font-size:12.5px;font-weight:600;max-width:170px;outline:none}
.icbtn{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;position:relative}
.icbtn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--out)}
.avat{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:12.5px;flex:none}
.wrap{padding:16px;max-width:1360px;width:100%;margin:0 auto;flex:1}

/* ============ CARDS / KPI ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--sh);
  position:relative;overflow:hidden;text-align:left;display:block;width:100%}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.kpi.ok:before{background:var(--ok)} .kpi.low:before{background:var(--low)}
.kpi.out:before{background:var(--out)} .kpi.ord:before{background:var(--ord)}
.kpi.br:before{background:var(--brand)}
.kpi-l{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.kpi-v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-1.2px;margin-top:5px;line-height:1}
.kpi-d{font-size:11.5px;color:var(--ink2);margin-top:5px}
.kpi-d .up{color:var(--out);font-weight:700}
.kpi-d .dn{color:var(--ok);font-weight:700}
.kpi-d .fl{color:var(--ink3);font-weight:700}
/* consumption bars */
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bcol .pair{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%;justify-content:center}
.bcol i{display:block;width:100%;max-width:15px;border-radius:3px 3px 0 0;min-height:2px;transition:height .35s}
.bcol i.bin{background:var(--ok)}
.bcol i.bout{background:var(--brand)}
.bcol.now i{opacity:.55}
.bcol b{font-family:var(--mono);font-size:9.5px;color:var(--ink2);margin-bottom:4px;white-space:nowrap;font-weight:600}
.bcol span{font-size:9.5px;color:var(--ink3);margin-top:5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.bcol.now span{color:var(--low);font-weight:700}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.top5{display:flex;flex-direction:column;gap:9px}
.t5r{display:flex;align-items:center;gap:9px;font-size:12.5px}
.t5r .t5n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t5r .t5b{width:34%;flex:none}
.t5r .t5v{font-family:var(--mono);font-size:11.5px;color:var(--ink2);flex:none;width:66px;text-align:right}

.pg-s{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.sitebtn{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font-size:12.5px;max-width:250px;flex:none}
.sitebtn .cd{font-family:var(--mono);font-weight:700;letter-spacing:.3px}
.sitebtn .nm{font-weight:500;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitebtn .cv{color:var(--ink3);font-size:10px;flex:none}
.sitebtn .wd{width:7px;height:7px;border-radius:50%;background:var(--out);flex:none}
.siterow{display:flex;gap:11px;align-items:center;width:100%;padding:13px 16px;border-bottom:1px solid var(--line);
  text-align:left;background:none}
.siterow:last-child{border-bottom:0}
.siterow:hover{background:var(--surface2)}
.siterow.on{background:var(--brandSoft)}
.siterow .cd{width:46px;height:40px;border-radius:9px;background:var(--rail);color:#fff;display:grid;
  place-items:center;font-family:var(--mono);font-weight:700;font-size:12.5px;flex:none}
.siterow.on .cd{background:var(--brand)}
.siterow .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.siterow .mt{font-size:11.5px;color:var(--ink3);margin-top:2px}
.siterow .tk{margin-left:auto;flex:none;text-align:right}

/* category breakdown */
.catrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);
  width:100%;text-align:left;background:none}
.catrow:last-child{border-bottom:0}
.catrow:hover{background:var(--surface2)}
.cat-n{width:112px;flex:none}
.cat-n b{font-size:13px;font-weight:600;display:block}
.cat-n span{font-size:11px;color:var(--ink3);display:block;margin-top:1px}
.cat-b{flex:1;min-width:60px}
.stack{height:9px;border-radius:5px;background:var(--surface3);display:flex;overflow:hidden}
.stack i{display:block;height:100%;transition:width .3s}
.stack i.g{background:var(--brand)}
.stack i.r{background:var(--out)}
.cat-v{flex:none;width:98px;text-align:right}
.cat-v b{font-family:var(--mono);font-size:12.5px;font-weight:600;display:block}
.cat-v span{font-size:10.5px;color:var(--ink3);display:block;margin-top:1px}
.cat-chips{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface3);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
@media(max-width:860px){
  .catrow{flex-wrap:wrap;gap:8px}
  .cat-n{width:auto;flex:1}
  .cat-v{width:auto}
  .cat-b{flex-basis:100%;order:3;min-width:0}
}

.morerow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;
  border-top:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--brand);background:var(--surface2)}
.morerow:hover{background:var(--surface3)}
.morerow span{color:var(--ink3);font-weight:500}

/* photos */
.th{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--surface3);flex:none;display:block;
  cursor:zoom-in;border:1px solid var(--line)}
.th.ph0{display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;
  color:var(--ink3);cursor:default;letter-spacing:.3px}
.th.lg{width:54px;height:54px;border-radius:9px}
.hero{width:100%;max-height:230px;object-fit:contain;background:var(--surface3);border-radius:10px;
  margin-bottom:14px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.phfld{display:flex;gap:11px;align-items:flex-start}
.phfld .pv{width:74px;height:74px;border-radius:10px;object-fit:cover;background:var(--surface3);
  border:1px solid var(--line);flex:none;display:block}
.phfld .pv.ph0{display:grid;place-items:center;color:var(--ink3);font-size:20px}
.phfld .ac{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap}
.lbl-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:5px 9px;border-radius:7px;
  font-size:11.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);cursor:pointer}
.lbl-btn:hover{background:var(--surface3)}
.bar-use{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden;margin:8px 0 4px}
.bar-use i{display:block;height:100%;background:var(--brand);transition:width .3s}
.bar-use i.warn{background:var(--low)} .bar-use i.full{background:var(--out)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px}
.card-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card-t{font-size:13.5px;font-weight:700;letter-spacing:-.1px}
.card-s{font-size:11.5px;color:var(--ink3);margin-top:1px}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px}
.card-b.flush{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* ============ CONTROLS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:8px;
  font-size:12.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line2);color:var(--ink)}
.btn:hover{background:var(--surface3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.dgr{background:var(--out);border-color:var(--out);color:#fff}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:7px}
.btn.blk{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:3px;background:var(--surface3);border-radius:9px;margin-bottom:12px}
.tabs button{padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.srch{flex:1;min-width:170px;position:relative}
.srch input{width:100%;padding:9px 11px 9px 32px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);outline:none;font-size:13px}
.srch input:focus{border-color:var(--brand)}
.srch:before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:15px}
.sel{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12.5px;
  font-weight:600;outline:none}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);font-size:15px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand)}
.fld textarea{min-height:66px;resize:vertical;font-size:14px}
.fld .hlp{font-size:11px;color:var(--ink3);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ TABLE / ROWS ============ */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);
  font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pname{font-weight:600}
.psku{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;
  font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.pill.low{background:var(--lowSoft);color:var(--low)}
.pill.out{background:var(--outSoft);color:var(--out)}
.pill.ord{background:var(--ordSoft);color:var(--ord)}
.pill.mute{background:var(--muteSoft);color:var(--mute)}
.pill.br{background:var(--brandSoft);color:var(--brand)}
/* signature: stock level bar */
.sb{position:relative;height:6px;background:var(--surface3);border-radius:3px;overflow:visible;min-width:78px}
.sb i{display:block;height:6px;border-radius:3px;background:var(--ok);transition:width .3s}
.sb.low i{background:var(--low)} .sb.out i{background:var(--out)}
.sb u{position:absolute;top:-3px;height:12px;width:2px;background:var(--ink);opacity:.5;border-radius:1px}
.sb-lg{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:3px;display:flex;justify-content:space-between}
.rows{display:none}
.row{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.row:last-child{border-bottom:0}
.row-m{flex:1;min-width:0}
.row-r{text-align:right;flex:none}
.row-x{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}
.empty .e-i{font-size:30px;opacity:.35}

const DB_NAME='voltgrid_store', DB_STORE='kv', LS_KEY='voltgrid_store_v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const DAY=86400000;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const iso=d=>new Date(d).toISOString().slice(0,10);
const addD=(n,base)=>iso(new Date((base?new Date(base):today()).getTime()+n*DAY));
const daysTo=d=>Math.round((new Date(d+'T00:00:00')-today())/DAY);
const fmtD=d=>{if(!d)return '—';const x=new Date(d+'T00:00:00');
  return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});};
const fmtDT=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const money=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ago=t=>{const s=(Date.now()-t)/1000;
  if(s<60)return 'just now'; if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago'; if(s<604800)return Math.floor(s/86400)+'d ago'; return fmtDT(t);};

/* ---------- storage ---------- */
let _db=null;
function openDB(){return new Promise(res=>{
  if(!window.indexedDB)return res(null);
  try{const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(DB_STORE))d.createObjectStore(DB_STORE);};
    r.onsuccess=e=>res(e.target.result); r.onerror=()=>res(null);
    setTimeout(()=>res(_db),2500);
  }catch(e){res(null)}});}
async function dbGet(k){
  if(_db){try{return await new Promise((res,rej)=>{const t=_db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(k);
    t.onsuccess=()=>res(t.result); t.onerror=()=>rej();});}catch(e){}}
  try{const v=localStorage.getItem(k);return v?JSON.parse(v):undefined;}catch(e){return undefined;}}
async function dbSet(k,v){
  if(_db){try{await new Promise((res,rej)=>{const t=_db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).put(v,k);
    t.onsuccess=()=>res(); t.onerror=()=>rej();});}catch(e){}}
  try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- stock flow (issued out / received in) ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function weekStart(){const d=today();return new Date(d.getTime()-((d.getDay()+6)%7)*DAY);}
function monthStart(){const d=today();return new Date(d.getFullYear(),d.getMonth(),1);}
function yearStart(){const d=today();return new Date(d.getFullYear(),0,1);}
/** Movements of one type between two timestamps, scoped to the selected site. */
function flow(type,from,to){
  const a=+from, b=to==null?Date.now()+DAY:+to;
  const L=S.log.filter(l=>l.type===type&&l.qty&&(VIEW.site==='all'||l.site===VIEW.site)&&l.ts>=a&&l.ts<b);
  return {qty:L.reduce((s,l)=>s+l.qty,0), val:L.reduce((s,l)=>s+(l.value||0),0), n:L.length, lines:L};
}
const use=(f,t)=>flow('issue',f,t);          // parts issued out of the store
const stockIn=(f,t)=>flow('receive',f,t);    // goods booked in
/** Same elapsed span in the previous week / month / year, so partial periods compare fairly. */
function flowPrev(type,kind){
  const now=Date.now();
  if(kind==='week'){const w=+weekStart();return flow(type,w-7*DAY, w-7*DAY+(now-w));}
  if(kind==='month'){const m=monthStart(), el=now-m;
    const pm=new Date(m.getFullYear(),m.getMonth()-1,1); return flow(type,pm, +pm+el);}
  const y=yearStart(), el=now-y, py=new Date(y.getFullYear()-1,0,1);
  return flow(type,py, +py+el);
}
const usePrev=k=>flowPrev('issue',k);
function delta(cur,prev){
  if(!prev)return cur?'<span class="up">new</span>':'<span class="fl">no prior data</span>';
  const p=Math.round((cur-prev)/prev*100);
  if(Math.abs(p)<1)return '<span class="fl">level</span> vs last period';
  return `<span class="${p>0?'up':'dn'}">${p>0?'▲':'▼'} ${Math.abs(p)}%</span> vs last period`;
}
/** Value in and out per calendar month for the last n months, oldest first. */
function byMonth(n){
  const out=[], d=today();
  for(let i=n-1;i>=0;i--){
    const s=new Date(d.getFullYear(),d.getMonth()-i,1), e=new Date(d.getFullYear(),d.getMonth()-i+1,1);
    const o=use(s,e), inn=stockIn(s,e);
    out.push({label:MON[s.getMonth()],year:s.getFullYear(),out:o.val,in:inn.val,
      outQty:o.qty,inQty:inn.qty,now:i===0});
  }
  return out;
}
const useByMonth=n=>byMonth(n);
/** Most-consumed parts in a window, by value. */
function topUsed(from,limit){
  const m={};
  use(from).lines.forEach(l=>{
    if(!m[l.part])m[l.part]={qty:0,val:0};
    m[l.part].qty+=l.qty; m[l.part].val+=l.value||0;
  });
  return Object.entries(m).map(([id,v])=>({p:partById(id),...v}))
    .filter(x=>x.p).sort((a,b)=>b.val-a.val).slice(0,limit||5);
}

/* ---------- photos ----------
   Images live in their own IndexedDB record, not inside the main state, so
   routine saves stay small and fast. A part or tool holds either a photo id
   (uploaded, compressed) or an http(s) link. */
const PH_KEY='voltgrid_store_photos';
const PH_MAX=640, PH_Q=0.72, PH_BUDGET=4.2*1024*1024;
let PH={};
function photoSrc(o){
  if(!o||!o.photo)return null;
  return /^https?:\/\//i.test(o.photo)?o.photo:(PH[o.photo]||null);
}
const photoBytes=()=>Object.values(PH).reduce((a,s)=>a+s.length,0);

function anyById(id){return partById(id)||S.tools.find(t=>t.id===id)||null;}
/** Downscale and re-encode so a 4 MB phone photo lands around 40–70 KB. */
function shrinkImage(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type))return rej(new Error('That file is not an image'));
    const r=new FileReader();
    r.onerror=()=>rej(new Error('Could not read that file'));
    r.onload=e=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('Could not open that image'));
      img.onload=()=>{
        try{
          let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
          const sc=Math.min(1,PH_MAX/Math.max(w,h));
          w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
          res(c.toDataURL('image/jpeg',PH_Q));
        }catch(err){rej(new Error('Could not process that image'));}
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/* ---------- stock by category ---------- */
function catBlock(){
  const parts=S.parts.filter(inSite);
  const byVal=VIEW.catMode!=='items';
  const cats=[...new Set(parts.map(p=>p.cat))].map(c=>{
    const g=parts.filter(p=>p.cat===c);
    const bad=g.filter(p=>stockState(p)!=='ok');
    return {c, items:g.length, qty:g.reduce((a,p)=>a+p.qty,0),
      val:g.reduce((a,p)=>a+p.qty*p.cost,0),
      riskVal:bad.reduce((a,p)=>a+p.qty*p.cost,0),
      low:g.filter(p=>stockState(p)==='low').length,
      out:g.filter(p=>stockState(p)==='out').length};
  }).sort((a,b)=>byVal?b.val-a.val:b.items-a.items);

  const totVal=cats.reduce((a,x)=>a+x.val,0), totItems=cats.reduce((a,x)=>a+x.items,0);
  const tot=byVal?totVal:totItems;

  return `<div class="card">
    <div class="card-h"><div><div class="card-t">Stock by category</div>
      <div class="card-s">${VIEW.site==='all'?'All warehouses':siteName(VIEW.site)} ·
        ${money(totVal).replace('.00','')} across ${totItems} line items</div></div>
      <div class="r"><div class="seg">
        <button class="${byVal?'on':''}" onclick="setCatMode('value')">By value</button>
        <button class="${byVal?'':'on'}" onclick="setCatMode('items')">By count</button>
      </div></div></div>
    <div class="card-b flush">
      ${cats.length?cats.map(x=>{
        const mine=byVal?x.val:x.items, risk=byVal?x.riskVal:(x.low+x.out);
        const share=tot?mine/tot*100:0, riskShare=mine?risk/mine*100:0;
        return `<button class="catrow" onclick="goCat('${esc(x.c)}')">
          <span class="cat-n"><b>${esc(x.c)}</b>
            <span>${x.items} item${x.items>1?'s':''} · ${x.qty} units</span></span>
          <span class="cat-b">
            <span class="stack" title="${money(x.val)} total, ${money(x.riskVal)} below minimum">
              <i class="g" style="width:${share*(100-riskShare)/100}%"></i>
              <i class="r" style="width:${share*riskShare/100}%"></i></span>
            ${(x.low||x.out)?`<span class="cat-chips">
              ${x.out?`<span class="pill out">${x.out} out</span>`:''}
              ${x.low?`<span class="pill low">${x.low} low</span>`:''}</span>`:''}
          </span>
          <span class="cat-v"><b>${byVal?money(x.val).replace('.00',''):x.items}</b>
            <span>${Math.round(share)}% of ${byVal?'value':'lines'}</span></span>
        </button>`;}).join('')
      :empty('▤','No parts at this warehouse','Add stock or switch warehouse to see the breakdown.')}
    </div>
    <div class="card-b" style="border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2)">
      Bar length is each category's share of ${byVal?'total stock value':'total line items'};
      the red segment is the portion sitting at or below minimum. Tap a row to open that category.
    </div>
  </div>`;
}
function setCatMode(m){VIEW.catMode=m;render();}
function goCat(c){
  VIEW.page='parts'; VIEW.q=''; VIEW.stock='all'; VIEW.tab='all'; VIEW.cat=c;
  $('#rail').classList.remove('on'); $('#scrim').classList.remove('on');

/* ---------- consumption + goods in ---------- */
function useBlock(){
  const w=use(weekStart()), m=use(monthStart()), y=use(yearStart());
  const iw=stockIn(weekStart()), im=stockIn(monthStart()), iy=stockIn(yearStart());
  const d=today(), wkDays=((d.getDay()+6)%7)+1, moDays=d.getDate();
  const doy=Math.floor((d-yearStart())/DAY)+1;
  const bars=byMonth(12), peak=Math.max(...bars.map(b=>Math.max(b.in,b.out)),1);
  const top=topUsed(monthStart(),5), topMax=Math.max(...top.map(t=>t.val),1);
  const burn=y.val/Math.max(doy,1)*30.4;
  const cover=burn>0?(stockValue()/burn).toFixed(1):'—';
  const net=(a,b)=>{const n=a-b;
    return `<span class="${n<0?'up':'dn'}">${n<0?'▼':'▲'} ${money(Math.abs(n)).replace('.00','')}</span> ${n<0?'net drawdown':'net build-up'}`;};

  const card=(lbl,u,prev,sub,cls)=>`<div class="kpi ${cls}">
    <div class="kpi-l">${lbl}</div>
    <div class="kpi-v">${money(u.val).replace('.00','')}</div>
    <div class="kpi-d">${u.qty} items · ${u.n} movement${u.n===1?'':'s'}</div>
    <div class="kpi-d">${delta(u.val,prev.val)}</div>
    <div class="kpi-d" style="color:var(--ink3)">${sub}</div></div>`;

  return `
  <div class="card">
    <div class="card-h"><div><div class="card-t">Consumption — stock out</div>
      <div class="card-s">Parts issued from the store · ${VIEW.site==='all'?'all warehouses':siteName(VIEW.site)}</div></div>
      <div class="r"><button class="btn sm" data-go="log">Movements</button></div></div>
    <div class="card-b">
      <div class="kpis" style="margin-bottom:0">
        ${card('This week',w,usePrev('week'),`Mon–today · day ${wkDays} of 7`,'br')}
        ${card('This month',m,usePrev('month'),`1–${moDays} ${MON[d.getMonth()]} ${d.getFullYear()}`,'ord')}
        ${card('Year to date',y,usePrev('year'),`1 Jan – ${moDays} ${MON[d.getMonth()]} · day ${doy}`,'ok')}
        <div class="kpi low"><div class="kpi-l">Avg burn rate</div>
          <div class="kpi-v">${money(burn).replace('.00','')}</div>
          <div class="kpi-d">per month, YTD average</div>
          <div class="kpi-d">${Math.round(y.qty/Math.max(doy,1)*30.4)} items / month</div>
          <div class="kpi-d" style="color:var(--ink3)">${cover} months of cover on hand</div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><div><div class="card-t">New stock in</div>
      <div class="card-s">Goods received and booked into the store</div></div>
      <div class="r">${can('receive')?'<button class="btn sm pri" onclick="receiveModal()">Receive stock</button>':''}</div></div>
    <div class="card-b">
      <div class="kpis" style="margin-bottom:0">
        ${card('This week',iw,flowPrev('receive','week'),net(iw.val,w.val),'br')}
        ${card('This month',im,flowPrev('receive','month'),net(im.val,m.val),'ord')}
        ${card('Year to date',iy,flowPrev('receive','year'),net(iy.val,y.val),'ok')}
        <div class="kpi ${iy.val<y.val?'out':'ok'}"><div class="kpi-l">Replenishment ratio</div>
          <div class="kpi-v">${y.val?Math.round(iy.val/y.val*100):0}%</div>
          <div class="kpi-d">received vs issued, YTD</div>
          <div class="kpi-d" style="color:var(--ink3)">${iy.val<y.val
            ?'Drawing stock down faster than replacing it':'Replacing at or above the burn rate'}</div></div>
      </div>
      ${(()=>{const rec=stockIn(weekStart()).lines; if(!rec.length)return '';
        return `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
          color:var(--ink3);margin:16px 0 2px">Received this week</div>
        ${rec.slice(0,ROWCAP).map(l=>{const p=partById(l.part);
          return `<div class="kv"><span style="color:var(--ink)">${esc(p?p.name:'—')}
            <span class="mono" style="font-size:11px;color:var(--ink3)"> ${p?esc(p.sku):''} · ${esc(l.site)} · ${ago(l.ts)}</span></span>
            <b class="mono">+${l.qty} ${p?esc(p.unit):''}</b></div>`;}).join('')}
        ${rec.length>ROWCAP?`<button class="morerow" style="border-radius:8px;margin-top:10px;border:1px solid var(--line)"
          onclick="goLog('receive')">View all ${rec.length} receipts <span>+${rec.length-ROWCAP} more</span></button>`:''}`;})()}
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-h"><div><div class="card-t">Stock in vs stock out</div>
        <div class="card-s">Last 12 months by value</div></div></div>
      <div class="card-b">
        <div class="bars">${bars.map(b=>`<div class="bcol ${b.now?'now':''}"
          title="${b.label} ${b.year} — in ${money(b.in)} (${b.inQty}) · out ${money(b.out)} (${b.outQty})">
          <div class="pair">
            <i class="bin" style="height:${Math.max(b.in/peak*100,1)}%"></i>
            <i class="bout" style="height:${Math.max(b.out/peak*100,1)}%"></i></div>
          <span>${b.label}</span></div>`).join('')}</div>
        <div class="legend"><span><i style="background:var(--ok)"></i>Received in</span>
          <span><i style="background:var(--brand)"></i>Issued out</span>
          <span>${MON[d.getMonth()]} is partial (day ${moDays})</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><div><div class="card-t">Top consumers this month</div>
        <div class="card-s">Where the spend is going</div></div></div>
      <div class="card-b">
        ${top.length?`<div class="top5">${top.map(t=>`<div class="t5r">
          <div class="t5n"><b>${esc(t.p.name)}</b><div class="psku">${esc(t.p.sku)} · ${t.qty} ${esc(t.p.unit)} issued</div></div>
          <div class="t5b"><div class="sb"><i style="width:${t.val/topMax*100}%"></i></div></div>
          <div class="t5v">${money(t.val).replace('.00','')}</div></div>`).join('')}</div>`
        :empty('▤','Nothing issued yet this month','Issued parts appear here as they leave the store.')}
      </div>
    </div>
  </div>`;
}

    <select class="sel" data-filter="stock">
      <option value="all" ${VIEW.stock==='all'?'selected':''}>All stock</option>
      <option value="low" ${VIEW.stock==='low'?'selected':''}>Below minimum</option>
      <option value="out" ${VIEW.stock==='out'?'selected':''}>Out of stock</option>
      <option value="ok"  ${VIEW.stock==='ok'?'selected':''}>Healthy</option></select>
    ${can('issue')?'<button class="btn pri" onclick="issueModal()">Issue</button>':''}
    ${can('receive')?'<button class="btn" onclick="receiveModal()">Receive</button>':''}

  </div>
  <div class="card"><div class="card-b flush" id="listHost">${partsList()}</div></div>`;
}
function filterParts(){
  const q=VIEW.q.toLowerCase();
  return S.parts.filter(p=>inSite(p))
   .filter(p=>VIEW.cat==='all'||p.cat===VIEW.cat)
   .filter(p=>VIEW.stock==='all'||stockState(p)===VIEW.stock||(VIEW.stock==='low'&&stockState(p)==='out'))
   .filter(p=>!q||(p.name+' '+p.sku+' '+p.bin+' '+p.sup).toLowerCase().includes(q))
   .sort((a,b)=>{const r={out:0,low:1,ok:2};return r[stockState(a)]-r[stockState(b)]||a.name.localeCompare(b.name);});
}
function partsList(){
  const L=filterParts();
  if(!L.length)return empty('▤','No parts match','Try clearing the search or filters.');
  const rowAct=p=>`<button class="btn sm" data-menu onclick="partMenu(event,'${p.id}')">Actions ▾</button>`;
  return `<table class="tbl"><thead><tr><th style="width:52px"></th><th>Part</th><th>Category</th><th>Bin</th><th>Site</th>
    <th style="width:150px">Level</th><th class="num">On hand</th><th class="num">Value</th><th>Status</th><th>Warranty</th><th></th></tr></thead><tbody>
    ${L.map(p=>`<tr><td>${thumb(p,p.cat)}</td>
      <td><div class="pname">${esc(p.name)}</div><div class="psku">${esc(p.sku)}</div></td>
      <td style="color:var(--ink2)">${esc(p.cat)}</td><td class="mono" style="font-size:12px">${esc(p.bin)}</td>

    .filter(t=>VIEW.tab==='all'||toolState(t)===VIEW.tab||(VIEW.tab==='out'&&t.status==='out'))

    .sort((a,b)=>{const r={over:0,out:1,maint:2,in:3};return r[toolState(a)]-r[toolState(b)]||a.code.localeCompare(b.code);});

/* ---------- WARRANTY ---------- */
const warPill=s=>({ok:'<span class="pill ok">Under warranty</span>',
  soon:'<span class="pill low">Expiring</span>',exp:'<span class="pill out">Expired</span>',
  none:'<span class="pill mute">Not covered</span>'}[s]);
function pgWar(){
  const W=warItems();
  const c={all:W.length,ok:W.filter(x=>x.st==='ok').length,soon:W.filter(x=>x.st==='soon').length,
    exp:W.filter(x=>x.st==='exp').length,none:W.filter(x=>x.st==='none').length};
  const covered=W.filter(x=>x.st==='ok'||x.st==='soon');
  const coveredVal=covered.reduce((a,x)=>a+x.val,0);
  const atRisk=W.filter(x=>x.st==='exp').reduce((a,x)=>a+x.val,0);
  const tracked=c.all-c.none;
  return `
  <div class="kpis">
    <div class="kpi ok"><div class="kpi-l">Under warranty</div><div class="kpi-v">${c.ok}</div>
      <div class="kpi-d">${money(coveredVal).replace('.00','')} of stock covered</div></div>
    <div class="kpi low"><div class="kpi-l">Expiring in 60 days</div><div class="kpi-v">${c.soon}</div>
      <div class="kpi-d">Claim now or lose cover</div></div>
    <div class="kpi out"><div class="kpi-l">Expired</div><div class="kpi-v">${c.exp}</div>
      <div class="kpi-d">${money(atRisk).replace('.00','')} no longer covered</div></div>
    <div class="kpi br"><div class="kpi-l">Coverage</div>
      <div class="kpi-v">${tracked?Math.round(covered.length/tracked*100):0}%</div>
      <div class="kpi-d">${tracked} items tracked · ${c.none} not covered</div></div>
  </div>
  <div class="tabs">
    ${[['all','All'],['exp','Expired'],['soon','Expiring'],['ok','Under warranty'],['none','Not covered']]
      .map(([k,l])=>`<button data-tab="${k}" class="${VIEW.tab===k?'on':''}">${l} ${c[k]?`(${c[k]})`:''}</button>`).join('')}
  </div>
  <div class="tools">
    <div class="srch"><input id="q" placeholder="Search item, SKU or supplier…" value="${esc(VIEW.q)}"></div>
    <select class="sel" data-filter="cat">
      <option value="all" ${VIEW.cat==='all'?'selected':''}>Parts and tools</option>
      <option value="part" ${VIEW.cat==='part'?'selected':''}>Parts only</option>
      <option value="tool" ${VIEW.cat==='tool'?'selected':''}>Tools only</option></select>
  </div>
  <div class="card"><div class="card-b flush" id="listHost">${warList()}</div></div>`;
}
function warList(){
  const q=VIEW.q.toLowerCase();
  const L=warItems()
    .filter(x=>VIEW.tab==='all'||x.st===VIEW.tab)
    .filter(x=>VIEW.cat==='all'||x.kind===VIEW.cat)
    .filter(x=>!q||(x.name+' '+x.code+' '+(x.o.sup||'')).toLowerCase().includes(q))
    .sort((a,b)=>{const r={exp:0,soon:1,ok:2,none:3};
      return r[a.st]-r[b.st]||(a.until&&b.until?new Date(a.until)-new Date(b.until):0);});
  if(!L.length)return empty('▣','Nothing here','No items in this warranty status.');
  const cd=x=>{
    if(!x.until)return '<span style="color:var(--ink3)">—</span>';
    const d=daysTo(x.until);
    return d<0?`<b style="color:var(--out)">${Math.abs(d)} days ago</b>`
      :d<=60?`<b style="color:var(--low)">in ${d} days</b>`
      :`<span style="color:var(--ink2)">in ${Math.round(d/30)} months</span>`;};
  const act=x=>can('edit')
    ?`<button class="btn sm" onclick="${x.kind==='part'?`partModal('${x.o.id}')`:`toolModal('${x.o.id}')`}">Edit</button>`:'';
  return `<table class="tbl"><thead><tr><th>Item</th><th>Type</th><th>Site</th><th>Supplier</th>
    <th>Term</th><th>Started</th><th>Expires</th><th>Countdown</th><th>Status</th><th></th></tr></thead><tbody>
    ${L.map(x=>`<tr><td><div class="pname">${esc(x.name)}</div>
      <div class="psku">${esc(x.code)} · ${esc(x.sub)}</div></td>
      <td><span class="pill ${x.kind==='part'?'br':'mute'}">${x.kind}</span></td>
      <td class="mono" style="font-size:12px">${esc(x.o.site)}</td>
      <td style="color:var(--ink2)">${esc(x.o.sup||'—')}</td>
      <td class="mono" style="font-size:12px">${x.o.war?x.o.war+' mo':'—'}</td>
      <td class="mono" style="font-size:12px">${fmtD(x.o.warFrom)}</td>
      <td class="mono" style="font-size:12px"><b>${x.until?fmtD(x.until):'—'}</b></td>
      <td style="font-size:12.5px">${cd(x)}</td><td>${warPill(x.st)}</td>
      <td style="text-align:right">${act(x)}</td></tr>`).join('')}</tbody></table>
    <div class="rows">${L.map(x=>`<div class="row"><div class="row-m">
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div style="flex:1;min-width:0"><div class="pname">${esc(x.name)}</div>
        <div class="psku">${esc(x.code)} · ${esc(x.o.site)} · ${esc(x.o.sup||x.sub)}</div></div>${warPill(x.st)}</div>
      ${x.until?`<div style="margin-top:7px;font-size:12.5px">Expires <b class="mono">${fmtD(x.until)}</b> — ${cd(x)}</div>
        <div style="font-size:12px;color:var(--ink3);margin-top:2px">${x.o.war} month term from ${fmtD(x.o.warFrom)}</div>`
        :'<div style="margin-top:7px;font-size:12.5px;color:var(--ink3)">No supplier warranty recorded</div>'}
      ${act(x)?`<div class="row-x">${act(x)}</div>`:''}</div></div>`).join('')}</div>`;
}

function poList(){

  if(!L.length)return empty('⇄','No orders here','Raise one from a reorder suggestion or the New order button.');

/* ---------- stepper + pickers ---------- */
function stepper(id,val,max){return `<div class="step">
  <button type="button" onclick="bump('${id}',-1)">−</button>
  <input id="${id}" type="number" inputmode="numeric" value="${val}" min="0" ${max!=null?`max="${max}"`:''}>
  <button type="button" onclick="bump('${id}',1)">＋</button></div>`;}
function bump(id,d){const i=document.getElementById(id);let v=(parseInt(i.value)||0)+d;
  if(v<0)v=0; if(i.max&&v>+i.max)v=+i.max; i.value=v; i.dispatchEvent(new Event('input'));}
function partOpts(sel){return S.parts.filter(p=>VIEW.site==='all'||p.site===VIEW.site)
  .sort((a,b)=>a.name.localeCompare(b.name))
  .map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)} — ${esc(p.sku)} (${p.qty} ${esc(p.unit)} @ ${esc(p.site)})</option>`).join('');}

/* ---------- issue / receive / adjust ---------- */
function issueModal(id){
  if(!can('issue'))return toast('Your role cannot issue stock','bad');
  const first=id||filterParts()[0]?.id||S.parts[0].id;
  openModal('Issue parts','Take stock out of the store',
   `<div class="fld"><label>Part</label><select id="ipPart" onchange="issueSync()">${partOpts(first)}</select></div>
    <div class="fld"><label>Quantity to issue</label>${stepper('ipQty',1)}
      <div class="hlp" id="ipHint"></div></div>
    <div class="fld"><label>Issued to</label><input id="ipTo" value="${esc(VIEW.user.name)}" placeholder="Technician name"></div>
    <div class="fld"><label>Work order / reason</label><input id="ipRef" placeholder="e.g. WO-2280 PCS-2 fan replacement"></div>`,
   `<button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doIssue()">Issue stock</button>`);
  $('#ipQty').addEventListener('input',issueSync); issueSync();
}
function issueSync(){const p=partById($('#ipPart').value),q=parseInt($('#ipQty').value)||0;
  const after=p.qty-q;
  $('#ipHint').innerHTML=`On hand ${p.qty} ${esc(p.unit)} → <b style="color:${after<0?'var(--out)':after<=p.min?'var(--low)':'var(--ok)'}">${after} after issue</b>
    ${after<0?' — not enough stock':after<=p.min&&after>=0?' — will drop below minimum':''}`;
  $('#ipQty').max=p.qty;
}
function doIssue(){
  const p=partById($('#ipPart').value), q=parseInt($('#ipQty').value)||0;
  const to=$('#ipTo').value.trim()||VIEW.user.name, ref=$('#ipRef').value.trim();
  if(q<1)return toast('Enter a quantity of 1 or more','bad');
  if(q>p.qty)return toast(`Only ${p.qty} ${p.unit} on hand`,'bad');
  p.qty-=q; p.updated=Date.now();
  logIt('issue',`Issued ${q} × ${p.name} to ${to}${ref?' ('+ref+')':''}`,p.site,
    {part:p.id,qty:q,value:+(q*p.cost).toFixed(2)});
  save(); closeModal(); buildNav(); render();
  toast(`Issued ${q} ${p.unit} — ${p.qty} left`,'good');
}
function receiveModal(id){
  if(!can('receive'))return toast('Your role cannot receive stock','bad');
  const first=id||S.parts[0].id;
  openModal('Receive stock','Book delivered goods into the store',
   `<div class="fld"><label>Part</label><select id="rcPart" onchange="rcSync()">${partOpts(first)}</select></div>
    <div class="fld"><label>Quantity received</label>${stepper('rcQty',1)}<div class="hlp" id="rcHint"></div></div>
    <div class="fld"><label>Delivery note / PO reference</label><input id="rcRef" placeholder="e.g. PO-2608-013"></div>`,
   `<button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doReceive()">Receive stock</button>`);
  $('#rcQty').addEventListener('input',rcSync); rcSync();
}
function rcSync(){const p=partById($('#rcPart').value),q=parseInt($('#rcQty').value)||0;
  $('#rcHint').innerHTML=`On hand ${p.qty} → <b style="color:var(--ok)">${p.qty+q} ${esc(p.unit)}</b> · bin ${esc(p.bin)}`;}
function doReceive(){
  const p=partById($('#rcPart').value), q=parseInt($('#rcQty').value)||0, ref=$('#rcRef').value.trim();
  if(q<1)return toast('Enter a quantity of 1 or more','bad');
  p.qty+=q; p.updated=Date.now();
  if(p.war)p.warFrom=iso(today());          // new batch restarts the supplier warranty

/* ---------- photo picker (shared by the part and tool editors) ---------- */
let EDITPH;   // undefined = untouched, '' = remove, otherwise dataURL or http link
function photoField(o){
  EDITPH=undefined;
  const src=photoSrc(o);
  return `<div class="fld"><label>Photo</label><div class="phfld">
    <div id="phPrev">${src?`<img class="pv" src="${esc(src)}" alt="">`:'<div class="pv ph0">▤</div>'}</div>
    <div style="flex:1;min-width:0">
      <div class="ac">
        <label class="lbl-btn">Upload photo
          <input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)"></label>
        <button type="button" class="btn sm" onclick="linkPhoto()">Use a link</button>
        <button type="button" class="btn sm" onclick="clearPhoto()">Remove</button>
      </div>
      <div class="hlp" id="phHint">${src
        ?(/^https?:/i.test(o.photo||'')?'Currently linked to an external image.':'Stored on this device.')
        :'On a phone this opens the camera or your gallery.'}</div>
    </div></div></div>`;
}
function phPreview(src,hint){
  $('#phPrev').innerHTML=src?`<img class="pv" src="${esc(src)}" alt="">`:'<div class="pv ph0">▤</div>';
  $('#phHint').textContent=hint;
}
async function pickPhoto(inp){
  const f=inp.files&&inp.files[0]; inp.value='';
  if(!f)return;
  $('#phHint').textContent='Processing…';
  try{
    const data=await shrinkImage(f);
    const kb=Math.round(data.length*0.75/1024);
    if(photoBytes()+data.length>PH_BUDGET)
      return phPreview(photoSrc({photo:EDITPH}),'Photo storage is full. Remove some photos first, or use a link instead.');
    EDITPH=data;
    phPreview(data,`Ready to save · ${kb} KB (resized from ${Math.round(f.size/1024)} KB)`);
  }catch(e){ phPreview(null,e.message); }
}
function linkPhoto(){
  const cur=EDITPH!==undefined&&/^https?:/i.test(EDITPH||'')?EDITPH:'';
  const v=prompt('Paste the image address (must start with https://)',cur);
  if(v===null)return;
  const u=v.trim();
  if(!u){EDITPH='';return phPreview(null,'Photo will be removed on save.');}
  if(!/^https?:\/\//i.test(u))return toast('Links must start with http:// or https://','bad');
  EDITPH=u; phPreview(u,'Linked image. Nothing is stored on this device.');
}
function clearPhoto(){EDITPH='';phPreview(null,'Photo will be removed on save.');}
/** Apply the pending picker choice to an item. Returns true if photos changed. */
function commitPhoto(o){
  if(EDITPH===undefined)return false;
  if(o.photo&&!/^https?:/i.test(o.photo))delete PH[o.photo];
  if(EDITPH===''){o.photo='';}
  else if(/^https?:/i.test(EDITPH)){o.photo=EDITPH;}
  else{const id=uid('ph'); PH[id]=EDITPH; o.photo=id;}
  EDITPH=undefined;
  return true;
}

        <option value="">＋ Add a part to this order…</option>${partOpts()}</select></div>
    <div class="fld"><label>Notes</label><textarea id="poNotes">${o?esc(o.notes):''}</textarea></div>`,
   `<button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="savePO('${id||''}')">${o?'Save order':'Create order'}</button>`);
  poLines();
}
function poLines(){
  const h=$('#poLines'); if(!h)return;
  if(!poDraft.length){h.innerHTML=`<div style="padding:14px;text-align:center;color:var(--ink3);font-size:12.5px;
    border:1px dashed var(--line2);border-radius:9px">No lines yet — add a part below.</div>`;return;}
  h.innerHTML=poDraft.map((l,i)=>{const p=partById(l.part);if(!p)return '';
    return `<div style="display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${esc(p.name)}</div>
        <div class="psku">${esc(p.sku)} · on hand ${p.qty}/${p.min} · ${money(l.cost)} each</div></div>
      <input type="number" value="${l.qty}" min="1" style="width:64px;padding:7px;border:1px solid var(--line);
        border-radius:7px;text-align:center;font-family:var(--mono)" oninput="poQty(${i},this.value)">
      <button class="btn sm" onclick="poDel(${i})">✕</button></div>`;}).join('')+
    `<div style="display:flex;justify-content:space-between;padding-top:10px;font-size:14px">
      <b>Order total</b><b class="mono">${money(poDraft.reduce((a,l)=>a+l.qty*l.cost,0))}</b></div>`;
}
function poAddLine(){const id=$('#poAdd').value; if(!id)return; $('#poAdd').value='';
  if(poDraft.some(l=>l.part===id))return toast('Already on this order','bad');
  const p=partById(id); poDraft.push({part:id,qty:reorderQty(p),cost:p.cost});
  if(!$('#poSup').value)$('#poSup').value=p.sup; poLines();}
function poQty(i,v){poDraft[i].qty=Math.max(1,parseInt(v)||1);poLines();}
function poDel(i){poDraft.splice(i,1);poLines();}
function savePO(id){
  const sup=$('#poSup').value.trim(), site=$('#poSite').value, eta=$('#poEta').value, notes=$('#poNotes').value.trim();
  if(!sup)return toast('Supplier is required','bad');
  if(!poDraft.length)return toast('Add at least one line','bad');
  if(id){const o=S.pos.find(x=>x.id===id);Object.assign(o,{sup,site,eta,notes,lines:poDraft.map(l=>({...l}))});
    logIt('po',`Updated ${o.no} — ${o.lines.length} line${o.lines.length>1?'s':''}, ${money(poTotal(o))}`,site);}
  else{S.cfg.poSeq=(S.cfg.poSeq||0)+1;
    const d=new Date(), no='PO-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+'-'+String(S.cfg.poSeq).padStart(3,'0');
    const o={id:uid('po'),no,sup,site,status:'draft',created:Date.now(),eta,by:VIEW.user.u,notes,lines:poDraft.map(l=>({...l}))};
    S.pos.unshift(o);
    logIt('po',`Created ${no} — ${sup}, ${o.lines.length} line${o.lines.length>1?'s':''}, ${money(poTotal(o))}`,site);}
  poDraft=[]; save(); closeModal(); buildNav(); render(); toast(id?'Order saved':'Order created as draft','good');
}
function poAdvance(id,to){
  const o=S.pos.find(x=>x.id===id);
  if(to==='ordered'&&!can('poApprove'))return toast('A manager must approve draft orders','bad');
  if(to==='received'){
    let n=0; o.lines.forEach(l=>{const p=partById(l.part);if(!p)return;
      p.qty+=l.qty; p.updated=Date.now(); n+=l.qty;
      if(p.war)p.warFrom=iso(today());
      logIt('receive',`Received ${l.qty} × ${p.name} on ${o.no}`,p.site,
        {part:p.id,qty:l.qty,value:+(l.qty*l.cost).toFixed(2)});});
    o.status='received'; logIt('po',`${o.no} received — ${n} items booked into ${o.site} store`,o.site);
    save(); closeModal(); buildNav(); render(); return toast(`${o.no} received — ${n} items added to stock`,'good');
  }
  o.status=to;
  logIt('po',`${o.no} marked as ${to==='shipped'?'in transit':to}`,o.site);
  save(); closeModal(); buildNav(); render(); toast(`${o.no} → ${to==='shipped'?'in transit':to}`,'good');
}
function poCancel(id){const o=S.pos.find(x=>x.id===id);
  openModal('Cancel order',o.no,`<p style="font-size:13.5px;margin:0">Cancel <b>${esc(o.no)}</b> to
    ${esc(o.sup)}? Stock will not be booked in and the order closes.</p>`,
   `<button class="btn" onclick="closeModal()">Keep order</button>
    <button class="btn dgr" onclick="doPoCancel('${id}')">Cancel order</button>`);}
function doPoCancel(id){const o=S.pos.find(x=>x.id===id);o.status='cancelled';
  logIt('po',`Cancelled ${o.no} (${o.sup})`,o.site);
  save(); closeModal(); buildNav(); render(); toast('Order cancelled','good');}

/* ---------- admin ---------- */
function siteModal(id){
  if(!can('admin'))return toast('Manager access required','bad');
  const s=id?S.sites.find(x=>x.id===id):{id:'',name:'',code:''};
  openModal(id?'Edit site':'Add site',id?s.id:'New location',
   `<div class="fld"><label>Site name</label><input id="sfName" value="${esc(s.name)}" placeholder="Bavet BESS 20MW"></div>
    <div class="fld"><label>Short code</label><input id="sfCode" class="mono" value="${esc(s.code)}" maxlength="6"
      placeholder="BVT" ${id?'disabled':''}><div class="hlp">Used on labels and bin references. Cannot change later.</div></div>`,
   `<button class="btn" onclick="closeModal()">Cancel</button>
    ${id&&S.sites.length>1?`<button class="btn dgr" onclick="doDelSite('${id}')">Delete</button>`:''}
    <button class="btn pri" onclick="saveSite('${id||''}')">Save site</button>`);
}
function saveSite(id){
  const name=$('#sfName').value.trim(), code=$('#sfCode').value.trim().toUpperCase();
  if(!name)return toast('Site name is required','bad');
  if(id){S.sites.find(x=>x.id===id).name=name;}
  else{if(!code)return toast('Short code is required','bad');
    if(S.sites.some(x=>x.id===code))return toast('That code is already used','bad');
    S.sites.push({id:code,name,code});}
  save(); closeModal(); buildSites(); render(); toast('Site saved','good');
}
function doDelSite(id){
  if(S.parts.some(p=>p.site===id)||S.tools.some(t=>t.site===id))
    return toast('Move its parts and tools out first','bad');
  S.sites=S.sites.filter(x=>x.id!==id); if(VIEW.site===id)VIEW.site='all';
  save(); closeModal(); buildSites(); render(); toast('Site deleted','good');
}
function userModal(u){
  if(!can('admin'))return toast('Manager access required','bad');
  const a=u?S.users.find(x=>x.u===u):{u:'',p:'',name:'',role:'tech',site:'all'};
  openModal(u?'Edit account':'Add account',u?a.name:'New user',
   `<div class="fld"><label>Full name</label><input id="ufName" value="${esc(a.name)}"></div>
    <div class="f2"><div class="fld"><label>Username</label><input id="ufUser" class="mono" value="${esc(a.u)}"
      ${u?'disabled':''} autocapitalize="none"></div>
    <div class="fld"><label>Password</label><input id="ufPass" class="mono" value="${esc(a.p)}"></div></div>
    <div class="f2"><div class="fld"><label>Role</label><select id="ufRole">
      ${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${a.role===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
    <div class="fld"><label>Site access</label><select id="ufSite">
      <option value="all" ${a.site==='all'?'selected':''}>All sites</option>
      ${S.sites.map(s=>`<option value="${s.id}" ${a.site===s.id?'selected':''}>${esc(s.code)} — ${esc(s.name)}</option>`).join('')}</select></div></div>`,
   `<button class="btn" onclick="closeModal()">Cancel</button>
    ${u&&u!==VIEW.user.u?`<button class="btn dgr" onclick="doDelUser('${u}')">Delete</button>`:''}

}
function saveUser(u){
  const name=$('#ufName').value.trim(), user=$('#ufUser').value.trim().toLowerCase(),
        p=$('#ufPass').value, role=$('#ufRole').value, site=$('#ufSite').value;
  if(!name||!p)return toast('Name and password are required','bad');
  if(u){Object.assign(S.users.find(x=>x.u===u),{name,p,role,site});}
  else{if(!user)return toast('Username is required','bad');
    if(S.users.some(x=>x.u===user))return toast('That username already exists','bad');
    S.users.push({u:user,p,name,role,site});}
  save(); closeModal(); render(); toast('Account saved','good');
}
function doDelUser(u){S.users=S.users.filter(x=>x.u!==u);save();closeModal();render();toast('Account deleted','good');}
function pwModal(){
  openModal('Change password',VIEW.user.name,
   `<div class="fld"><label>Current password</label><input id="pwOld" type="password"></div>
    <div class="fld"><label>New password</label><input id="pwNew" type="password">
      <div class="hlp">At least 6 characters.</div></div>
    <div class="fld"><label>Confirm new password</label><input id="pwNew2" type="password"></div>`,

}
function doPw(){
  const o=$('#pwOld').value, n=$('#pwNew').value, n2=$('#pwNew2').value;
  const me=S.users.find(x=>x.u===VIEW.user.u);
  if(o!==me.p)return toast('Current password is not correct','bad');
  if(n.length<6)return toast('Use at least 6 characters','bad');
  if(n!==n2)return toast('The two new passwords do not match','bad');

function saveBrand(){
  const nm=$('#cfgName').value.trim()||'SPARE PARTS MANAGEMENT SYSTEM';

function saveUrl(){S.cfg.sheetUrl=$('#cfgUrl').value.trim();save();render();

function prunePhotos(){
  const used=new Set([...S.parts,...S.tools].map(o=>o.photo).filter(Boolean));
  const dead=Object.keys(PH).filter(k=>!used.has(k));
  if(!dead.length)return toast('No unused photos to remove');
  dead.forEach(k=>delete PH[k]);
  savePhotos(); render();
  toast(`Removed ${dead.length} unused photo${dead.length===1?'':'s'}`,'good');
}
function clearPhotos(){
  if(!can('admin'))return toast('Manager access required','bad');
  openModal('Delete all device photos','Linked images are not affected',
    `<p style="font-size:13.5px;margin:0">This removes every uploaded photo from this device
      (${Object.keys(PH).length} images, ${(photoBytes()/1024/1024).toFixed(2)} MB). Parts and tools stay,
      they just lose their picture. Export a backup first if you want to keep them.</p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn dgr" onclick="doClearPhotos()">Delete all photos</button>`);
}
function doClearPhotos(){
  PH={};
  [...S.parts,...S.tools].forEach(o=>{if(o.photo&&!/^https?:/i.test(o.photo))o.photo='';});
  savePhotos(); save(); closeModal(); render(); toast('Device photos deleted','good');
}

/* ---------- Google Sheets sync ---------- */
function setSync(t,cls){$('#syncDot').textContent=t;$('#syncDot').style.color=cls||'';}
async function syncPush(){
  if(!S.cfg.sheetUrl)return toast('Add the Apps Script URL first','bad');
  setSync('● syncing…','#C2740D'); toast('Pushing to Google Sheets…');
  try{
    await fetch(S.cfg.sheetUrl,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'push',payload:{parts:S.parts,tools:S.tools,pos:S.pos,sites:S.sites,log:S.log.slice(0,200)}})});
    S.cfg.lastSync=Date.now(); save();
    setSync('● synced '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),'#8FE3C8');
    toast('Pushed to Google Sheets','good');
  }catch(e){setSync('● sync failed','#FF9A92');toast('Could not reach the Sheets endpoint','bad');}
}
async function syncPull(){
  if(!S.cfg.sheetUrl)return toast('Add the Apps Script URL first','bad');
  setSync('● syncing…','#C2740D');
  try{
    const r=await fetch(S.cfg.sheetUrl+'?action=pull');
    const d=await r.json();
    if(!d||!d.parts)throw 0;
    S.parts=d.parts; if(d.tools)S.tools=d.tools; if(d.pos)S.pos=d.pos; if(d.sites)S.sites=d.sites;
    S.cfg.lastSync=Date.now(); save(); buildSites(); buildNav(); render();
    setSync('● synced '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),'#8FE3C8');
    toast('Pulled from Google Sheets','good');
  }catch(e){setSync('● sync failed','#FF9A92');toast('Could not read from the Sheets endpoint','bad');}
}
