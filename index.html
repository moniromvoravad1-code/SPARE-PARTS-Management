/**
 * js/session.js - Session management and user tracking
 */

const SESSION_CONFIG = {
  inactivityTimeout: 15 * 60 * 1000, // 15 minutes
  warningTime: 2 * 60 * 1000, // Show warning 2 minutes before timeout
  maxSessionDuration: 8 * 60 * 60 * 1000, // 8 hours max session
  enableTracking: true
};

let SESSION_DATA = {
  startTime: null,
  lastActivityTime: null,
  warningShown: false,
  inactivityTimer: null,
  warningTimer: null,
  trackingEvents: []
};

/**
 * Initialize session tracking
 */
function initSessionTracking() {
  if (!SESSION_CONFIG.enableTracking || !VIEW.user) return;

  SESSION_DATA.startTime = Date.now();
  SESSION_DATA.lastActivityTime = Date.now();
  SESSION_DATA.warningShown = false;
  SESSION_DATA.trackingEvents = [];

  // Track user activity
  setupActivityTracking();

  // Log session start
  logIt('session_start', `Session started for ${VIEW.user.name}`, 'all', {
    user: VIEW.user.u,
    role: VIEW.user.role,
    site: VIEW.site
  });
}

/**
 * Setup activity tracking
 */
function setupActivityTracking() {
  const trackActivity = () => {
    SESSION_DATA.lastActivityTime = Date.now();
    SESSION_DATA.warningShown = false;
    resetInactivityTimers();
  };

  // Events that count as activity
  document.addEventListener('click', trackActivity);
  document.addEventListener('keydown', trackActivity);
  document.addEventListener('mousemove', trackActivity);
  document.addEventListener('scroll', trackActivity);

  // Start inactivity timers
  resetInactivityTimers();
}

/**
 * Reset inactivity timers
 */
function resetInactivityTimers() {
  if (!VIEW.user) return;

  // Clear existing timers
  if (SESSION_DATA.inactivityTimer) clearTimeout(SESSION_DATA.inactivityTimer);
  if (SESSION_DATA.warningTimer) clearTimeout(SESSION_DATA.warningTimer);

  // Warning timer
  SESSION_DATA.warningTimer = setTimeout(() => {
    if (!SESSION_DATA.warningShown && VIEW.user) {
      SESSION_DATA.warningShown = true;
      showSessionWarning();
    }
  }, SESSION_CONFIG.inactivityTimeout - SESSION_CONFIG.warningTime);

  // Timeout timer
  SESSION_DATA.inactivityTimer = setTimeout(() => {
    if (VIEW.user) {
      logIt('session_timeout', 'Session timed out due to inactivity', 'all', {
        duration: Date.now() - SESSION_DATA.startTime,
        lastActivity: Date.now() - SESSION_DATA.lastActivityTime
      });
      signOut();
      toast('Your session has expired. Please log in again.', 'bad');
    }
  }, SESSION_CONFIG.inactivityTimeout);
}

/**
 * Show session warning
 */
function showSessionWarning() {
  const remaining = Math.ceil(SESSION_CONFIG.warningTime / 1000);

  toast(`Session will expire in ${remaining} seconds. Click to stay logged in.`, 'bad');

  // Make toast clickable to reset timer
  const toastEl = $('#toast');
  toastEl.style.cursor = 'pointer';
  toastEl.onclick = () => {
    SESSION_DATA.lastActivityTime = Date.now();
    SESSION_DATA.warningShown = false;
    resetInactivityTimers();
    toast('Session reset. You are still logged in.', 'good');
  };
}

/**
 * Get session duration
 */
function getSessionDuration() {
  if (!SESSION_DATA.startTime) return 0;
  return Date.now() - SESSION_DATA.startTime;
}

/**
 * Get inactivity time
 */
function getInactivityTime() {
  if (!SESSION_DATA.lastActivityTime) return 0;
  return Date.now() - SESSION_DATA.lastActivityTime;
}

/**
 * Format session duration for display
 */
function formatSessionDuration(ms) {
  const hours = Math.floor(ms / (1000 * 60 * 60));
  const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((ms % (1000 * 60)) / 1000);

  if (hours > 0) {
    return `${hours}h ${minutes}m`;
  } else if (minutes > 0) {
    return `${minutes}m ${seconds}s`;
  } else {
    return `${seconds}s`;
  }
}

/**
 * Get session info
 */
function getSessionInfo() {
  if (!VIEW.user) return null;

  return {
    user: VIEW.user.name,
    role: VIEW.user.role,
    site: VIEW.site,
    startTime: SESSION_DATA.startTime,
    duration: getSessionDuration(),
    inactivityTime: getInactivityTime(),
    durationFormatted: formatSessionDuration(getSessionDuration()),
    inactivityFormatted: formatSessionDuration(getInactivityTime())
  };
}

/**
 * End session and log activity
 */
function endSession() {
  if (!VIEW.user) return;

  const duration = getSessionDuration();

  logIt('session_end', `Session ended for ${VIEW.user.name}`, 'all', {
    user: VIEW.user.u,
    duration: duration,
    durationFormatted: formatSessionDuration(duration)
  });

  // Clear timers
  if (SESSION_DATA.inactivityTimer) clearTimeout(SESSION_DATA.inactivityTimer);
  if (SESSION_DATA.warningTimer) clearTimeout(SESSION_DATA.warningTimer);

  SESSION_DATA = {
    startTime: null,
    lastActivityTime: null,
    warningShown: false,
    inactivityTimer: null,
    warningTimer: null,
    trackingEvents: []
  };
}

/**
 * Show session info modal
 */
function showSessionInfo() {
  if (!VIEW.user) return;

  const info = getSessionInfo();

  openModal(
    'Session Information',
    `${info.user} · ${info.role}`,
    `
      <div class="kv">
        <span>Duration</span>
        <b>${info.durationFormatted}</b>
      </div>
      <div class="kv">
        <span>Inactivity Time</span>
        <b>${info.inactivityFormatted}</b>
      </div>
      <div class="kv">
        <span>Current Site</span>
        <b>${siteName(info.site)}</b>
      </div>
      <div class="kv">
        <span>Session Start</span>
        <b>${fmtDT(info.startTime)}</b>
      </div>
      <div class="kv">
        <span>Session Timeout</span>
        <b>${formatSessionDuration(SESSION_CONFIG.inactivityTimeout)}</b>
      </div>
    `,

  );
}

/* ===== js/models/logs.js ===== */
/**
 * js/models/logs.js - Activity log queries and filtering
 */

/**
 * Get flow of movements (issues/receives) between two dates
 * @param {string} type - 'issue' or 'receive'
 * @param {Date} from - Start date
 * @param {Date} to - End date
 * @returns {Object} {qty, val, n, lines}
 */
function flow(type, from, to) {
  const a = +from;
  const b = to == null ? Date.now() + DAY : +to;
  const L = S.log.filter(
    (l) =>
      l.type === type &&
      l.qty &&
      (VIEW.site === 'all' || l.site === VIEW.site) &&
      l.ts >= a &&
      l.ts < b
  );
  return {
    qty: L.reduce((s, l) => s + l.qty, 0),
    val: L.reduce((s, l) => s + (l.value || 0), 0),
    n: L.length,
    lines: L
  };
}

/**
 * How many buckets each period shows, and what the last one is called
 */
const FLOW_SPANS = {
  day: { n: 30, label: 'Last 30 days', partial: 'today' },
  week: { n: 12, label: 'Last 12 weeks', partial: 'this week' },
  month: { n: 12, label: 'Last 12 months', partial: 'this month' },
  year: { n: 5, label: 'Last 5 years', partial: 'this year' }
};

/**
 * Value in and out per period, oldest first.
 *
 * The last bucket is the one in progress, so it is always short — it is
 * flagged with `now` so the chart can mark it as partial rather than let it
 * read as a collapse in activity.
 *
 * @param {string} kind - 'day' | 'week' | 'month' | 'year'
 * @param {number} [count] - buckets to return; defaults to the span above
 */
function flowBy(kind, count) {
  const span = FLOW_SPANS[kind] || FLOW_SPANS.month;
  const n = count || span.n;
  const d = today();
  const out = [];

  const bucket = (from, to, label, year, now) => {
    const issued = use(from, to);
    const received = stockIn(from, to);
    return {
      label,
      year,
      out: issued.val,
      in: received.val,
      outQty: issued.qty,
      inQty: received.qty,
      now
    };
  };

  for (let i = n - 1; i >= 0; i--) {
    const now = i === 0;
    let from;
    let to;
    let label;

    if (kind === 'day') {
      from = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i);
      to = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i + 1);
      label = String(from.getDate());
    } else if (kind === 'week') {
      const ws = weekStart();
      from = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() - i * 7);
      to = new Date(from.getFullYear(), from.getMonth(), from.getDate() + 7);
      label = from.getDate() + ' ' + MON[from.getMonth()];
    } else if (kind === 'year') {
      const y = d.getFullYear() - i;
      from = new Date(y, 0, 1);
      to = new Date(y + 1, 0, 1);
      label = String(y);
    } else {
      from = new Date(d.getFullYear(), d.getMonth() - i, 1);
      to = new Date(d.getFullYear(), d.getMonth() - i + 1, 1);
      label = MON[from.getMonth()];
    }

    out.push(bucket(from, to, label, from.getFullYear(), now));
  }

  return out;
}

/**
 * Get parts issued out of store
 */
const use = (f, t) => flow('issue', f, t);

/**
 * Get goods received into store
 */
const stockIn = (f, t) => flow('receive', f, t);

/**
 * Get flow from previous period (for comparisons)
 */
function flowPrev(type, kind) {
  const now = Date.now();

  if (kind === 'week') {
    const w = +weekStart();
    return flow(type, w - 7 * DAY, w - 7 * DAY + (now - w));
  }

  if (kind === 'month') {
    const m = monthStart();
    const el = now - m;
    const pm = new Date(m.getFullYear(), m.getMonth() - 1, 1);
    return flow(type, pm, +pm + el);
  }

  const y = yearStart();
  const el = now - y;
  const py = new Date(y.getFullYear() - 1, 0, 1);
  return flow(type, py, +py + el);
}

const usePrev = (k) => flowPrev('issue', k);

/**
 * Get consumption by calendar month
 */
function byMonth(n) {
  const out = [];
  const d = today();

  for (let i = n - 1; i >= 0; i--) {
    const s = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const e = new Date(d.getFullYear(), d.getMonth() - i + 1, 1);
    const o = use(s, e);
    const inn = stockIn(s, e);

    out.push({
      label: MON[s.getMonth()],
      year: s.getFullYear(),
      out: o.val,
      in: inn.val,
      outQty: o.qty,
      inQty: inn.qty,
      now: i === 0
    });
  }

  return out;
}

const useByMonth = (n) => byMonth(n);

/**
 * Get top consumed parts
 */
function topUsed(from, limit) {
  const m = {};

  use(from).lines.forEach((l) => {
    if (!m[l.part]) m[l.part] = { qty: 0, val: 0 };
    m[l.part].qty += l.qty;
    m[l.part].val += l.value || 0;
  });

  return Object.entries(m)
    .map(([id, v]) => ({ p: partById(id), ...v }))
    .filter((x) => x.p)
    .sort((a, b) => b.val - a.val)
    .slice(0, limit || 5);
}

/**
 * js/models/warranty.js - Warranty calculations and tracking
 */

/**
 * Calculate warranty expiration date
 */
function warUntil(o) {
  return (o && o.war && o.warFrom) ? addD(o.war * 30, o.warFrom) : null;
}

/**
 * Get warranty state of an item
 * @returns {string} 'none' | 'ok' | 'soon' | 'exp'
 */
function warState(o) {
  const u = warUntil(o);
  if (!u) return 'none';
  const d = daysTo(u);
  return d < 0 ? 'exp' : d <= 60 ? 'soon' : 'ok';
}

/**
 * Get all warranted items (parts and tools combined)
 */
function warItems() {
  return [
    ...S.parts
      .filter(inSite)
      .map((p) => ({
        kind: 'part',
        o: p,
        name: p.name,
        code: p.sku,
        sub: `${p.qty} ${p.unit} on hand`,
        val: p.qty * p.cost
      })),
    ...S.tools
      .filter(inSite)
      .map((t) => ({
        kind: 'tool',
        o: t,
        name: t.name,
        code: t.code,
        sub: t.cat,
        val: 0
      }))
  ]
    .map((x) => ({
      ...x,
      st: warState(x.o),
      until: warUntil(x.o)
    }));
}

/**
 * Get items with warranty expiring soon (within 60 days)
 */
const warExpiring = () => warItems().filter((x) => x.st === 'soon');

/**
 * Get items with expired warranty
 */
const warExpired = () => warItems().filter((x) => x.st === 'exp');

/**
 * Format warranty info for display
 */
function formatWarranty(o) {
  const state = warState(o);
  if (state === 'none') return 'No warranty';

  const until = warUntil(o);
  const days = daysTo(until);

  if (state === 'exp') return `Expired ${Math.abs(days)} days ago`;
  if (state === 'soon') return `Expires in ${days} days`;
  return `Valid for ${days} more days`;
}

/* ===== js/models/parts.js ===== */
/**
 * js/models/parts.js - Parts inventory management
 */

/**
 * Get stock state of a part
 * @param {Object} p - Part object
 * @returns {string} 'ok' | 'low' | 'out'
 */
function stockState(p) {
  if (p.qty <= 0) return 'out';
  if (p.qty <= p.min) return 'low';
  return 'ok';
}

/**
 * Get all parts with low stock
 */
const lowParts = () => S.parts.filter((p) => inSite(p) && stockState(p) !== 'ok');

/**
 * Get part by ID
 */
const partById = (id) => S.parts.find((p) => p.id === id);

/**
 * Get total stock value for current site
 */
const stockValue = () => S.parts.filter(inSite).reduce((a, p) => a + p.qty * p.cost, 0);

/**
 * Suggested reorder quantity - back up to twice the minimum, never less than one
 */
const reorderQty = (p) => Math.max(p.min * 2 - p.qty, p.min, 1);

/**
 * Create a new part
 */
function createPart(sku, name, cat, site, qty, min, unit, bin, cost, sup, lt) {
  return {
    id: uid('p'),
    sku,
    name,
    cat,
    site,
    qty,
    min,
    unit,
    bin,
    cost,
    sup,
    lt,
    photo: '',
    updated: Date.now()
  };
}

/**
 * Issue (decrease) part quantity
 */
function issuePart(partId, qty, site) {
  const p = partById(partId);
  if (!p) return false;

  p.qty = Math.max(0, p.qty - qty);
  p.updated = Date.now();

  const value = qty * p.cost;
  logIt('issue', `Issued ${qty} × ${p.name}`, site, {
    part: partId,
    qty,
    value
  });

  return true;
}

/**
 * Receive (increase) part quantity
 */
function receivePart(partId, qty, site) {
  const p = partById(partId);
  if (!p) return false;

  p.qty += qty;
  p.updated = Date.now();

  const value = qty * p.cost;
  logIt('receive', `Received ${qty} × ${p.name}`, site, {
    part: partId,
    qty,
    value
  });

  return true;
}

/**
 * Adjust part count (inventory correction)
 */
function adjustPart(partId, newQty, reason) {
  const p = partById(partId);
  if (!p) return false;

  const delta = newQty - p.qty;
  p.qty = newQty;
  p.updated = Date.now();

  logIt('adjust', `Stock adjustment: ${p.name} → ${newQty} (${reason})`, p.site);
  return true;
}

/**
 * Delete part (soft delete via log)
 */
function deletePart(partId) {
  const p = partById(partId);
  if (!p) return false;

  const idx = S.parts.indexOf(p);
  if (idx >= 0) {
    S.parts.splice(idx, 1);
    logIt('delete', `Deleted part: ${p.name}`, p.site);
    return true;
  }
  return false;
}

/* ===== js/models/tools.js ===== */
/**
 * js/models/tools.js - Tools management and calibration tracking
 */

/**
 * Get calibration state of a tool
 * @returns {string} 'na' | 'ok' | 'due' | 'exp'
 */
function calState(t) {
  if (!t.calInt || !t.calNext) return 'na';
  const d = daysTo(t.calNext);
  if (d < 0) return 'exp';
  if (d <= 30) return 'due';
  return 'ok';
}

/**
 * Get tool state (availability)
 * @returns {string} 'in' | 'out' | 'over' | 'maint'
 */
function toolState(t) {
  if (t.status === 'maint') return 'maint';
  if (t.status === 'out') return t.dueAt && daysTo(t.dueAt) < 0 ? 'over' : 'out';
  return 'in';
}

/**
 * Get all overdue tools (checked out past due date)
 */
const overTools = () => S.tools.filter((t) => inSite(t) && toolState(t) === 'over');

/**
 * Get all tools with calibration due or expired
 */
const calDue = () => S.tools.filter((t) => inSite(t) && ['due', 'exp'].includes(calState(t)));

/**
 * Checkout a tool
 */
function checkoutTool(toolId, holder, dueDate, site) {
  const t = S.tools.find((x) => x.id === toolId);
  if (!t) return false;

  t.status = 'out';
  t.holder = holder;
  t.outAt = Date.now();
  t.dueAt = dueDate;

  logIt('checkout', `Checked out ${t.name} — ${holder}`, site, { tool: toolId });
  return true;
}

/**
 * Return a tool
 */
function returnTool(toolId, site) {
  const t = S.tools.find((x) => x.id === toolId);
  if (!t) return false;

  t.status = 'in';
  t.holder = '';
  t.outAt = null;
  t.dueAt = null;

  logIt('return', `Returned ${t.name}`, site, { tool: toolId });
  return true;
}

/**
 * Update tool calibration record
 */
function calibrateTool(toolId, lastDate, nextDate, cert, site) {
  const t = S.tools.find((x) => x.id === toolId);
  if (!t) return false;

  t.calLast = lastDate;
  t.calNext = nextDate;
  t.cert = cert;

  logIt('calibration', `Calibrated ${t.name} (Cert: ${cert})`, site, { tool: toolId });
  return true;
}

/**
 * Get tool by ID
 */
const toolById = (id) => S.tools.find((t) => t.id === id);

/* ===== js/models/pos.js ===== */
/**
 * js/models/pos.js - Purchase order management
 */

/**
 * Get all open purchase orders (draft, ordered, shipped)
 */
const openPOs = () => S.pos.filter((o) => inSite(o) && ['draft', 'ordered', 'shipped'].includes(o.status));

/**
 * Get PO by ID
 */
const poById = (id) => S.pos.find((o) => o.id === id);

/**
 * Parts below minimum that are not already on an open order
 */
function sugList() {
  return lowParts().filter((p) => !openPOs().some((o) => o.lines.some((l) => l.part === p.id)));
}

/**
 * Create new purchase order
 */
function createPO(supplier, site, lines, notes) {
  const po = {
    id: uid('po'),
    no: `PO-${Date.now().toString().slice(-6)}`,
    sup: supplier,
    site,
    status: 'draft',
    created: Date.now(),
    eta: null,
    by: VIEW.user ? VIEW.user.u : 'system',
    notes,
    lines: lines || []
  };

  S.pos.push(po);
  logIt('po', `Created ${po.no} — ${supplier}, ${lines.length} line(s)`, site, { po: po.id });

  return po;
}

/**
 * Update PO status
 */
function updatePOStatus(poId, newStatus, eta) {
  const po = poById(poId);
  if (!po) return false;

  const oldStatus = po.status;
  po.status = newStatus;
  if (eta) po.eta = eta;

  logIt('po', `Updated ${po.no}: ${oldStatus} → ${newStatus}`, po.site, { po: poId });
  return true;
}

/**
 * Add line item to PO
 */
function addPOLine(poId, partId, qty, cost) {
  const po = poById(poId);
  if (!po) return false;

  po.lines.push({
    part: partId,
    qty,
    cost
  });

  return true;
}

/**
 * Remove line item from PO
 */
function removePOLine(poId, lineIndex) {
  const po = poById(poId);
  if (!po || lineIndex < 0 || lineIndex >= po.lines.length) return false;

  po.lines.splice(lineIndex, 1);
  return true;
}

/**
 * Get PO line value
 */
function poLineValue(line) {
  return line.qty * line.cost;
}

/**
 * Calculate total PO value
 */
function poTotal(po) {
  return po.lines.reduce((a, l) => a + poLineValue(l), 0);
}

/**
 * Approve a PO (manager only)
 */
function approvePO(poId) {
  if (!can('poApprove')) return false;

  return updatePOStatus(poId, 'ordered');
}

/**
 * Receive a PO
 */
function receivePO(poId) {
  const po = poById(poId);
  if (!po || po.status !== 'shipped') return false;

  // Receive each line item
  po.lines.forEach((line) => {
    receivePart(line.part, line.qty, po.site);
  });

  updatePOStatus(poId, 'received');
  logIt('receive', `Received ${po.no} from ${po.sup}`, po.site, { po: poId });

  return true;
}

/**
 * Migrate old data format to new format
 * Handles updating old site codes to new ones
 */
function migrate(s) {
  if (!s || s.v >= 3) return s;

  const fresh = seed();
  s.sites = fresh.sites;
  s.users = fresh.users;

  // Map old site codes to new
  const map = (id) => SITE_MIGRATION[id] || id;

  (s.parts || []).forEach((p) => (p.site = map(p.site)));
  (s.tools || []).forEach((t) => (t.site = map(t.site)));
  (s.pos || []).forEach((o) => (o.site = map(o.site)));
  (s.log || []).forEach((l) => {
    if (l.site) l.site = map(l.site);
  });
  (s.users || []).forEach((u) => {
    if (u.site && u.site !== 'all') u.site = map(u.site);
  });
  if (s.session && s.session.site) s.session.site = map(s.session.site);

  s.v = 3;
  return s;
}

/**

function closeModal() {
  $('#mask').classList.remove('on');
  $('#modal').classList.remove('wide');
  $('#modal').innerHTML = '';

  if (CLOUD_PENDING_RENDER) {
    CLOUD_PENDING_RENDER = false;
    if (VIEW.user) {

      buildNav();

/**
 * Open a modal dialog
 * @param {string} title - Modal title
 * @param {string} sub - Subtitle/description
 * @param {string} body - Modal body HTML
 * @param {string} footer - Footer with buttons HTML
 */
function openModal(title, sub, body, footer, wide) {
  const modalHtml = `
    <div class="m-h">
      <div>
        <div class="m-t">${esc(title)}</div>
        ${sub ? `<div class="m-s">${esc(sub)}</div>` : ''}
      </div>
      <button class="m-x" onclick="closeModal()">✕</button>
    </div>
    <div class="m-b">${body}</div>
    ${footer ? `<div class="m-f">${footer}</div>` : ''}
  `;
  $('#modal').innerHTML = modalHtml;
  $('#modal').classList.toggle('wide', !!wide);
  $('#mask').classList.add('on');

  // Auto-focus first input (desktop only)
  const f = $('#modal').querySelector('input:not([type=file]),select,textarea');
  if (f && window.innerWidth > 860) {
    setTimeout(() => f.focus(), 60);
  }
}

/**
 * Alert dialog
 */
function alertModal(title, message) {
  openModal(
    title,
    null,
    `<p style="color:var(--ink2); line-height:1.5">${esc(message)}</p>`,
    `<button class="btn pri" onclick="closeModal()">OK</button>`
  );
}

/**
 * Confirm dialog
 */
function confirmModal(title, message, onConfirm) {
  openModal(
    title,
    null,
    `<p style="color:var(--ink2); line-height:1.5">${esc(message)}</p>`,
    `
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="(${onConfirm})(); closeModal()">Confirm</button>
    `
  );
}

// Close modal when clicking on background
$('#mask').addEventListener('click', (e) => {
  if (e.target.id === 'mask') closeModal();
});

/**
 * Open a context menu
 * @param {HTMLElement} anchor - Anchor element
 * @param {string} html - Menu HTML content
 */
function openMenu(anchor, html) {
  const m = $('#menu');
  m.innerHTML = html;
  m.classList.add('on');

  // Position menu relative to anchor
  const r = anchor.getBoundingClientRect();
  const w = m.offsetWidth;
  const h = m.offsetHeight;

  let l = Math.min(r.left, window.innerWidth - w - 10);
  let t = r.bottom + 6;

  // If menu goes off bottom, show above instead
  if (t + h > window.innerHeight - 10) {
    t = Math.max(10, r.top - h - 6);
  }

  m.style.left = Math.max(10, l) + 'px';
  m.style.top = t + 'px';
}

// Close menu when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('#menu') && !e.target.closest('[data-menu]')) {
    closeMenu();
  }
});

/**
 * js/ui/photos.js - Photo handling, compression, and display
 */

let PH = {}; // Photo storage

/**
 * Get photo source URL for an item
 * @param {Object} o - Part or tool object
 * @returns {string|null} Photo URL or data URI
 */
/**
 * How many extra pictures an item may carry beyond its main one.
 */
const MAX_EXTRA_PHOTOS = 5;

/**
 * Image-loading failures, newest first, for the manager's diagnostic panel.
 * Kept in memory only - it describes this device's view of the store.
 */
let PHOTO_ERRORS = [];

function logPhotoError(kind, ref, o, detail) {
  const e = {
    at: Date.now(),
    kind,
    ref: String(ref || ''),
    item: o ? (o.sku || o.code || o.id) : '',
    name: o ? (o.name || '') : '',
    detail: detail || ''
  };

  PHOTO_ERRORS = [e, ...PHOTO_ERRORS.filter((x) => !(x.kind === kind && x.ref === e.ref))].slice(0, 200);
  console.warn('photo ' + kind + ':', e.ref || '(empty)', e.item, detail || '');
}

/**
 * The storage key for a picture, derived from the picture itself.
 *
 * Content addressing means the same image saved on two items is stored once,
 * and re-uploading a picture that is already held costs nothing.
 */
function photoKey(dataUri) {
  return 'ph_' + hex(sha256(new TextEncoder().encode(dataUri))).slice(0, 24);
}

/** Is this reference an external link rather than something we store? */
const isLinkRef = (ref) => /^https?:\/\//i.test(String(ref || ''));

/** Every picture on an item, main first. */
function photoRefs(o) {
  if (!o) return [];

  const extra = Array.isArray(o.photos) ? o.photos : [];
  return [o.photo, ...extra].filter((r) => typeof r === 'string' && r);
}

/**
 * Turn one reference into something an img tag can use, or null.
 * A link is handed back as-is; anything else is looked up in the store.
 */
function photoSrcOf(ref) {
  if (!ref) return null;
  if (isLinkRef(ref)) return ref;

  return PH[ref] || null;
}

/** The main picture of an item, or null. */
function photoSrc(o) {
  if (!o || !o.photo) return null;

  const src = photoSrcOf(o.photo);
  if (!src) logPhotoError('missing', o.photo, o, 'no image data for this reference');

  return src;
}

/**
 * A placeholder that names the item instead of showing a broken icon.
 * Used both when there is no picture and when one fails to load.
 */
function phTile(o, cls, label) {
  // The item's own number first - it is what identifies the thing on a shelf.
  const num = (o && (o.sku || o.code)) || label || '';
  const short = String(num).replace(/^TL-/, '').slice(0, 6);

  return `<div class="th ph0 ${cls || ''}" title="${esc(num || 'No photo')}">${esc(short || '▤')}</div>`;
}

/**
 * List thumbnail. On a load failure it swaps itself for the same placeholder
 * the no-photo case uses, and records why for the diagnostic panel.
 */
function thumb(o, fallback, cls) {
  const src = photoSrc(o);
  const classes = 'th ' + (cls || '');
  const n = photoRefs(o).length;

  if (!src) return phTile(o, cls, fallback);

  const fail = `phFail('${o.id}', this)`;

  return `
    <span class="thwrap">
      <img class="${classes}" src="${esc(src)}" alt="${esc(o.name || '')}" loading="lazy"
        onclick="event.stopPropagation();viewPhoto('${o.id}')"
        onerror="${fail}">
      ${n > 1 ? `<span class="thn">${n}</span>` : ''}
    </span>
  `;
}

/**
 * An image failed to load. Replace it with the named placeholder and log it -
 * a broken-image icon tells the user nothing and hides the cause.
 */
function phFail(id, img) {
  const o = anyById(id);
  const ref = o ? o.photo : '';

  logPhotoError(isLinkRef(ref) ? 'badlink' : 'notfound', ref, o,
    isLinkRef(ref) ? 'the linked address did not load' : 'stored image could not be decoded');

  if (img && img.outerHTML !== undefined) img.outerHTML = phTile(o, '', o ? (o.cat || o.code) : '');
}

/**
 * Every picture on an item, as a strip for the detail sheet.
 */
function photoStrip(o) {
  const refs = photoRefs(o);
  if (!refs.length) return '';

  const main = photoSrcOf(refs[0]);

  return `
    <div class="phhero">
      ${main
        ? `<img class="hero" src="${esc(main)}" alt="${esc(o.name || '')}"
             onclick="viewPhoto('${o.id}',0)" onerror="phFail('${o.id}', this)">`
        : phTile(o, 'hero-ph', o.sku || o.code)}
    </div>
    ${refs.length > 1
      ? `<div class="phstrip">
          ${refs.map((r, i) => {
            const s = photoSrcOf(r);
            return s
              ? `<img src="${esc(s)}" alt="" class="${i === 0 ? 'on' : ''}"
                   onclick="viewPhoto('${o.id}',${i})"
                   onerror="this.outerHTML='<span class=\\'phmiss\\'>?</span>'">`
              : `<span class="phmiss" title="This picture is missing">?</span>`;
          }).join('')}
        </div>`
      : ''}
  `;
}

/**
 * Full-size viewer, with paging when an item has more than one picture.
 */

             onerror="phFail('${o.id}', this)">`

/**
 * Save photos to storage.
 *
 * Mirroring a multi-megabyte photo bag into localStorage is guaranteed to blow
 * its quota, so skip the mirror once IndexedDB has taken the write.
 *
 * @returns {Promise<boolean>} whether the photos are actually safe on this device
 */
async function savePhotos() {
  const r = await dbSet(PH_KEY, PH, { mirror: !STORE.idb });
  if (!r.ok) reportSaveFailure('That photo could not be saved on this device', r);

  // saveState queues a push for everything in S; photos are kept apart from S,
  // so without this a new picture would never leave the device.
  cloudQueue();

  return r.ok;
}

/**
 * Compress image file to data URI
 * @param {File} file - Image file to compress
 * @returns {Promise<string>} Data URI of compressed image
 */
function shrinkImage(file) {
  return new Promise((res, rej) => {
    // Validate file type
    if (!/^image\//.test(file.type)) {
      return rej(new Error('That file is not an image'));
    }

    const r = new FileReader();
    r.onerror = () => rej(new Error('Could not read that file'));
    r.onload = (e) => {
      const img = new Image();
      img.onerror = () => rej(new Error('Could not open that image'));
      img.onload = () => {
        try {
          // Calculate scaled dimensions
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          const sc = Math.min(1, PH_MAX / Math.max(w, h));
          w = Math.max(1, Math.round(w * sc));
          h = Math.max(1, Math.round(h * sc));

          // Draw to canvas
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const x = c.getContext('2d');
          x.fillStyle = '#fff';
          x.fillRect(0, 0, w, h);
          x.drawImage(img, 0, 0, w, h);

          // Return compressed JPEG
          res(c.toDataURL('image/jpeg', PH_Q));
        } catch (err) {
          rej(new Error('Could not process that image'));
        }
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/** Open one of the pictures currently being edited. */
function viewDraft(i) {
  const ref = PHDRAFT && PHDRAFT.refs[i];
  const src = photoSrcOf(ref);
  if (!src) return toast('That picture is not on this device yet', 'bad');

  openModal('Photo', PHDRAFT.item ? (PHDRAFT.item.name || '') : '', `
    <img src="${esc(src)}" alt="" style="width:100%;border-radius:10px;display:block">
  `, '<button class="btn" onclick="closeModal()">Close</button>');
}

function phMakeMain(i) {
  if (!PHDRAFT || !PHDRAFT.refs[i]) return;

  const [ref] = PHDRAFT.refs.splice(i, 1);
  PHDRAFT.refs.unshift(ref);
  phRepaint();
}

function phDrop(i) {
  if (!PHDRAFT) return;

  PHDRAFT.refs.splice(i, 1);
  phRepaint();
}

function phDropAll() {
  if (!PHDRAFT) return;

  PHDRAFT.refs = [];
  phRepaint();
}

/**
 * Take the pictures chosen in the file dialog, shrink each, and add it.
 * Content addressing means picking the same file twice costs nothing.
 */
async function pickPhoto(inp) {
  const files = [...(inp.files || [])];
  inp.value = '';
  if (!files.length || !PHDRAFT) return;

  if (!STORE.idb && !STORE.ls) {
    return toast('This browser is not saving anything from this file, so a photo cannot be kept', 'bad');
  }

  const room = MAX_EXTRA_PHOTOS + 1 - PHDRAFT.refs.length;
  if (room <= 0) return toast(`That is already ${MAX_EXTRA_PHOTOS + 1} pictures`, 'bad');

  const take = files.slice(0, room);
  if (files.length > room) toast(`Only ${room} more picture${room === 1 ? '' : 's'} fit — the rest were skipped`);

  for (const f of take) {
    try {
      const data = await shrinkImage(f);

      if (data.length > CLOUD_DOC_MAX) {
        toast('That picture is too large to share even after resizing — use a link', 'bad');
        continue;
      }

      const key = photoKey(data);
      PH[key] = data;                                   // same picture twice = one entry
      if (!PHDRAFT.refs.includes(key)) PHDRAFT.refs.push(key);
    } catch (e) {
      logPhotoError('upload', '', PHDRAFT.item, e.message);
      toast(e.message, 'bad');
    }
  }

  phRepaint();
}

/**
 * Reveal the field for adding an externally hosted image by address.
 *
 * Inline rather than a dialog: this is reached from inside the open item
 * editor, and a second modal would replace the first and take the unsaved
 * draft with it. On a phone an inline field also keeps the keyboard and the
 * field on screen together.
 */
function linkPhoto() {
  if (!PHDRAFT) return;
  if (PHDRAFT.refs.length >= MAX_EXTRA_PHOTOS + 1) return toast('No room for another picture', 'bad');

  PHDRAFT.linking = true;
  phRepaint();

  const f = $('#phLinkIn');
  if (f) f.focus();
}

/** Take what was typed into the link field. */
function phLinkAdd() {
  if (!PHDRAFT) return;

  const f = $('#phLinkIn');
  const u = f ? f.value.trim() : '';

  if (!u) return phLinkCancel();

  if (!/^https?:\/\//i.test(u)) return toast('Links must start with http:// or https://', 'bad');

  if (!PHDRAFT.refs.includes(u)) PHDRAFT.refs.push(u);

  PHDRAFT.linking = false;
  phRepaint();
}

/** Put the link field away without adding anything. */
function phLinkCancel() {
  if (!PHDRAFT) return;

  PHDRAFT.linking = false;
  phRepaint();
}

/** Kept so any older call site still works. */
function clearPhoto() {
  phDropAll();
}

/**
 * Write the edited picture list onto the record.
 *
 * @returns {boolean} whether the stored pictures changed and need saving
 */
function commitPhoto(o) {
  if (!PHDRAFT || PHDRAFT.item !== o) return false;

  const before = photoRefs(o);
  const after = PHDRAFT.refs.slice();

  o.photo = after[0] || '';
  o.photos = after.slice(1);

  // Drop any stored picture nothing points at any more. Content addressing
  // means a key may still be in use by another item, so check the whole store.
  const gone = before.filter((r) => !after.includes(r) && !isLinkRef(r));
  let touched = false;

  gone.forEach((ref) => {
    const stillUsed = [...S.parts, ...S.tools].some((x) => x !== o && photoRefs(x).includes(ref));
    if (!stillUsed && PH[ref]) {
      delete PH[ref];
      touched = true;
    }
  });

  const added = after.some((r) => !isLinkRef(r) && !before.includes(r));
  PHDRAFT = null;

  return touched || added;
}

/**
 * js/auth.js - Authentication and login system
 */

// Authentication state tracking
let AUTH_STATE = {
  loginAttempts: 0,
  lastAttemptTime: 0,
  lockoutTime: 0,
  sessionTimeout: null,
  inactivityTime: 15 * 60 * 1000, // 15 minutes
  lastActivityTime: Date.now()
};

const MAX_LOGIN_ATTEMPTS = 5;
const LOCKOUT_DURATION = 5 * 60 * 1000; // 5 minutes

/**
 * Validate username format
 */
function validateUsername(u) {
  if (!u) return { valid: false, msg: 'Username is required' };
  if (u.length < 3) return { valid: false, msg: 'Username must be at least 3 characters' };
  if (!/^[a-z0-9_-]+$/.test(u)) return { valid: false, msg: 'Username can only contain letters, numbers, - and _' };
  return { valid: true };
}

/**
 * Validate password format
 */
function validatePassword(p) {
  if (!p) return { valid: false, msg: 'Password is required' };
  if (p.length < 6) return { valid: false, msg: 'Password must be at least 6 characters' };
  return { valid: true };
}

/**
 * Check if account is locked due to too many failed attempts
 */
function isAccountLocked() {
  if (AUTH_STATE.lockoutTime > Date.now()) {
    const remaining = Math.ceil((AUTH_STATE.lockoutTime - Date.now()) / 1000);
    return { locked: true, remaining };
  }
  return { locked: false };
}

/**
 * Record failed login attempt
 */
function recordFailedAttempt() {
  AUTH_STATE.loginAttempts++;
  AUTH_STATE.lastAttemptTime = Date.now();

  // Lock account after max attempts
  if (AUTH_STATE.loginAttempts >= MAX_LOGIN_ATTEMPTS) {
    AUTH_STATE.lockoutTime = Date.now() + LOCKOUT_DURATION;
    return {
      failed: true,
      locked: true,
      msg: 'Too many failed attempts. Account locked for 5 minutes.'
    };
  }

  return {
    failed: true,
    locked: false,
    remaining: MAX_LOGIN_ATTEMPTS - AUTH_STATE.loginAttempts,
    msg: `Invalid credentials. ${MAX_LOGIN_ATTEMPTS - AUTH_STATE.loginAttempts} attempt(s) remaining.`
  };
}

/**
 * Reset login attempts on successful login
 */
function resetLoginAttempts() {
  AUTH_STATE.loginAttempts = 0;
  AUTH_STATE.lastAttemptTime = 0;
  AUTH_STATE.lockoutTime = 0;
}

/**
 * Is this copy of the app meant to receive its accounts from a shared store?
 *
 * Written with typeof guards so the same function is safe in the multi-file
 * build, which carries no cloud code at all.
 */
function cloudExpected() {
  if (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG) return true;
  return !!(window.claude && typeof window.claude.use === 'function');
}

/**
 * Give the shared account list a chance to arrive before judging a username.
 *
 * A device that has not received it is not holding a wrong password -- it is
 * holding an incomplete list. Only the accounts built into the file are there,
 * so every account created since is missing, and saying "invalid credentials"
 * blames the person for the network. This happens for real: a phone opening
 * the file inside a chat app gets a sandboxed page that cannot reach the store
 * at all.
 *
 * @param {number} [ms] how long to wait for the first snapshot
 * @returns {Promise<string>} 'offline' when the store is unreachable, 'loading'
 *   while still waiting, or '' when the local list is as complete as it gets
 */
async function awaitAccounts(ms) {
  const arrived = () => typeof CLOUD_FIRST !== 'undefined' && !!CLOUD_FIRST.users;
  const connected = () => typeof CLOUD !== 'undefined' && !!CLOUD;

  if (!cloudExpected() || arrived()) return '';

  const btn = $('#lkGo');
  const label = btn ? btn.textContent : '';
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Checking…';
  }

  try {
    const until = Date.now() + (ms || 6000);
    while (Date.now() < until) {
      await new Promise((r) => setTimeout(r, 150));
      if (arrived()) return '';
    }
    return connected() ? 'loading' : 'offline';
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = label;
    }
  }
}

/**
 * Attempt login with username and password
 */
async function doLogin() {
  // Check if account is locked
  const lockCheck = isAccountLocked();
  if (lockCheck.locked) {
    showLoginError(`Account locked. Try again in ${lockCheck.remaining} seconds.`);
    return;
  }

  // Get and validate input
  const u = $('#lkUser').value.trim().toLowerCase();
  const p = $('#lkPass').value;
  const rememberMe = $('#lkRemember') && $('#lkRemember').checked;

  // Validate input format
  const userVal = validateUsername(u);
  if (!userVal.valid) {
    showLoginError(userVal.msg);
    return;
  }

  const passVal = validatePassword(p);
  if (!passVal.valid) {
    showLoginError(passVal.msg);
    return;
  }

  let acc = S.users.find((x) => x.u === u);

  // Before treating an unknown name as wrong, make sure the account list is
  // actually complete on this device. The wait costs nothing when it is.
  if (!acc) {
    const why = await awaitAccounts();
    acc = S.users.find((x) => x.u === u);

    if (!acc && why) {
      showLoginError(
        why === 'offline'
          ? 'Not connected, so the shared accounts have not reached this device. ' +
            'If you opened this file inside a chat app, save it first and open it in your browser.'
          : 'Still loading accounts from the shared store — wait a moment and try again.'
      );
      return;
    }
  }

  // An unknown username must cost the same as a wrong password, or the delay
  // tells an attacker which usernames exist.
  if (!acc) await pwDerive(p, PW_DUMMY_SALT, PW_ITER);

  // pwVerify upgrades a record that still holds a readable password, but only
  // when the password given is the right one
  const ok = acc ? await pwVerify(acc, p) : false;

  if (!ok) {
    const attempt = recordFailedAttempt();
    showLoginError(attempt.msg);

    // Log failed attempt
    logIt('login_failed', `Failed login attempt for user: ${u}`, 'all', {
      attempts: AUTH_STATE.loginAttempts,
      locked: attempt.locked
    });

    $('#lkPass').value = '';
    $('#lkPass').focus();
    return;
  }

  // Checked only after the password is known to be right, so that a wrong
  // password cannot be used to discover which accounts are deactivated
  if (acc.active === 0) {
    showLoginError('This account has been deactivated. Ask a manager to re-enable it.');
    logIt('login_failed', `Sign-in refused, account deactivated: ${u}`, 'all', { user: u });
    $('#lkPass').value = '';
    return;
  }

  // Clear error
  hideLoginError();

  // Clear inputs
  $('#lkPass').value = '';
  $('#lkUser').value = '';

  // Reset attempt counter
  resetLoginAttempts();

  // Log successful login
  logIt('login', `User logged in: ${acc.name} (${acc.role})`, 'all', {
    user: acc.u,
    role: acc.role,
    site: acc.site
  });

  // Enter application
  enter(acc, rememberMe);
}

/**
 * Show login error message
 */
function showLoginError(msg) {
  const e = $('#lkErr');
  e.textContent = msg;
  e.classList.remove('hide');
}

/**
 * Hide login error message
 */
function hideLoginError() {
  const e = $('#lkErr');
  e.classList.add('hide');
  e.textContent = '';
}

/**
 * Start session timeout tracking
 */
function startSessionTimeout() {
  if (AUTH_STATE.sessionTimeout) {
    clearTimeout(AUTH_STATE.sessionTimeout);
  }

  AUTH_STATE.lastActivityTime = Date.now();

  AUTH_STATE.sessionTimeout = setTimeout(() => {
    if (VIEW.user) {
      logIt('session_timeout', 'Session timed out due to inactivity', 'all');
      showTimeoutWarning();
    }
  }, AUTH_STATE.inactivityTime);
}

/**
 * Reset inactivity timer on user activity
 */
function resetInactivityTimer() {
  if (!VIEW.user) return; // Not logged in

  const now = Date.now();
  if (now - AUTH_STATE.lastActivityTime > 60000) { // Only reset if > 1 minute since last activity
    AUTH_STATE.lastActivityTime = now;
    startSessionTimeout();
  }
}

/**
 * Show session timeout warning
 */
function showTimeoutWarning() {
  confirmModal(
    'Session Expired',
    'Your session has timed out due to inactivity. Please log in again.',
    () => signOut()
  );
}

/**
 * Enter the application with a user account
 */
function enter(acc, rememberMe = false) {
  VIEW.user = acc;

  // An account tied to exactly one warehouse opens on it; otherwise "all",
  // which mySiteIds() already narrows to the warehouses it may reach.
  const ids = siteIdsFor(acc);
  VIEW.site = ids.length === 1 ? ids[0] : 'all';
  VIEW.page = landingPage();

  // Store session info
  S.session = {
    u: acc.u,
    at: Date.now(),
    rememberMe: rememberMe
  };

  // Update UI
  $('#lock').classList.add('gone');
  $('#app').classList.add('on');

  // Set user badge
  const initials = acc.name
    .split(' ')
    .map((x) => x[0])
    .join('')
    .slice(0, 2)
    .toUpperCase();
  $('#meBtn').textContent = initials;
  $('#meBtn').title = acc.name;

  // Build navigation
  buildSites();
  buildNav();
  render();

  // Save state with remember-me
  if (rememberMe) {
    S.session.rememberMe = true;
    lsSet(REMEMBER_KEY, 'true');
  }
  saveState();

  // Initialize session tracking
  initSessionTracking();

  toast(`Welcome, ${acc.name}!`, 'good');
}

/**
 * Sign out
 */
function signOut() {
  if (VIEW.user) {
    // End session tracking
    endSession();

    // Log sign out
    logIt('logout', `User logged out: ${VIEW.user.name}`, 'all', {
      user: VIEW.user.u,
      duration: Date.now() - S.session.at
    });
  }

  // Close any open modals/menus
  closeMenu();
  closeModal();

  // Clear session
  VIEW.user = null;
  S.session = null;
  lsDel(REMEMBER_KEY);

  // Save state. VIEW.user is already null, so saveState() clears S.session too.
  saveState();

  // Update UI
  $('#app').classList.remove('on');
  $('#lock').classList.remove('gone');

  // Update clock
  tick();

  // Clear inputs
  $('#lkUser').value = '';
  $('#lkPass').value = '';
  hideLoginError();

  // Focus on username field
  setTimeout(() => {
    $('#lkUser').focus();
  }, 300);

  toast('You have been signed out', 'info');
}

/**
 * Change password modal
 */
function pwModal() {
  openModal(
    'Change Password',
    'Update your account password',
    `
      <div class="fld">
        <label>Current Password</label>
        <input type="password" id="pwCur" placeholder="Enter current password" autocomplete="current-password">
        <div class="hlp">Required for security verification</div>
      </div>
      <div class="fld">
        <label>New Password</label>
        <input type="password" id="pwNew" placeholder="Enter new password (min. 6 characters)" autocomplete="new-password">
        <div class="hlp">At least 6 characters recommended</div>
      </div>
      <div class="fld">
        <label>Confirm New Password</label>
        <input type="password" id="pwCon" placeholder="Confirm new password" autocomplete="new-password">
        <div class="hlp">Must match new password</div>
      </div>
    `,
    `
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="changePassword()">Update Password</button>
    `
  );

  // Focus first field
  setTimeout(() => $('#pwCur').focus(), 100);

  // Allow Enter to submit
  const handleEnter = (e) => {
    if (e.key === 'Enter') {
      changePassword();
    }
  };

  $('#pwCur').addEventListener('keydown', handleEnter);
  $('#pwNew').addEventListener('keydown', handleEnter);
  $('#pwCon').addEventListener('keydown', handleEnter);
}

/**
 * Validate new password strength
 */
function validateNewPassword(p) {
  if (!p) return { valid: false, msg: 'Password is required' };
  if (p.length < 6) return { valid: false, msg: 'Password must be at least 6 characters' };

  // Optional: check for complexity
  const hasUpper = /[A-Z]/.test(p);
  const hasLower = /[a-z]/.test(p);
  const hasNum = /[0-9]/.test(p);

  if (!(hasUpper && hasLower && hasNum)) {
    console.warn('Weak password: mix of uppercase, lowercase, and numbers recommended');
  }

  return { valid: true };
}

/**
 * Process password change
 */
async function changePassword() {
  const cur = $('#pwCur').value;
  const neu = $('#pwNew').value;
  const con = $('#pwCon').value;

  // Validate current password
  const curUser = S.users.find((x) => x.u === VIEW.user.u);
  if (!curUser || !(await pwVerify(curUser, cur))) {
    toast('Current password is incorrect', 'bad');
    $('#pwCur').focus();
    return;
  }

  // Validate new password
  const newVal = validateNewPassword(neu);
  if (!newVal.valid) {
    toast(newVal.msg, 'bad');
    $('#pwNew').focus();
    return;
  }

  // Check passwords match
  if (neu !== con) {
    toast('New passwords do not match', 'bad');
    $('#pwCon').focus();
    return;
  }

  // Check new password is different from old
  if (neu === cur) {
    toast('New password must be different from current password', 'bad');
    $('#pwNew').focus();
    return;
  }

  // Update password. VIEW.user is the same object as the S.users entry, so
  // this updates both.
  const user = S.users.find((x) => x.u === VIEW.user.u);
  if (user) {
    await pwSet(user, neu);
    await saveState();

    // Log password change
    logIt('password_changed', `User changed password: ${VIEW.user.name}`, 'all', {
      user: VIEW.user.u
    });

    closeModal();
    toast('Password updated successfully', 'good');
  }
}

/**
 * Help under the sign-in form.
 *
 * The setup credential is deliberately not printed here. A device that opens
 * this file joins the shared store and receives its real accounts, so whoever
 * reaches this screen either has an account already or needs a manager to
 * create one -- printing the shipped password would simply hand it to anyone
 * who opened the link. The reset stays, because otherwise a forgotten password
 * leaves the app unusable on that device.
 */
function lockHint() {
  const box = $('#lkHint');
  if (!box) return;

  box.innerHTML = `
    <button type="button" class="lk-hint-a" onclick="resetDevice()">Trouble signing in?</button>
  `;
  box.classList.remove('hide');
}

/**
 * Clear this device's copy and start over. The store lives only in this
 * browser, so this is the way back in when nobody can sign in.
 */
function resetDevice() {
  openModal('Reset this device', 'Start again from the shipped account', `
    <p style="font-size:13.5px;margin:0 0 10px">
      This clears the copy of the store held in <b>this browser</b> and starts
      again from the shipped manager account and the sample data.
    </p>
    <p style="font-size:13px;color:var(--ink2);margin:0">
      Accounts, stock, tools, orders and history saved on this device are
      removed. Anything already in the shared cloud store is not affected and
      comes back on the next open. Other people's devices are untouched.
    </p>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn dgr" onclick="doResetDevice()">Reset this device</button>
  `);
}

/**
 * Wipe local storage and reload into a fresh store
 */
async function doResetDevice() {
  await dbClear();
  location.reload();
}

/**
 * Initialize authentication UI
 */
function initAuth() {
  // Update clock
  tick();

  // Login button
  $('#lkGo').onclick = doLogin;

  // Password show/hide toggle
  $('#lkEye').onclick = () => {
    const i = $('#lkPass');
    const s = i.type === 'password';
    i.type = s ? 'text' : 'password';
    $('#lkEye').textContent = s ? 'Hide' : 'Show';
  };

  // Keyboard navigation
  $('#lkUser').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('#lkPass').focus();
  });

  $('#lkPass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });

  lockHint();

  // Check for remembered session
  const remembered = lsGet(REMEMBER_KEY) === 'true';
  if (remembered && S.session) {
    const user = S.users.find((u) => u.u === S.session.u);
    if (user) {
      // Pre-fill username
      $('#lkUser').value = user.u;
      if ($('#lkRemember')) {
        $('#lkRemember').checked = true;
      }
      $('#lkPass').focus();
    }
  }
}

function goLog(type) {

  VIEW.page = 'log';
  VIEW.q = '';
  VIEW.cat = 'all';
  VIEW.stock = 'all';

  closeModal();

/**
 * Build and render navigation
 */
function buildNav() {
  const pages = visiblePages();
  const b = {
    parts: lowParts().length,
    tools: overTools().length,
    cal: calDue().length,
    war: warExpiring().length + warExpired().length,
    po: openPOs()
      .filter((o) => o.status === 'draft').length
  };

  $('#nav').innerHTML = NAV.map((n, i) => {
    // A group heading belongs to the entries that follow it, up to the next
    // heading. Show it only when this role can actually see one of them,
    // otherwise a restricted account gets a bare label with nothing beneath.
    if (n.g) {
      const mine = [];
      for (let j = i + 1; j < NAV.length && !NAV[j].g; j++) mine.push(NAV[j]);
      return mine.some((x) => pages.includes(x.id)) ? `<div class="nav-lbl">${n.g}</div>` : '';
    }
    if (!pages.includes(n.id)) return '';

    const c = b[n.id] || 0;
    const amber = n.id === 'cal' || n.id === 'po' || n.id === 'war';

    return `
      <a data-p="${n.id}" class="${VIEW.page === n.id ? 'on' : ''}">
        <span class="ic">${n.ic}</span>${n.t}
        ${c ? `<span class="bdg ${amber ? 'amber' : ''}">${c}</span>` : ''}
      </a>
    `;
  }).join('');

  $$('#nav a').forEach((a) => {
    a.onclick = () => go(a.dataset.p);
  });

  const n = alertCount();
  $('#alertDot').classList.toggle('hide', !n);
}

/**
 * Get alert count (for badge)
 *
 * Delete requests count too: a person waiting on a decision is more urgent
 * than a stock line that is merely low, and if the bell does not light for it
 * nobody finds out a request was ever made.
 */
function alertCount() {
  // Same split the panel uses, so the badge and the list cannot disagree: a
  // request you raised AND can decide is one item, not two.
  const toDecide = myPendingReqs();
  const raised = pendingReqs().filter(
    (r) => VIEW.user && r.by === VIEW.user.u && toDecide.indexOf(r) === -1
  );

  return toDecide.length + raised.length +
    lowParts().length + overTools().length + calDue().length + warExpiring().length;
}

/**
 * Page title for the top bar, taken from the navigation definition
 */
function pageTitle(id) {
  const n = NAV.find((x) => x.id === id);
  return n ? n.t : '';
}

/**
 * Build site selector
 */
function buildSites() {
  const lock = VIEW.user.site && VIEW.user.site !== 'all';

  if (lock && VIEW.site !== VIEW.user.site) VIEW.site = VIEW.user.site;
  if (!lock && VIEW.site !== 'all' && !S.sites.some((s) => s.id === VIEW.site)) VIEW.site = 'all';

  const cur = VIEW.site === 'all' ? null : S.sites.find((s) => s.id === VIEW.site);
  const st = siteStats(VIEW.site);

  $('#siteBtn').innerHTML = `
    <span class="cd">${cur ? esc(cur.code) : 'ALL'}</span>
    <span class="nm">${cur ? esc(cur.name) : 'All warehouses'}</span>
    ${st.alerts ? '<span class="wd"></span>' : ''}<span class="cv">▾</span>
  `;

  const ps = $('#pgSite');
  if (ps) ps.textContent = cur ? cur.name : `All warehouses · ${S.sites.length} locations`;
}

/**
 * Get stats for a site
 */
function siteStats(id) {
  const P = S.parts.filter((p) => id === 'all' || p.site === id);
  const T = S.tools.filter((t) => id === 'all' || t.site === id);
  const low = P.filter((p) => stockState(p) !== 'ok').length;
  const over = T.filter((t) => toolState(t) === 'over').length;
  const cal = T.filter((t) => ['due', 'exp'].includes(calState(t))).length;

  return {
    parts: P.length,
    tools: T.length,
    low,
    over,
    cal,
    alerts: low + over + cal
  };
}

/**
 * Show site selection modal
 */
function siteSheet() {
  const lock = VIEW.user.site && VIEW.user.site !== 'all';

  const row = (id, code, name, sub) => {
    const st = siteStats(id);
    const on = VIEW.site === id;

    return `
      <button class="siterow ${on ? 'on' : ''}" onclick="setSite('${id}')">
        <span class="cd">${esc(code)}</span>
        <span style="min-width:0;flex:1">
          <span class="nm">${esc(name)}</span>
          <span class="mt">${sub || `${st.parts} parts · ${st.tools} tools`}</span>
        </span>
        <span class="tk">
          ${
            st.alerts
              ? `<span class="pill ${st.low || st.over ? 'out' : 'low'}">${st.alerts} alert${st.alerts > 1 ? 's' : ''}</span>`
              : '<span class="pill ok">clear</span>'
          }
          ${on ? '<div style="color:var(--brand);font-weight:700;font-size:12px;margin-top:4px">Selected</div>' : ''}
        </span>
      </button>
    `;
  };

  openModal(
    'Warehouse',
    lock ? 'You have access to one location' : 'Choose which location to view',
    `
      <div style="margin:-16px">
        ${lock ? '' : row('all', 'ALL', 'All warehouses', `${S.parts.length} parts · ${S.tools.length} tools across ${S.sites.length} sites`)}
        ${mySites().map((s) => row(s.id, s.code, s.name)).join('')}
      </div>
    `,
    `<button class="btn" onclick="closeModal()">Close</button>`
  );
}

function setSite(id) {

  VIEW.site = id;

/**
 * Show alerts modal - everything needing attention, grouped by kind
 */
function alertsModal() {
  const low = lowParts();
  const ov = overTools();
  const cd = calDue();
  const wx = warExpiring();

  const sec = (title, arr, fn) =>
    arr.length
      ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
          color:var(--ink3);margin:14px 0 6px">${title} (${arr.length})</div>` + arr.map(fn).join('')
      : '';

  const row = (k, i, t, s, r) => `
    <div class="al" style="padding-left:0;padding-right:0">
      <div class="al-i ${k}">${i}</div>
      <div style="min-width:0">
        <div class="al-t">${esc(t)}</div>
        <div class="al-s">${esc(s)}</div>
      </div>
      <div class="al-r"><span class="pill ${k}">${esc(r)}</span></div>
    </div>
  `;

  // Delete requests lead. Unlike a low stock line, each one is a person who is
  // blocked and waiting on an answer from whoever opens this panel.
  const toDecide = myPendingReqs();
  const raised = pendingReqs().filter(
    (r) => VIEW.user && r.by === VIEW.user.u && toDecide.indexOf(r) === -1
  );

  const reqRow = (r, decide) => `
    <div class="al" style="padding-left:0;padding-right:0;align-items:flex-start">
      <div class="al-i out">✕</div>
      <div style="min-width:0;flex:1">
        <div class="al-t">${esc(r.label)}</div>
        <div class="al-s">
          ${esc(r.kind === 'tool' ? 'Tool' : 'Part')} ·
          asked by ${esc(r.byName || r.by)} · ${ago(r.at)}${r.why ? ' · “' + esc(r.why) + '”' : ''}
        </div>
        <div class="ac" style="margin-top:7px">
          ${decide
            ? `<button class="btn sm pri" onclick="approveDelReq('${r.id}')">Approve &amp; delete</button>
               <button class="btn sm" onclick="declineDelReq('${r.id}')">Decline</button>`
            : `<span class="pill low">Waiting for a manager</span>
               <button class="btn sm" onclick="cancelDelReq('${r.id}')">Withdraw</button>`}
        </div>
      </div>
    </div>
  `;

  const n = toDecide.length + raised.length + low.length + ov.length + cd.length + wx.length;

  const body = n
    ? sec('Deletion, waiting on you', toDecide, (r) => reqRow(r, true)) +
      sec('Your deletion requests', raised, (r) => reqRow(r, false)) +
      sec('Stock below minimum', low, (p) =>
        row(stockState(p) === 'out' ? 'out' : 'low', '▤', p.name,
          `${p.sku} · ${siteName(p.site)}`, `${p.qty}/${p.min}`)) +
      sec('Tools past due', ov, (t) =>
        row('out', '⚒', t.name,
          `${t.code} · ${t.holder}`, Math.abs(daysTo(t.dueAt)) + 'd late')) +
      sec('Calibration', cd, (t) =>
        row(calState(t) === 'exp' ? 'out' : 'low', '◎', t.name,
          `${t.code} · due ${fmtD(t.calNext)}`,
          calState(t) === 'exp' ? 'expired' : daysTo(t.calNext) + 'd')) +
      sec('Warranty expiring', wx, (x) =>
        row('low', '▣', x.name,
          `${x.code} · ends ${fmtD(x.until)}`, daysTo(x.until) + 'd'))
    : empty('✓', 'Nothing needs attention',
        'Stock levels, tool returns, certificates and warranties are all current.');

  openModal(
    'Alerts',
    `${n ? n + ' open item' + (n === 1 ? '' : 's') : 'All clear'} · ${VIEW.site === 'all' ? 'all warehouses' : siteName(VIEW.site)}`,
    body,
    `<button class="btn" onclick="closeModal()">Close</button>`
  );
}

/* ---------- stock by category ---------- */

/**
 * Category breakdown card - share of value or line count, with the at-risk portion
 */
function catBlock() {
  const parts = S.parts.filter(inSite);
  const byVal = VIEW.catMode !== 'items';

  const cats = [...new Set(parts.map((p) => p.cat))]
    .map((c) => {
      const g = parts.filter((p) => p.cat === c);
      const bad = g.filter((p) => stockState(p) !== 'ok');
      return {
        c,
        items: g.length,
        qty: g.reduce((a, p) => a + p.qty, 0),
        val: g.reduce((a, p) => a + p.qty * p.cost, 0),
        riskVal: bad.reduce((a, p) => a + p.qty * p.cost, 0),
        low: g.filter((p) => stockState(p) === 'low').length,
        out: g.filter((p) => stockState(p) === 'out').length
      };
    })
    .sort((a, b) => (byVal ? b.val - a.val : b.items - a.items));

  const totVal = cats.reduce((a, x) => a + x.val, 0);
  const totItems = cats.reduce((a, x) => a + x.items, 0);
  const tot = byVal ? totVal : totItems;

  return `
    <div class="card">
      <div class="card-h">
        <div>
          <div class="card-t">Stock by category</div>
          <div class="card-s">
            ${VIEW.site === 'all' ? 'All warehouses' : siteName(VIEW.site)} ·
            ${money(totVal).replace('.00', '')} across ${totItems} line items
          </div>
        </div>
        <div class="r">
          <div class="seg">
            <button class="${byVal ? 'on' : ''}" onclick="setCatMode('value')">By value</button>
            <button class="${byVal ? '' : 'on'}" onclick="setCatMode('items')">By count</button>
          </div>
        </div>
      </div>
      <div class="card-b flush">
        ${cats.length
          ? cats.map((x) => {
              const mine = byVal ? x.val : x.items;
              const risk = byVal ? x.riskVal : x.low + x.out;
              const share = tot ? mine / tot * 100 : 0;
              const riskShare = mine ? risk / mine * 100 : 0;

              return `
                <button class="catrow" onclick="goCat('${esc(x.c)}')">
                  <span class="cat-n">
                    <b>${esc(x.c)}</b>
                    <span>${x.items} item${x.items > 1 ? 's' : ''} · ${x.qty} units</span>
                  </span>
                  <span class="cat-b">
                    <span class="stack" title="${money(x.val)} total, ${money(x.riskVal)} below minimum">
                      <i class="g" style="width:${share * (100 - riskShare) / 100}%"></i>
                      <i class="r" style="width:${share * riskShare / 100}%"></i>
                    </span>
                    ${x.low || x.out
                      ? `<span class="cat-chips">
                          ${x.out ? `<span class="pill out">${x.out} out</span>` : ''}
                          ${x.low ? `<span class="pill low">${x.low} low</span>` : ''}
                        </span>`
                      : ''}
                  </span>
                  <span class="cat-v">
                    <b>${byVal ? money(x.val).replace('.00', '') : x.items}</b>
                    <span>${Math.round(share)}% of ${byVal ? 'value' : 'lines'}</span>
                  </span>
                </button>
              `;
            }).join('')
          : empty('▤', 'No parts at this warehouse', 'Add stock or switch warehouse to see the breakdown.')}
      </div>
      <div class="card-b" style="border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2)">
        Bar length is each category's share of ${byVal ? 'total stock value' : 'total line items'};
        the red segment is the portion sitting at or below minimum. Tap a row to open that category.
      </div>
    </div>
  `;
}

/**
 * Switch the category breakdown between value and line count
 */
function setCatMode(m) {
  VIEW.catMode = m;
  render();
}

/**
 * Switch the stock in vs out chart between day, week, month and year
 */
function setFlowMode(m) {
  VIEW.flowMode = FLOW_SPANS[m] ? m : 'month';
  render();
}

/**
 * Open the parts page filtered to one category
 */
function goCat(c) {
  VIEW.page = 'parts';
  VIEW.q = '';
  VIEW.stock = 'all';
  VIEW.tab = 'all';
  VIEW.cat = c;

  $('#rail').classList.remove('on');
  $('#scrim').classList.remove('on');

  buildNav();
  render();
  window.scrollTo(0, 0);
}

/**
 * Consumption, replenishment, 12-month trend and top consumers
 */
function useBlock() {
  const w = use(weekStart());
  const m = use(monthStart());
  const y = use(yearStart());
  const iw = stockIn(weekStart());
  const im = stockIn(monthStart());
  const iy = stockIn(yearStart());

  const d = today();
  const wkDays = ((d.getDay() + 6) % 7) + 1;
  const moDays = d.getDate();
  const doy = Math.floor((d - yearStart()) / DAY) + 1;

  const mode = VIEW.flowMode || 'month';
  const span = FLOW_SPANS[mode] || FLOW_SPANS.month;
  const bars = flowBy(mode);
  const peak = Math.max(...bars.map((b) => Math.max(b.in, b.out)), 1);
  const top = topUsed(monthStart(), 5);
  const topMax = Math.max(...top.map((t) => t.val), 1);

  const burn = y.val / Math.max(doy, 1) * 30.4;
  const cover = burn > 0 ? (stockValue() / burn).toFixed(1) : '—';

  const net = (a, b) => {
    const n = a - b;
    return `<span class="${n < 0 ? 'up' : 'dn'}">${n < 0 ? '▼' : '▲'} ${money(Math.abs(n)).replace('.00', '')}</span>
      ${n < 0 ? 'net drawdown' : 'net build-up'}`;
  };

  const card = (lbl, u, prev, sub, cls) => `
    <div class="kpi ${cls}">
      <div class="kpi-l">${lbl}</div>
      <div class="kpi-v">${money(u.val).replace('.00', '')}</div>
      <div class="kpi-d">${u.qty} items · ${u.n} movement${u.n === 1 ? '' : 's'}</div>
      <div class="kpi-d">${percentChange(u.val, prev.val)}</div>
      <div class="kpi-d" style="color:var(--ink3)">${sub}</div>
    </div>
  `;

  const received = stockIn(weekStart()).lines;

  return `
    <div class="card">
      <div class="card-h">
        <div>
          <div class="card-t">Consumption — stock out</div>
          <div class="card-s">Parts issued from the store · ${VIEW.site === 'all' ? 'all warehouses' : siteName(VIEW.site)}</div>
        </div>
        <div class="r">${canSee('log') ? '<button class="btn sm" data-go="log">Movements</button>' : ''}</div>
      </div>
      <div class="card-b">
        <div class="kpis" style="margin-bottom:0">
          ${card('This week', w, usePrev('week'), `Mon–today · day ${wkDays} of 7`, 'br')}
          ${card('This month', m, usePrev('month'), `1–${moDays} ${MON[d.getMonth()]} ${d.getFullYear()}`, 'ord')}
          ${card('Year to date', y, usePrev('year'), `1 Jan – ${moDays} ${MON[d.getMonth()]} · day ${doy}`, 'ok')}
          <div class="kpi low">
            <div class="kpi-l">Avg burn rate</div>
            <div class="kpi-v">${money(burn).replace('.00', '')}</div>
            <div class="kpi-d">per month, YTD average</div>
            <div class="kpi-d">${Math.round(y.qty / Math.max(doy, 1) * 30.4)} items / month</div>
            <div class="kpi-d" style="color:var(--ink3)">${cover} months of cover on hand</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">
        <div>
          <div class="card-t">New stock in</div>
          <div class="card-s">Goods received and booked into the store</div>
        </div>
        <div class="r">${can('receive') ? '<button class="btn sm pri" onclick="receiveModal()">Receive stock</button>' : ''}</div>
      </div>
      <div class="card-b">
        <div class="kpis" style="margin-bottom:0">
          ${card('This week', iw, flowPrev('receive', 'week'), net(iw.val, w.val), 'br')}
          ${card('This month', im, flowPrev('receive', 'month'), net(im.val, m.val), 'ord')}
          ${card('Year to date', iy, flowPrev('receive', 'year'), net(iy.val, y.val), 'ok')}
          <div class="kpi ${iy.val < y.val ? 'out' : 'ok'}">
            <div class="kpi-l">Replenishment ratio</div>
            <div class="kpi-v">${y.val ? Math.round(iy.val / y.val * 100) : 0}%</div>
            <div class="kpi-d">received vs issued, YTD</div>
            <div class="kpi-d" style="color:var(--ink3)">
              ${iy.val < y.val
                ? 'Drawing stock down faster than replacing it'
                : 'Replacing at or above the burn rate'}
            </div>
          </div>
        </div>

        ${received.length
          ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
              color:var(--ink3);margin:16px 0 2px">Received this week</div>
            ${received.slice(0, ROWCAP).map((l) => {
              const p = partById(l.part);
              return `
                <div class="kv">
                  <span style="color:var(--ink)">${esc(p ? p.name : '—')}
                    <span class="mono" style="font-size:11px;color:var(--ink3)">
                      ${p ? esc(p.sku) : ''} · ${esc(l.site)} · ${ago(l.ts)}</span>
                  </span>
                  <b class="mono">+${l.qty} ${p ? esc(p.unit) : ''}</b>
                </div>
              `;
            }).join('')}
            ${received.length > ROWCAP && canSee('log')
              ? `<button class="morerow" style="border-radius:8px;margin-top:10px;border:1px solid var(--line)"
                  onclick="goLog('receive')">View all ${received.length} receipts
                  <span>+${received.length - ROWCAP} more</span></button>`
              : ''}`
          : ''}
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-h">
          <div>
            <div class="card-t">Stock in vs stock out</div>
            <div class="card-s">${span.label} by value</div>
          </div>
          <div class="r">
            <div class="seg">
              ${[['day', 'Day'], ['week', 'Week'], ['month', 'Month'], ['year', 'Year']].map(([k, l]) =>
                `<button class="${mode === k ? 'on' : ''}" onclick="setFlowMode('${k}')">${l}</button>`
              ).join('')}
            </div>
          </div>
        </div>
        <div class="card-b">
          <div class="bars">
            ${bars.map((b, i) => {
              // 30 daily labels would collide, so caption every fifth bar and today
              const showLabel = mode !== 'day' || i % 5 === 0 || b.now;
              return `
                <div class="bcol ${b.now ? 'now' : ''}"
                  title="${b.label}${mode === 'year' ? '' : ' ' + b.year} — in ${money(b.in)} (${b.inQty}) · out ${money(b.out)} (${b.outQty})">
                  <div class="pair">
                    <i class="bin" style="height:${Math.max(b.in / peak * 100, 1)}%"></i>
                    <i class="bout" style="height:${Math.max(b.out / peak * 100, 1)}%"></i>
                  </div>
                  <span>${showLabel ? b.label : '&nbsp;'}</span>
                </div>
              `;
            }).join('')}
          </div>
          <div class="legend">
            <span><i style="background:var(--ok)"></i>Received in</span>
            <span><i style="background:var(--brand)"></i>Issued out</span>
            <span>${span.partial} is still running</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-h">
          <div>
            <div class="card-t">Top consumers this month</div>
            <div class="card-s">Where the spend is going</div>
          </div>
        </div>
        <div class="card-b">
          ${top.length
            ? `<div class="top5">${top.map((t) => `
                <div class="t5r">
                  <div class="t5n">
                    <b>${esc(t.p.name)}</b>
                    <div class="psku">${esc(t.p.sku)} · ${t.qty} ${esc(t.p.unit)} issued</div>
                  </div>
                  <div class="t5b"><div class="sb"><i style="width:${t.val / topMax * 100}%"></i></div></div>
                  <div class="t5v">${money(t.val).replace('.00', '')}</div>
                </div>
              `).join('')}</div>`
            : empty('▤', 'Nothing issued yet this month', 'Issued parts appear here as they leave the store.')}
        </div>
      </div>
    </div>
  `;
}

/**
 * Parts matching the current search and filters, worst stock state first
 */
function filterParts() {
  const q = VIEW.q.toLowerCase();

  return S.parts
    .filter((p) => inSite(p))
    .filter((p) => VIEW.cat === 'all' || p.cat === VIEW.cat)
    .filter((p) =>
      VIEW.stock === 'all' ||
      stockState(p) === VIEW.stock ||
      (VIEW.stock === 'low' && stockState(p) === 'out'))
    .filter((p) => !q || (p.name + ' ' + p.sku + ' ' + p.bin + ' ' + p.sup).toLowerCase().includes(q))
    .sort((a, b) => {
      const r = { out: 0, low: 1, ok: 2 };
      return r[stockState(a)] - r[stockState(b)] || a.name.localeCompare(b.name);
    });
}

/**
 * Live "after this issue" hint
 */
function issueSync() {
  const p = partById($('#ipPart').value);
  const q = parseInt($('#ipQty').value) || 0;
  const after = p.qty - q;

  $('#ipHint').innerHTML = `
    On hand ${p.qty} ${esc(p.unit)} →
    <b style="color:${after < 0 ? 'var(--out)' : after <= p.min ? 'var(--low)' : 'var(--ok)'}">${after} after issue</b>
    ${after < 0 ? ' — not enough stock' : after <= p.min && after >= 0 ? ' — will drop below minimum' : ''}
  `;
  $('#ipQty').max = p.qty;
}

/**
 * Commit an issue
 */
function doIssue() {
  const p = partById($('#ipPart').value);
  const q = parseInt($('#ipQty').value) || 0;
  const to = $('#ipTo').value.trim() || VIEW.user.name;
  const ref = $('#ipRef').value.trim();

  if (q < 1) return toast('Enter a quantity of 1 or more', 'bad');
  if (q > p.qty) return toast(`Only ${p.qty} ${p.unit} on hand`, 'bad');

  p.qty -= q;
  p.updated = Date.now();
  logIt('issue', `Issued ${q} × ${p.name} to ${to}${ref ? ' (' + ref + ')' : ''}`, p.site, {
    part: p.id,
    qty: q,
    value: +(q * p.cost).toFixed(2)
  });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(`Issued ${q} ${p.unit} — ${p.qty} left`, 'good');
}

/**
 * Save the part editor
 */
async function savePart(id) {
  const g = (k) => $('#pf' + k).value.trim();
  const n = (k) => Number($('#pf' + k).value) || 0;

  if (!g('Name')) return toast('Part name is required', 'bad');
  if (!g('Sku')) return toast('SKU is required', 'bad');

  let phDirty = false;

  if (id) {
    const p = partById(id);
    Object.assign(p, {
      name: g('Name'), sku: g('Sku'), bin: g('Bin'), cat: g('Cat'), site: g('Site'),
      min: n('Min'), unit: g('Unit') || 'pcs', cost: n('Cost'), sup: g('Sup'), lt: n('Lt'),
      war: n('War'), warFrom: $('#pfWarFrom').value || null, updated: Date.now()
    });
    phDirty = commitPhoto(p);
    logIt('edit', `Updated part ${p.name} (${p.sku})`, p.site);
  } else {
    const p = {
      id: uid('p'),
      name: g('Name'), sku: g('Sku'), bin: g('Bin'), cat: g('Cat'), site: g('Site'),
      qty: n('Qty'), min: n('Min'), unit: g('Unit') || 'pcs', cost: n('Cost'), sup: g('Sup'), lt: n('Lt'),
      war: n('War'), warFrom: $('#pfWarFrom').value || null, updated: Date.now()
    };
    phDirty = commitPhoto(p);
    S.parts.push(p);
    logIt('add', `Added part ${p.name} (${p.sku}) with ${p.qty} ${p.unit}`, p.site);
  }

  // Awaited so the outcome is known before we claim it worked. The edit is
  // already in memory either way, so still close and repaint.
  const okState = await saveState();
  const okPhotos = phDirty ? await savePhotos() : true;

  closeModal();
  buildNav();
  render();

  // On failure the storage layer has already said so in red — do not paper
  // over it with a success message.
  if (okState && okPhotos) toast(id ? 'Part updated' : 'Part added', 'good');
}

/* ============ DELETE REQUESTS ============ */
/**
 * Deleting is a manager's decision, but the person who can see that a part is
 * scrap is usually the storekeeper holding it. So anyone may ask, only someone
 * with the delete permission may decide, and approving carries the deletion out
 * rather than leaving a note for somebody to action by hand -- a request that
 * still needs a second manual step is a request that gets forgotten.
 */

/** Whether this account can remove this kind of record outright. */
function canDelete(kind) {
  return canDo(kind === 'tool' ? 'tools' : 'parts', 'del');
}

/** The record a request points at, or null once it is gone. */
function reqItem(r) {
  return r && r.kind === 'tool' ? toolById(r.item) : partById(r.item);
}

/** Requests still waiting on a decision. */
function pendingReqs() {
  return (S.requests || []).filter((r) => r.status === 'pending');
}

/**
 * Pending requests THIS account may decide: the right permission, and a site
 * it is allowed to see. Without the site test a manager scoped to one
 * warehouse could delete another warehouse's stock through the request list,
 * which is a way around the scoping rather than a feature.
 */
function myPendingReqs() {
  return pendingReqs().filter((r) => canDelete(r.kind) && siteAllowed(r.site));
}

/** Ask for something to be deleted that this account may not delete itself. */
function askDelete(kind, id) {
  const o = kind === 'tool' ? toolById(id) : partById(id);
  if (!o) return toast('That item is no longer here', 'bad');

  const already = pendingReqs().find((r) => r.item === id);
  if (already) return toast('Someone has already asked for this one', 'bad');

  openModal(`Request deletion`, (o.sku || o.code) + ' · ' + (o.name || ''), `
    <p style="font-size:13.5px;margin:0 0 12px">
      You do not have permission to delete this yourself, so this asks a manager
      to do it. If they approve, <b>${esc(o.name || '')}</b> is removed straight away.
    </p>
    <div class="fld">
      <label>Why should it go? (optional)</label>
      <input id="reqWhy" placeholder="Damaged beyond repair, wrong part, duplicate entry…"
        onkeydown="if(event.key==='Enter'){event.preventDefault();submitDelReq('${kind}','${id}')}">
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="submitDelReq('${kind}','${id}')">Send request</button>
  `);
}

/** Record the request and let it sync to whoever can decide it. */
function submitDelReq(kind, id) {
  const o = kind === 'tool' ? toolById(id) : partById(id);
  if (!o) return toast('That item is no longer here', 'bad');

  const why = $('#reqWhy') ? $('#reqWhy').value.trim() : '';

  S.requests.unshift({
    id: uid('rq'),
    kind,
    item: id,
    label: (o.sku || o.code || '') + ' · ' + (o.name || ''),
    site: o.site || '',
    by: VIEW.user ? VIEW.user.u : '',
    byName: VIEW.user ? (VIEW.user.name || VIEW.user.u) : '',
    why,
    at: Date.now(),
    status: 'pending'
  });

  logIt('del_request', `Asked to delete ${o.name} (${o.sku || o.code})`, o.site, { why });
  saveState();
  closeModal();
  buildNav();
  render();
  toast('Request sent to a manager', 'good');
}

/** Approve: carry out the deletion the request asked for. */
function approveDelReq(rid) {
  const r = (S.requests || []).find((x) => x.id === rid);
  if (!r || r.status !== 'pending') return;

  if (!canDelete(r.kind) || !siteAllowed(r.site)) {
    return toast('You cannot approve this one', 'bad');
  }

  const o = reqItem(r);

  // The item may have been deleted by someone else while this sat waiting.
  // Close the request honestly rather than reporting a deletion that did not
  // happen on this device.
  if (!o) {
    r.status = 'approved';
    r.note = 'already gone when approved';
  } else if (r.kind === 'tool') {
    removeTool(o);
    r.status = 'approved';
  } else {
    removePart(o);
    r.status = 'approved';
  }

  r.decidedBy = VIEW.user ? VIEW.user.u : '';
  r.decidedAt = Date.now();

  logIt('del_approve', `Approved deletion of ${r.label}, asked by ${r.byName}`, r.site);
  savePhotos();
  saveState();
  closeModal();
  buildNav();
  render();
  toast(o ? 'Approved — item deleted' : 'Request closed; it was already gone', 'good');
}

/** Decline: the item stays, and the request is closed with a reason. */
function declineDelReq(rid) {
  const r = (S.requests || []).find((x) => x.id === rid);
  if (!r || r.status !== 'pending') return;

  if (!canDelete(r.kind) || !siteAllowed(r.site)) {
    return toast('You cannot decide this one', 'bad');
  }

  r.status = 'declined';
  r.decidedBy = VIEW.user ? VIEW.user.u : '';
  r.decidedAt = Date.now();

  logIt('del_decline', `Declined deletion of ${r.label}, asked by ${r.byName}`, r.site);
  saveState();
  closeModal();
  buildNav();
  render();
  toast('Request declined — the item stays', 'good');
}

/** Withdraw a request you raised yourself. */
function cancelDelReq(rid) {
  const r = (S.requests || []).find((x) => x.id === rid);
  if (!r || r.status !== 'pending') return;

  if (!VIEW.user || r.by !== VIEW.user.u) return toast('That is not your request', 'bad');

  S.requests = S.requests.filter((x) => x.id !== rid);
  logIt('del_cancel', `Withdrew the request to delete ${r.label}`, r.site);
  saveState();
  closeModal();
  buildNav();
  render();
  toast('Request withdrawn', 'good');
}

/**
 * Strip one part out of the store: its device photo, its stock line and any
 * order lines pointing at it. Logs the removal; the caller saves and repaints.
 */
function removePart(p) {
  if (p.photo && !/^https?:/i.test(p.photo)) delete PH[p.photo];

  S.parts = S.parts.filter((x) => x.id !== p.id);
  S.pos.forEach((o) => {
    o.lines = o.lines.filter((l) => l.part !== p.id);
  });
  VIEW.sel = VIEW.sel.filter((x) => x !== p.id);

  logIt('del', `Deleted part ${p.name} (${p.sku})`, p.site);
}
