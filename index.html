<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Spare Parts Management System 3.2 — single-file build with live cloud sync.
       Runs on the claude.ai viewer store, or on Firebase when hosted anywhere else. -->
  <meta charset="utf-8">

  <!-- No maximum-scale. It never stopped iOS zooming a field on focus, because
       Safari ignores it, and on Android it takes pinch-zoom away from anyone
       who needs it. The 16px form fields in the touch block below are what
       actually stop the zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Spare parts and tools management for solar and battery storage sites: stock, calibration, warranty, purchase orders and photos, shared live across every device.">
  <meta name="theme-color" content="#0D1626">

  <!-- Home-screen install. The manifest is for Android; iOS ignores it and
       reads the apple-* tags instead, so both have to be here. Both point at
       files beside the page: when this file is opened on its own they simply
       do not resolve, which costs nothing. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Spare Parts">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>SPARE PARTS MANAGEMENT SYSTEM V3.2</title>

  <!-- CSS Modules -->
  <style>
/* ===== css/variables.css ===== */
/**
 * css/variables.css - CSS custom properties and design tokens
 */

:root {
  /* Colors - Backgrounds */
  --bg: #EDF1F6;
  --surface: #fff;
  --surface2: #F6F9FC;
  --surface3: #EEF3F9;

  /* Colors - Text */
  --ink: #0B1220;
  --ink2: #4A5A70;
  --ink3: #8695AA;

  /* Colors - Borders & Dividers */
  --line: #DEE6EF;
  --line2: #CBD6E3;

  /* Colors - Navigation Rail */
  --rail: #0D1626;
  --rail2: #16233A;
  --rail3: #233350;
  --railInk: #93A4BD;

  /* Colors - Status */
  --brand: #0F766E;
  --brand2: #14958B;
  --brandSoft: #E2F4F1;

  --ok: #12805C;
  --okSoft: #E3F5EC;

  --low: #A55A08;
  --lowSoft: #FDF0DC;

  --out: #B42318;
  --outSoft: #FCE9E7;

  --ord: #1D4ED8;
  --ordSoft: #E8EEFE;

  --mute: #64748B;
  --muteSoft: #EEF2F7;

  /* Fonts */
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  /* Spacing */
  --r: 10px;

  /* Effects */
  --sh: 0 1px 2px rgba(11, 18, 32, 0.06), 0 1px 3px rgba(11, 18, 32, 0.04);
  --shL: 0 10px 30px rgba(11, 18, 32, 0.14);

  /* Safe area insets (mobile) */
  --sat: env(safe-area-inset-top);
  --sab: env(safe-area-inset-bottom);
}

/* ===== css/base.css ===== */
/**
 * css/base.css - Base styles and resets
 */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
}

a {
  color: var(--brand);
  text-decoration: none;
}

.mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

.hide {
  display: none !important;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-thumb {
  background: var(--line2);
  border-radius: 4px;
}

/* Accessibility: respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

/* ===== css/layout.css ===== */
/**
 * css/layout.css - Layout, grid, flexbox, and responsive styles
 */

/* ============ LOCK SCREEN ============ */
#lock {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: radial-gradient(1200px 600px at 20% -10%, #1B3350 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 110%, #0F4F4A 0%, transparent 55%), #0A1220;
  display: flex;
  flex-direction: column;
  color: #fff;
  padding: calc(var(--sat) + 22px) 22px calc(var(--sab) + 22px);
}

#lock.gone {
  display: none;
}

.lk-top {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.lk-clock {
  font-family: var(--mono);
  font-size: 60px;
  font-weight: 200;
  letter-spacing: -2px;
  line-height: 1;
}

.lk-date {
  color: #8FA3BE;
  font-size: 13px;
  margin-top: 8px;
  letter-spacing: 0.5px;
}

.lk-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 34px;
}

.lk-brand img {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  object-fit: contain;
  background: #fff;
}

.lk-mark {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: linear-gradient(140deg, var(--brand2), #0B5F70);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 16px;
}

.lk-name {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.lk-sub {
  font-size: 11px;
  color: #7F93AE;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  margin-top: 2px;
}

.lk-form {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
}

.lk-field {
  position: relative;
  margin-bottom: 11px;
}

.lk-field input {
  width: 100%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #fff;
  border-radius: 12px;
  padding: 15px 46px 15px 15px;
  font-size: 16px;
  outline: none;
}

.lk-field input:focus {
  border-color: var(--brand2);
  background: rgba(255, 255, 255, 0.1);
}

.lk-field input::placeholder {
  color: #7186A2;
}

.lk-eye {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  padding: 10px;
  color: #8FA3BE;
  font-size: 12px;
}

.lk-go {
  width: 100%;
  background: var(--brand2);
  color: #fff;
  font-weight: 700;
  border-radius: 12px;
  padding: 15px;
  font-size: 15px;
  margin-top: 4px;
}

.lk-go:active {
  transform: scale(0.99);
}

.lk-err {
  background: rgba(180, 35, 24, 0.2);
  border: 1px solid rgba(255, 120, 110, 0.35);
  color: #FFB4AD;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 12.5px;
  margin-bottom: 11px;
}

/* ============ SHELL ============ */
#app {
  display: none;
  min-height: 100%;
}

#app.on {
  display: block;
}

.rail {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 236px;
  background: var(--rail);
  z-index: 60;
  display: flex;
  flex-direction: column;
  padding-top: var(--sat);
  transition: transform 0.22s ease;
}

.rail-head {
  padding: 16px 16px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--rail3);
}

.rail-head img {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  object-fit: contain;
  background: #fff;
  flex: none;
}

.rail-mark {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  flex: none;
  background: linear-gradient(140deg, var(--brand2), #0B5F70);
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 800;
  font-size: 14px;
}

.rail-nm {
  color: #fff;
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: -0.2px;
  line-height: 1.2;
}

.rail-sb {
  color: #6E829E;
  font-size: 9.5px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  margin-top: 1px;
}

.rail-foot {
  padding: 11px 16px calc(11px + var(--sab));
  border-top: 1px solid var(--rail3);
  color: #54678A;
  font-size: 10.5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(6, 11, 20, 0.55);
  z-index: 55;
  display: none;
}

.scrim.on {
  display: block;
}

.main {
  margin-left: 236px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.top {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: var(--sat);
}

.top-in {
  height: 54px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
}

.burger {
  display: none;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--surface3);
  place-items: center;
  font-size: 16px;
  flex: none;
}

.pg-t {
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: -0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-r {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

.wrap {
  padding: 16px;
  max-width: 1360px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
}

/* ============ NAV ============ */
.nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
}

.nav-lbl {
  color: #56698A;
  font-size: 9.5px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  padding: 12px 8px 6px;
  font-weight: 700;
}

.nav a {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 11px;
  border-radius: 8px;
  color: var(--railInk);
  font-size: 13.5px;
  font-weight: 500;
  margin-bottom: 2px;
  cursor: pointer;
}

.nav a .ic {
  width: 18px;
  text-align: center;
  font-size: 15px;
  flex: none;
  opacity: .9;
}

.nav a .bdg {
  margin-left: auto;
  background: var(--out);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: 999px;
  min-width: 18px;
  text-align: center;
}

.nav a .bdg.amber {
  background: #C2740D;
}

.nav a:hover {
  background: var(--rail2);
  color: #D6E1EE;
}

.nav a.on {
  background: var(--rail3);
  color: #fff;
  box-shadow: inset 3px 0 0 var(--brand2);
}

/* ============ TOP BAR CONTROLS ============ */
.sitesel {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 600;
  max-width: 170px;
  outline: none;
}

.icbtn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 14px;
  position: relative;
}

.icbtn .dot {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--out);
}

.avat {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 12.5px;
  flex: none;
}

.pg-s {
  font-size: 11px;
  color: var(--ink3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}

.sitebtn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12.5px;
  max-width: 250px;
  flex: none;
}

.sitebtn .cd {
  font-family: var(--mono);
  font-weight: 700;
  letter-spacing: .3px;
}

.sitebtn .nm {
  font-weight: 500;
  color: var(--ink2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sitebtn .cv {
  color: var(--ink3);
  font-size: 10px;
  flex: none;
}

.sitebtn .wd {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--out);
  flex: none;
}

@media (max-width: 860px) {
  .rail {
    transform: translateX(-100%);
    width: 265px;
    box-shadow: var(--shL);
  }

  .rail.on {
    transform: translateX(0);
  }

  .main {
    margin-left: 0;
  }

  .burger {
    display: grid;
  }

  .wrap {
    padding: 12px;
  }

  .sitebtn .nm {
    display: none;
  }

  .sitebtn {
    padding: 7px 9px;
  }
}

@media print {
  .rail,
  .top {
    display: none;
  }

  .main {
    margin: 0;
  }
}

/* ===== css/components.css ===== */
/**
 * css/components.css - Reusable component styles
 */

/* ============ CARDS / KPI ============ */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 13px;
  box-shadow: var(--sh);
  position: relative;
  overflow: hidden;
  text-align: left;
  display: block;
  width: 100%;
}

.kpi:before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--line2);
}

.kpi.ok:before {
  background: var(--ok);
}

.kpi.low:before {
  background: var(--low);
}

.kpi.out:before {
  background: var(--out);
}

.kpi.ord:before {
  background: var(--ord);
}

.kpi.br:before {
  background: var(--brand);
}

.kpi-l {
  font-size: 10.5px;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  font-weight: 700;
}

.kpi-v {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -1.2px;
  margin-top: 5px;
  line-height: 1;
}

.kpi-d {
  font-size: 11.5px;
  color: var(--ink2);
  margin-top: 5px;
}

.kpi-d .up {
  color: var(--out);
  font-weight: 700;
}

.kpi-d .dn {
  color: var(--ok);
  font-weight: 700;
}

.kpi-d .fl {
  color: var(--ink3);
  font-weight: 700;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh);
  margin-bottom: 14px;
}

.card-h {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 9px;
}

.card-t {
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: -0.1px;
}

.card-s {
  font-size: 11.5px;
  color: var(--ink3);
  margin-top: 1px;
}

.card-h .r {
  margin-left: auto;
  display: flex;
  gap: 6px;
  align-items: center;
}

.card-b {
  padding: 14px;
}

.card-b.flush {
  padding: 0;
}

/* ============ CONTROLS ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 13px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--surface2);
  border: 1px solid var(--line2);
  color: var(--ink);
}

.btn:hover {
  background: var(--surface3);
}

.btn.pri {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.btn.pri:hover {
  background: var(--brand2);
}

.btn.dgr {
  background: var(--out);
  border-color: var(--out);
  color: #fff;
}

.btn.sm {
  padding: 5px 9px;
  font-size: 11.5px;
  border-radius: 7px;
}

.btn.blk {
  width: 100%;
}

.btn:disabled {
  opacity: 0.45;
  pointer-events: none;
}

/* ============ TABS ============ */
.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding: 3px;
  background: var(--surface3);
  border-radius: 9px;
  margin-bottom: 12px;
}

.tabs button {
  padding: 7px 13px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink2);
  white-space: nowrap;
  border: none;
  background: none;
}

.tabs button.on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--sh);
}

/* ============ PILLS / BADGES ============ */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  white-space: nowrap;
}

.pill.ok {
  background: var(--okSoft);
  color: var(--ok);
}

.pill.low {
  background: var(--lowSoft);
  color: var(--low);
}

.pill.out {
  background: var(--outSoft);
  color: var(--out);
}

.pill.ord {
  background: var(--ordSoft);
  color: var(--ord);
}

.pill.mute {
  background: var(--muteSoft);
  color: var(--mute);
}

.pill.br {
  background: var(--brandSoft);
  color: var(--brand);
}

/* ============ PROGRESS / BARS ============ */
.bar-use {
  height: 8px;
  border-radius: 4px;
  background: var(--surface3);
  overflow: hidden;
  margin: 8px 0 4px;
}

.bar-use i {
  display: block;
  height: 100%;
  background: var(--brand);
  transition: width 0.3s;
}

.bar-use i.warn {
  background: var(--low);
}

.bar-use i.full {
  background: var(--out);
}

/* Stock bar with marker */
.sb {
  position: relative;
  height: 6px;
  background: var(--surface3);
  border-radius: 3px;
  overflow: visible;
  min-width: 78px;
}

.sb i {
  display: block;
  height: 6px;
  border-radius: 3px;
  background: var(--ok);
  transition: width 0.3s;
}

.sb.low i {
  background: var(--low);
}

.sb.out i {
  background: var(--out);
}

.sb u {
  position: absolute;
  top: -3px;
  height: 12px;
  width: 2px;
  background: var(--ink);
  opacity: 0.5;
  border-radius: 1px;
}

.sb-lg {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink3);
  margin-top: 3px;
  display: flex;
  justify-content: space-between;
}

/* ============ FORMS ============ */
.fld {
  margin-bottom: 11px;
}

.fld label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink2);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 5px;
}

.fld input,
.fld select,
.fld textarea {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  font-size: 15px;
  outline: none;
}

.fld input:focus,
.fld select:focus,
.fld textarea:focus {
  border-color: var(--brand);
}

.fld textarea {
  min-height: 66px;
  resize: vertical;
  font-size: 14px;
}

.fld .hlp {
  font-size: 11px;
  color: var(--ink3);
  margin-top: 4px;
}

.f2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* ============ EMPTY STATE ============ */
.empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--ink3);
}

.empty .e-i {
  font-size: 30px;
  opacity: 0.35;
}

.empty .e-t {
  font-weight: 700;
  color: var(--ink2);
  margin-top: 8px;
  font-size: 13.5px;
}

.empty .e-s {
  font-size: 12.5px;
  margin-top: 3px;
}

/* ============ MODAL / SHEET ============ */
.mask {
  position: fixed;
  inset: 0;
  background: rgba(6, 11, 20, 0.5);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.mask.on {
  display: flex;
}

.modal {
  background: var(--surface);
  border-radius: 14px;
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shL);
  overflow: hidden;
}

.m-h {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
}

.m-t {
  font-size: 15px;
  font-weight: 700;
}

.m-s {
  font-size: 11.5px;
  color: var(--ink3);
  margin-top: 1px;
}

.m-x {
  margin-left: auto;
  width: 30px;
  height: 30px;
  border-radius: 7px;
  background: var(--surface3);
  display: grid;
  place-items: center;
  font-size: 15px;
  flex: none;
}

.m-b {
  padding: 16px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.m-f {
  padding: 12px 16px calc(12px + var(--sab));
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
}

.m-f .btn {
  flex: 1;
  padding: 11px;
}

/* ============ MENU ============ */
.menu {
  position: fixed;
  z-index: 110;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 11px;
  box-shadow: var(--shL);
  padding: 5px;
  min-width: 190px;
  display: none;
}

.menu.on {
  display: block;
}

.menu button {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 9px 11px;
  border-radius: 7px;
  font-size: 13px;
  text-align: left;
  font-weight: 500;
  border: none;
  background: none;
  cursor: pointer;
}

.menu button:hover {
  background: var(--surface2);
}

.menu button.dgr {
  color: var(--out);
}

.menu .div {
  height: 1px;
  background: var(--line);
  margin: 4px 0;
}

.menu .mh {
  padding: 9px 11px 7px;
  font-size: 11px;
  color: var(--ink3);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

/* ============ TOAST ============ */
.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  bottom: calc(20px + var(--sab));
  z-index: 150;
  background: var(--rail);
  color: #fff;
  padding: 11px 17px;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shL);
  transition: transform 0.25s;
  max-width: 90vw;
  text-align: center;
}

.toast.on {
  transform: translateX(-50%) translateY(0);
}

.toast.bad {
  background: var(--out);
}

.toast.good {
  background: var(--ok);
}

/* ============ CONSUMPTION BARS ============ */

.bars {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  height: 150px;
  padding-top: 6px;
}

.bcol {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  height: 100%;
  min-width: 0;
}

.bcol .pair {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  width: 100%;
  height: 100%;
  justify-content: center;
}

.bcol i {
  display: block;
  width: 100%;
  max-width: 15px;
  border-radius: 3px 3px 0 0;
  min-height: 2px;
  transition: height .35s;
}

.bcol i.bin {
  background: var(--ok);
}

.bcol i.bout {
  background: var(--brand);
}

.bcol.now i {
  opacity: .55;
}

.bcol b {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--ink2);
  margin-bottom: 4px;
  white-space: nowrap;
  font-weight: 600;
}

.bcol span {
  font-size: 9.5px;
  color: var(--ink3);
  margin-top: 5px;
  text-transform: uppercase;
  letter-spacing: .4px;
  white-space: nowrap;
}

.bcol.now span {
  color: var(--low);
  font-weight: 700;
}

.legend {
  display: flex;
  gap: 14px;
  font-size: 11.5px;
  color: var(--ink3);
  margin-top: 10px;
  flex-wrap: wrap;
}

.legend i {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  margin-right: 5px;
  vertical-align: middle;
}

/* ============ TOP LISTS ============ */

.top5 {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.t5r {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12.5px;
}

.t5r .t5n {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.t5r .t5b {
  width: 34%;
  flex: none;
}

.t5r .t5v {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink2);
  flex: none;
  width: 66px;
  text-align: right;
}

/* ============ SITE PICKER ============ */

.siterow {
  display: flex;
  gap: 11px;
  align-items: center;
  width: 100%;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  background: none;
}

.siterow:last-child {
  border-bottom: 0;
}

.siterow:hover {
  background: var(--surface2);
}

.siterow.on {
  background: var(--brandSoft);
}

.siterow .cd {
  width: 46px;
  height: 40px;
  border-radius: 9px;
  background: var(--rail);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 12.5px;
  flex: none;
}

.siterow.on .cd {
  background: var(--brand);
}

.siterow .nm {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.3;
}

.siterow .mt {
  font-size: 11.5px;
  color: var(--ink3);
  margin-top: 2px;
}

.siterow .tk {
  margin-left: auto;
  flex: none;
  text-align: right;
}

/* ============ CATEGORY BREAKDOWN ============ */

.catrow {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  width: 100%;
  text-align: left;
  background: none;
}

.catrow:last-child {
  border-bottom: 0;
}

.catrow:hover {
  background: var(--surface2);
}

.cat-n {
  width: 112px;
  flex: none;
}

.cat-n b {
  font-size: 13px;
  font-weight: 600;
  display: block;
}

.cat-n span {
  font-size: 11px;
  color: var(--ink3);
  display: block;
  margin-top: 1px;
}

.cat-b {
  flex: 1;
  min-width: 60px;
}

.stack {
  height: 9px;
  border-radius: 5px;
  background: var(--surface3);
  display: flex;
  overflow: hidden;
}

.stack i {
  display: block;
  height: 100%;
  transition: width .3s;
}

.stack i.g {
  background: var(--brand);
}

.stack i.r {
  background: var(--out);
}

.cat-v {
  flex: none;
  width: 98px;
  text-align: right;
}

.cat-v b {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 600;
  display: block;
}

.cat-v span {
  font-size: 10.5px;
  color: var(--ink3);
  display: block;
  margin-top: 1px;
}

.cat-chips {
  display: flex;
  gap: 4px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.seg {
  display: inline-flex;
  background: var(--surface3);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}

.seg button {
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink2);
}

.seg button.on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--sh);
}

.morerow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 11px 14px;
  border-top: 1px solid var(--line);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--brand);
  background: var(--surface2);
}

.morerow:hover {
  background: var(--surface3);
}

.morerow span {
  color: var(--ink3);
  font-weight: 500;
}

/* ============ PHOTOS ============ */

.th {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--surface3);
  flex: none;
  display: block;
  cursor: zoom-in;
  border: 1px solid var(--line);
}

.th.ph0 {
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink3);
  cursor: default;
  letter-spacing: .3px;
}

.th.lg {
  width: 54px;
  height: 54px;
  border-radius: 9px;
}

.hero {
  width: 100%;
  max-height: 230px;
  object-fit: contain;
  background: var(--surface3);
  border-radius: 10px;
  margin-bottom: 14px;
  display: block;
  cursor: zoom-in;
  border: 1px solid var(--line);
}

.phfld {
  display: flex;
  gap: 11px;
  align-items: flex-start;
}

.phfld .pv {
  width: 74px;
  height: 74px;
  border-radius: 10px;
  object-fit: cover;
  background: var(--surface3);
  border: 1px solid var(--line);
  flex: none;
  display: block;
}

.phfld .pv.ph0 {
  display: grid;
  place-items: center;
  color: var(--ink3);
  font-size: 20px;
}

.phfld .ac {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.lbl-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 11.5px;
  font-weight: 600;
  background: var(--surface2);
  border: 1px solid var(--line2);
  color: var(--ink);
  cursor: pointer;
}

.lbl-btn:hover {
  background: var(--surface3);
}

/* ============ TOOLBAR / SEARCH ============ */

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.tools {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.srch {
  flex: 1;
  min-width: 170px;
  position: relative;
}

.srch input {
  width: 100%;
  padding: 9px 11px 9px 32px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  outline: none;
  font-size: 13px;
}

.srch input:focus {
  border-color: var(--brand);
}

.srch:before {
  content: "⌕";
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink3);
  font-size: 15px;
}

.sel {
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  font-size: 12.5px;
  font-weight: 600;
  outline: none;
}

/* ============ TABLE / ROWS ============ */

.tbl {
  width: 100%;
  border-collapse: collapse;
}

.tbl th {
  text-align: left;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .7px;
  color: var(--ink3);
  font-weight: 700;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface2);
  white-space: nowrap;
}

.tbl td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  vertical-align: middle;
}

.tbl tr:last-child td {
  border-bottom: 0;
}

.tbl tbody tr:hover {
  background: var(--surface2);
}

.tbl .num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}

.pname {
  font-weight: 600;
}

.psku {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink3);
  margin-top: 1px;
}

.rows {
  display: none;
}

.row {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 11px;
  align-items: flex-start;
}

.row:last-child {
  border-bottom: 0;
}

.row-m {
  flex: 1;
  min-width: 0;
}

.row-r {
  text-align: right;
  flex: none;
}

.row-x {
  display: flex;
  gap: 6px;
  margin-top: 9px;
  flex-wrap: wrap;
}

/* ============ ALERT LIST ============ */

.al {
  display: flex;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  align-items: center;
  width: 100%;
  text-align: left;
}

.al:last-child {
  border-bottom: 0;
}

.al:hover {
  background: var(--surface2);
}

.al-i {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 13px;
  flex: none;
}

.al-i.out {
  background: var(--outSoft);
  color: var(--out);
}

.al-i.low {
  background: var(--lowSoft);
  color: var(--low);
}

.al-i.ord {
  background: var(--ordSoft);
  color: var(--ord);
}

.al-i.br {
  background: var(--brandSoft);
  color: var(--brand);
}

.al-t {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
}

.al-s {
  font-size: 11.5px;
  color: var(--ink3);
  margin-top: 1px;
}

.al-r {
  margin-left: auto;
  text-align: right;
  flex: none;
  font-size: 11.5px;
}

/* ============ QTY STEPPER ============ */

.step {
  display: flex;
  align-items: center;
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}

.step button {
  width: 46px;
  height: 46px;
  font-size: 20px;
  font-weight: 600;
  background: var(--surface2);
  color: var(--ink2);
}

.step button:active {
  background: var(--surface3);
}

.step input {
  flex: 1;
  text-align: center;
  border: 0;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 19px;
  font-weight: 600;
  height: 46px;
  outline: none;
  width: 100%;
  padding: 0;
}

/* ============ SITE PICKER ============ */

.pick {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(100px,1fr));
  gap: 7px;
}

.pick button {
  padding: 11px 8px;
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--surface);
}

.pick button.on {
  border-color: var(--brand);
  background: var(--brandSoft);
  color: var(--brand);
}

/* ============ KEY / VALUE ============ */

.kv {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 13px;
}

.kv:last-child {
  border-bottom: 0;
}

.kv span {
  color: var(--ink3);
}

.kv b {
  font-weight: 600;
  text-align: right;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 860px) {
  .f2 {
    grid-template-columns: 1fr;
  }

  .mask {
    padding: 0;
    align-items: flex-end;
  }

  .modal {
    max-width: 100%;
    border-radius: 16px 16px 0 0;
    max-height: 92vh;
  }

  .kpis {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .catrow {
    flex-wrap: wrap;
    gap: 8px;
  }

  .cat-n {
    width: auto;
    flex: 1;
  }

  .cat-v {
    width: auto;
  }

  .cat-b {
    flex-basis: 100%;
    order: 3;
    min-width: 0;
  }

  .tbl {
    display: none;
  }

  .rows {
    display: block;
  }
}

@media (max-width: 900px) {
  .grid2 {
    grid-template-columns: 1fr;
  }
}

@media print {
  .tools,
  .tabs {
    display: none;
  }
}

/* ============ BULK SELECTION ============ */
.selbox {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.selbox input {
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: var(--brand);
  cursor: pointer;
}

.rows .selbox {
  padding-top: 3px;
}

.selbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 9px 12px;
  background: var(--surface2);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  color: var(--ink2);
}

.selbar span {
  margin-right: auto;
}

.selbar b {
  color: var(--ink);
}

/* ============ PHOTO GALLERY ============ */
.thwrap {
  position: relative;
  display: inline-block;
  flex: none;
}

.thn {
  position: absolute;
  right: -4px;
  bottom: -4px;
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  border-radius: 8px;
  background: var(--brand);
  color: #fff;
  font-size: 9.5px;
  font-weight: 700;
  line-height: 15px;
  text-align: center;
  border: 1.5px solid var(--surface);
}

.phhero {
  margin-bottom: 8px;
}

.hero-ph {
  width: 100%;
  height: 150px;
  border-radius: 10px;
  font-size: 15px;
}

.phstrip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 14px;
}

.phstrip img,
.phstrip .phmiss {
  width: 52px;
  height: 52px;
  border-radius: 7px;
  object-fit: cover;
  flex: none;
  cursor: zoom-in;
  border: 1px solid var(--line);
  background: var(--surface3);
}

.phstrip img.on {
  border-color: var(--brand);
  box-shadow: 0 0 0 1px var(--brand);
}

.phmiss {
  display: grid;
  place-items: center;
  color: var(--ink3);
  font-family: var(--mono);
  font-weight: 700;
  cursor: default;
}

.phgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 8px;
}

.phcard {
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
  background: var(--surface2);
}

.phcard.main {
  border-color: var(--brand);
}

.phcard img,
.phcard .pv {
  width: 100%;
  height: 72px;
  object-fit: cover;
  display: block;
  cursor: zoom-in;
}

.phcard .pv.ph0 {
  display: grid;
  place-items: center;
  color: var(--ink3);
  font-family: var(--mono);
  font-weight: 700;
  background: var(--surface3);
  cursor: default;
}

.phcard-b {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  padding: 4px 5px;
  border-top: 1px solid var(--line);
}

.phcard-t {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--ink3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.phcard-a {
  display: flex;
  gap: 2px;
  flex: none;
}

.phcard-a button {
  border: 0;
  background: none;
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  padding: 2px 3px;
  border-radius: 4px;
  color: var(--ink3);
}

.phcard-a button:hover {
  background: var(--surface3);
  color: var(--ink);
}

.phadd {
  display: grid;
  place-items: center;
  gap: 2px;
  height: 100px;
  border: 1.5px dashed var(--line2);
  border-radius: 9px;
  cursor: pointer;
  color: var(--ink3);
  background: var(--surface2);
}

.phadd:hover {
  border-color: var(--brand);
  color: var(--brand);
}

.phadd span:first-child {
  font-size: 20px;
  line-height: 1;
}

.phadd-t {
  font-size: 10.5px;
  font-weight: 600;
}

/* ============ PERMISSION MATRIX ============ */
.modal.wide {
  max-width: 880px;
}

.permtbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}

.permtbl th {
  text-align: center;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .6px;

/**
 * js/crypto.js - Password hashing

 * Accounts are shared through the cloud store, so a password must never leave

 * per-account random salt.

 * Be clear about what this buys: it protects against READING, not against
 * attacking. It keeps passwords off the screen, out of the backup file and out
 * of the shared store. Anyone who obtains the records still has salt and hash
 * and can grind offline as fast as their hardware allows - there is no server
 * here to withhold a secret or impose a rate limit. PBKDF2 makes each guess
 * expensive; it cannot rescue a weak password.
 *
 * Values are hex, never base64: a spreadsheet cell whose text starts with
 * + - = or @ is parsed as a formula, and hex can only ever start [0-9a-f].

const PW_ALG = 'pbkdf2-sha256';
const PW_ITER = 150000;         // WebCrypto: ~90ms
const PW_ITER_JS = 20000;       // bundled fallback: ~1s on a slow phone

/** Which engine this device ended up with. Set by initPwEngine(). */
let PW_ENGINE = 'subtle';

/**
 * Pick the hashing engine with a real round trip, not a typeof check - a stub
 * can exist and still throw. WebCrypto needs a secure context, which covers
 * https and file:// but NOT a plain http:// LAN address, and this app travels.
 */
async function initPwEngine() {
  try {
    const d = await crypto.subtle.digest('SHA-256', new Uint8Array([1]));
    PW_ENGINE = d && d.byteLength === 32 ? 'subtle' : 'js';
  } catch (e) {
    PW_ENGINE = 'js';
  }

  if (PW_ENGINE === 'js') console.warn('WebCrypto unavailable — using the bundled hash');

const hex = (bytes) => [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');

function unhex(s) {
  const a = new Uint8Array(s.length / 2);
  for (let i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16);
  return a;
}

/**
 * 16 random bytes. Deliberately not uid() - that is Math.random, which is not
 * a source anyone should build a salt from.
 */
function newSalt() {

  crypto.getRandomValues(a);
  return hex(a);

/* ---------- bundled SHA-256, for when WebCrypto is not available ---------- */

const K256 = [

  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,

  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,

function sha256(bytes) {
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];

  const len = bytes.length;
  const withPad = new Uint8Array((((len + 9) >> 6) + 1) << 6);
  withPad.set(bytes);
  withPad[len] = 0x80;

  const bits = len * 8;
  const dv = new DataView(withPad.buffer);
  dv.setUint32(withPad.length - 4, bits >>> 0, false);
  dv.setUint32(withPad.length - 8, Math.floor(bits / 4294967296), false);

  const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));

  for (let off = 0; off < withPad.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }

    let [a, b, c, d, e, f, g, h] = H;

    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K256[i] + w[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;

      h = g; g = f; f = e;
      e = (d + t1) >>> 0;
      d = c; c = b; b = a;
      a = (t1 + t2) >>> 0;
    }

    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }

  const out = new Uint8Array(32);
  const odv = new DataView(out.buffer);
  H.forEach((v, i) => odv.setUint32(i * 4, v, false));
  return out;
}

function hmacSha256(key, msg) {
  let k = key.length > 64 ? sha256(key) : key;

  const pad = new Uint8Array(64);
  pad.set(k);

  const inner = new Uint8Array(64 + msg.length);
  const outer = new Uint8Array(64 + 32);

  for (let i = 0; i < 64; i++) {
    inner[i] = pad[i] ^ 0x36;
    outer[i] = pad[i] ^ 0x5c;
  }
  inner.set(msg, 64);
  outer.set(sha256(inner), 64);

  return sha256(outer);
}

function pbkdf2Js(pw, salt, iter, dkLen) {
  const out = new Uint8Array(dkLen);
  const blocks = Math.ceil(dkLen / 32);

  for (let b = 1; b <= blocks; b++) {
    const first = new Uint8Array(salt.length + 4);
    first.set(salt);
    new DataView(first.buffer).setUint32(salt.length, b, false);

    let u = hmacSha256(pw, first);
    const acc = u.slice();

    for (let i = 1; i < iter; i++) {
      u = hmacSha256(pw, u);
      for (let j = 0; j < 32; j++) acc[j] ^= u[j];
    }

    out.set(acc.subarray(0, Math.min(32, dkLen - (b - 1) * 32)), (b - 1) * 32);
  }

  return out;
}

/* ---------- the API the rest of the app uses ---------- */

/**
 * Derive a key. `iter` comes from the record being verified, not from a
 * constant, so a record hashed on one engine still verifies on the other.
 */
async function pwDerive(password, saltHex, iter) {
  const salt = unhex(saltHex);
  const pw = new TextEncoder().encode(password);

  if (PW_ENGINE === 'subtle') {
    const k = await crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, k, 256);
    return hex(new Uint8Array(bits));
  }

  return hex(pbkdf2Js(pw, salt, iter, 32));
}

/** The credential fields for a new password. */
async function pwHash(password) {
  const salt = newSalt();
  const pwIter = PW_ENGINE === 'subtle' ? PW_ITER : PW_ITER_JS;

  return { pwAlg: PW_ALG, pwIter, salt, hash: await pwDerive(password, salt, pwIter) };
}

/**
 * Compare without an early exit on the first differing character. Real
 * constant time is not achievable in JS, but leaking the length of the common
 * prefix is free to avoid.
 */
function pwEq(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;

  let d = 0;
  for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return d === 0;
}

/** Set an account's password, dropping any cleartext it still carried. */
async function pwSet(acc, password) {
  Object.assign(acc, await pwHash(password), { updated: Date.now() });
  delete acc.p;
  return acc;
}

/**
 * Check a password, upgrading a legacy cleartext record on the first correct
 * sign-in. Hashing every account at load would block startup for a second per
 * account on the fallback engine; doing it here spends that time at the one
 * moment the person is already waiting.
 *
 * @returns {Promise<boolean>}
 */
async function pwVerify(acc, password) {
  if (!acc) return false;

  if (!acc.hash && acc.p !== undefined) {
    if (String(acc.p) !== password) return false;
    await pwSet(acc, password);
    return true;
  }

  if (!acc.hash || !acc.salt) return false;

  return pwEq(await pwDerive(password, acc.salt, Number(acc.pwIter) || PW_ITER), acc.hash);
}

}

// Format date to ISO string (YYYY-MM-DD)
const iso = (d) => new Date(d).toISOString().slice(0, 10);

// Add N days to a date
const addD = (n, base) => iso(new Date((base ? new Date(base) : today()).getTime() + n * DAY));

// Days until a date (negative if past)
const daysTo = (d) => Math.round((new Date(d + 'T00:00:00') - today()) / DAY);

// Format date to readable format
const fmtD = (d) => {
  if (!d) return '—';
  const x = new Date(d + 'T00:00:00');
  return x.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
};

// Format datetime
const fmtDT = (t) => new Date(t).toLocaleString('en-GB', {
  day: '2-digit',
  month: 'short',
  hour: '2-digit',
  minute: '2-digit'
});

// Format as currency
const money = (n) => '$' + (Number(n) || 0).toLocaleString('en-US', {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});

// Format relative time ("2h ago", "just now", etc.)
const ago = (t) => {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return fmtDT(t);
};

/**
 * js/utils/math.js - Mathematical and calculation utilities
 */

// Generate week start date (Monday)
function weekStart() {
  const d = today();
  return new Date(d.getTime() - ((d.getDay() + 6) % 7) * DAY);
}

// Generate month start date
function monthStart() {
  const d = today();
  return new Date(d.getFullYear(), d.getMonth(), 1);
}

// Generate year start date
function yearStart() {
  const d = today();
  return new Date(d.getFullYear(), 0, 1);
}

// Calculate percentage change
function percentChange(current, previous) {
  if (!previous) return current ? '<span class="up">new</span>' : '<span class="fl">no prior data</span>';
  const p = Math.round((current - previous) / previous * 100);
  if (Math.abs(p) < 1) return '<span class="fl">level</span> vs last period';
  return `<span class="${p > 0 ? 'up' : 'dn'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</span> vs last period`;
}

// Stock bar proportions
function stockBarProportions(part) {
  const span = Math.max(part.min * 2, part.qty, 1);
  const width = Math.min(100, part.qty / span * 100);
  const minMark = Math.min(100, part.min / span * 100);
  return { width, minMark, span };
}

// Photo size calculation
function photoBytes(photoObj) {
  return Object.values(photoObj).reduce((a, s) => a + s.length, 0);
}

// Calculate inventory value
function inventoryValue(parts) {
  return parts.reduce((a, p) => a + p.qty * p.cost, 0);
}

/* ===== js/storage.js ===== */
/**
 * js/storage.js - IndexedDB and localStorage abstraction layer
 *
 * The app is shipped as a single file that people open by double-clicking it,
 * so this layer has to survive a `file://` origin: IndexedDB is sometimes
 * blocked or slow there, and Safari throws on `localStorage` outright. The
 * rules that follow from that:
 *
 *   - one backend is chosen before the first read and kept for the session
 *   - a read that misses in IndexedDB still consults localStorage, so data
 *     written in a localStorage-only session is never seeded over
 *   - a write that lands nowhere says so, instead of failing quietly
 */

let _db = null;

/** What is actually live this session. Read by the photo budget and Settings. */
let STORE = { idb: false, ls: false, why: 'init' };

/** Keys whose IndexedDB write failed - do not read a stale copy back. */
const _idbBad = new Set();

/** Set once a save has failed, so the UI can stay honest about it. */
let STORAGE_FAILED = false;

/* ---------- localStorage, guarded ---------- */

// Safari throws from the property getter itself on file://, so every access
// has to sit inside the try - `typeof localStorage` is not a safe pre-check.

function lsGet(k) {
  try {
    return localStorage.getItem(k);
  } catch (e) {
    STORE.ls = false;
    return null;
  }
}

function lsSet(k, v) {
  try {
    localStorage.setItem(k, v);
    return true;
  } catch (e) {
    return false;
  }
}

function lsDel(k) {
  try {
    localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
}

function lsProbe() {
  try {
    localStorage.setItem('__vg_probe', '1');
    localStorage.removeItem('__vg_probe');
    return true;
  } catch (e) {
    return false;
  }
}

/* ---------- IndexedDB ---------- */

/**
 * Open the database, or give up cleanly.
 *
 * A handle that turns up after the timeout is closed rather than adopted:
 * loadState() runs immediately after initStorage(), so a late handle would mean
 * the read came from localStorage while every later write went to a database
 * the reader never looked at - the same split store this module exists to
 * prevent. One backend, chosen before the first read.
 */
function openDB(timeoutMs = 4000) {
  return new Promise((resolve) => {
    if (!window.indexedDB) return resolve({ db: null, why: 'no-indexeddb' });

    let settled = false;
    let timer = null;

    const finish = (db, why) => {
      if (settled) {
        if (db) {
          try { db.close(); } catch (e) { /* nothing to do */ }
        }
        return;
      }
      settled = true;
      clearTimeout(timer);
      resolve({ db, why });
    };

    let r;
    try {
      r = indexedDB.open(DB_NAME, 1);
    } catch (e) {
      return resolve({ db: null, why: 'open-threw' });
    }

    r.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE);
    };

    r.onsuccess = (e) => {
      const db = e.target.result;
      db.onversionchange = () => {
        try { db.close(); } catch (x) { /* nothing to do */ }
        _db = null;
        STORE.idb = false;
      };
      db.onclose = () => {
        _db = null;
        STORE.idb = false;
      };
      finish(db, 'ok');
    };

    r.onerror = () => finish(null, 'open-error');

    // Another copy of the app holding an older version open. Rare with a fixed
    // version, but without this handler neither success nor error ever fires.
    r.onblocked = () => finish(null, 'blocked');

    timer = setTimeout(() => finish(null, 'timeout'), timeoutMs);
  });
}

/**
 * A database can open successfully and still be unusable - a half-failed
 * upgrade leaves it without the object store, and every transaction then
 * throws. Find that out once, here, rather than on every read.
 */
function idbProbe(db) {
  return new Promise((res) => {
    try {
      const t = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get('__probe');
      t.onsuccess = () => res(true);
      t.onerror = () => res(false);
    } catch (e) {
      res(false);
    }
  });
}

function idbGet(k) {
  return new Promise((res, rej) => {
    const t = _db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k);
    t.onsuccess = () => res(t.result);
    t.onerror = () => rej(t.error);
  });
}

function idbPut(k, v) {
  return new Promise((res, rej) => {
    const t = _db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(v, k);
    t.onsuccess = () => res();
    t.onerror = () => rej(t.error);
  });
}

/* ---------- read / write ---------- */

/**
 * Read a value, preferring IndexedDB but never letting an empty one hide a
 * good localStorage copy.
 *
 * @param {string} k
 * @param {function} [looksUsable] - rejects a record that is present but broken,
 *   so a truncated write degrades to a miss instead of triggering a reseed
 */
async function dbGet(k, looksUsable) {
  let idbVal;
  let idbHit = false;
  let idbFaulted = false;

  if (_db && !_idbBad.has(k)) {
    try {
      idbVal = await idbGet(k);
      idbHit = idbVal !== undefined;
    } catch (e) {
      // We no longer know what IndexedDB holds for this key
      idbFaulted = true;
    }
  }

  // dbSet writes IndexedDB first, so where the two disagree localStorage is the
  // stale one. A good hit therefore wins outright.
  if (idbHit && (!looksUsable || looksUsable(idbVal))) return idbVal;

  let lsVal;
  try {
    const raw = localStorage.getItem(k);
    if (raw) lsVal = JSON.parse(raw);
  } catch (e) {
    if (e instanceof SyntaxError) console.warn('Corrupt localStorage record for', k);
    else STORE.ls = false;
  }

  if (lsVal !== undefined && (!looksUsable || looksUsable(lsVal))) {
    // Converge the two stores, but only after a clean miss - then we know for a
    // fact IndexedDB held nothing here, so nothing fresher can be lost. Awaited
    // on purpose: a queued put could otherwise land after migrate() and
    // saveState() and overwrite the migrated store with this older copy.
    if (_db && !idbFaulted && !idbHit) {
      try { await idbPut(k, lsVal); } catch (e) { /* stay on localStorage */ }
    }
    return lsVal;
  }

  // A record we could not validate still beats nothing at all
  if (idbHit) return idbVal;

  return undefined;
}

/**
 * Write a value and report where it actually landed.
 *
 * @returns {Promise<{ok:boolean, idb:boolean, ls:boolean, err:string|null}>}
 *   ok  - durable in at least one backend
 *   err - 'quota' | 'security' | 'idb' | 'none' | null
 */
async function dbSet(k, v, opts) {
  const out = { ok: false, idb: false, ls: false, err: null };
  const mirror = !opts || opts.mirror !== false;

  if (_db) {
    try {
      await idbPut(k, v);
      out.idb = true;
      _idbBad.delete(k);
    } catch (e) {
      out.err = 'idb';
      // Reading this key back from IndexedDB would now return a stale value
      _idbBad.add(k);
      console.warn('IndexedDB write failed for', k, e);
    }
  }

  if (mirror) {
    try {
      localStorage.setItem(k, JSON.stringify(v));
      out.ls = true;
    } catch (e) {
      out.err = /security/i.test(e.name) ? 'security' : 'quota';
      if (out.err === 'security') STORE.ls = false;
    }
  }

  // One backend is enough. A full localStorage while IndexedDB is healthy is
  // ordinary, and must not be reported as a failure.
  out.ok = out.idb || out.ls;
  if (!out.ok && !out.err) out.err = 'none';

  return out;
}

/**
 * Tell the user a save did not stick, and keep saying so after the toast goes.
 */
function reportSaveFailure(what, r) {
  STORAGE_FAILED = true;

  const why = r.err === 'quota'
    ? 'Storage on this device is full — remove some photos in Settings.'
    : r.err === 'security'
      ? 'This browser blocks saving for files opened directly. Open it from a web address instead.'
      : 'Storage on this device refused the write.';

  console.error(what, r);
  toast(what + '. ' + why, 'bad');

  if (typeof setSync === 'function') setSync('● not saving', '#FF9A92');
}

/**
 * How much photo data fits, given the backend that is actually live.
 */
function photoBudget() {
  return STORE.idb ? PH_BUDGET_IDB : PH_BUDGET_LS;
}

/**
 * Remove this app's data from the device. Scoped to our own keys: under
 * file:// every local page shares one origin, so localStorage.clear() would
 * take unrelated pages' data with it.
 */
async function dbClear() {
  if (_db) {
    try {
      await new Promise((res, rej) => {
        const t = _db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).clear();
        t.onsuccess = () => res();
        t.onerror = () => rej(t.error);
      });
    } catch (e) {
      // fall through and still clear localStorage
    }
  }

  [LS_KEY, PH_KEY, REMEMBER_KEY].forEach(lsDel);
}

/**
 * Choose the backend for this session, before anything is read.
 */
async function initStorage() {
  const t0 = Date.now();
  const opened = await openDB();
  const usable = opened.db ? await idbProbe(opened.db) : false;

  if (opened.db && !usable) {
    try { opened.db.close(); } catch (e) { /* nothing to do */ }
  }

  _db = usable ? opened.db : null;
  STORE.idb = !!_db;
  STORE.ls = lsProbe();
  STORE.why = usable ? 'ok' : (opened.why === 'ok' ? 'store-missing' : opened.why);

  if (!STORE.idb) {
    console.warn(`IndexedDB unavailable (${STORE.why}) after ${Date.now() - t0}ms — using localStorage`);
  }
  if (!STORE.idb && !STORE.ls) {
    console.error('No storage backend available:', STORE.why);
  }
}

 * half-written record would otherwise load over the defaults and leave nobody

 * may have deleted the last line — so it must never be read as "nothing saved
 * yet" and reseeded over.
 *
 * dbGet takes this too, so a truncated record in one backend degrades to a miss
 * and the good copy in the other one is found instead.
 */
const storeLooksUsable = (o) => !!o &&
  Array.isArray(o.users) && o.users.length &&
  Array.isArray(o.parts) && Array.isArray(o.tools);

 */
async function saveState() {
  S.session = VIEW.user ? { u: VIEW.user.u, at: Date.now() } : null;

  if (!r.ok) reportSaveFailure('Your changes could not be saved on this device', r);

}

/**
 * Guarantee somebody can still get into Settings.
 *
 * If the last manager was deleted, deactivated, or left without any usable
 * credential, restore the shipped account — otherwise the store is stuck at the
 * lock screen for good, because the only reset lives behind a sign-in. An
 * existing manager who can still sign in is never touched.
 *
 * Called from loadState, from the backup restore (which bypasses loadState),
 * and after a pull adopts a remote account list.
 *
 * @returns {boolean} whether the shipped account had to be put back
 */
function ensureSignInPossible() {
  const admins = S.users.filter((u) => {
    const p = permsFor(u);
    // A record with neither a hash nor a readable password cannot sign in, so
    // it does not count as a way back in however many permissions it has.
    return u.active !== 0 && p.admin && p.admin.accounts && (u.hash || u.p !== undefined);
  });

  if (admins.length) return false;

  DEMO_USERS.forEach((d) => {
    const found = S.users.find((u) => u.u === d.u);
    if (found) {
      Object.assign(found, { active: 1, role: d.role, perms: null, p: d.p, updated: Date.now() });
      delete found.hash;
      delete found.salt;
    } else {
      S.users.push({ ...d, updated: Date.now() });
    }
  });

  return true;
}

 * When this page runs inside the claude.ai viewer, `claude.use('db')` resolves
 * a realtime document store shared by everyone who has this artifact open.
 * Every shared collection (sites, parts, tools, orders, accounts, activity) is
 * mirrored there, one document per record, and every device subscribes to
 * changes — so an issue booked on one phone appears on every other screen
 * within seconds.
 *
 * Design rules:
 *   - The device copy (localStorage / IndexedDB) stays the offline cache; the
 *     cloud is the shared truth once connected.
 *   - The first device ever to connect seeds the cloud from its local store.
 *     After that, snapshots from the cloud are adopted as they arrive.
 *   - Pushes are diffs: only records that changed are written, so two people
 *     editing different parts at the same time do not overwrite each other.
 *   - Passwords travel only as PBKDF2 salt + hash (pwSet strips cleartext).
 *   - Uploaded photos ride along as their own collection, one document per
 *     photo, so a picture added on one device shows on all of them.
 */

 * (Project settings → Your apps → Web app). This is public client config, not

/** Load one external script and resolve when it is ready. */
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error('could not load ' + src));
    document.head.appendChild(s);
  });
}

/**
 * Bring up Cloud Firestore via its compat CDN build. The compat API matches
 * the claude.ai db namespace exactly for everything this app calls:
 * collection().onSnapshot / limit().get, doc('col/id').set / .delete.
 */
async function initFirebase() {
  const V = '10.12.4';
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);

  firebase.initializeApp(FIREBASE_CONFIG);

  // Sign in before touching the database. The security rules require it, so a
  // reader who has only the address - and not an account - gets nothing. The
  // identity is anonymous and per device; the app's own sign-in still decides
  // who the person is and what they may do.
  try {
    const cred = await firebase.auth().signInAnonymously();
    CLOUD_UID = cred && cred.user ? cred.user.uid : null;
    CLOUD_SECURED = true;
  } catch (e) {
    // Anonymous sign-in has not been switched on in the Firebase console yet.
    // Carry on unauthenticated rather than taking the shared store down: the
    // rules still allow it today. CLOUD_SECURED stays false so the app can say
    // plainly that the data is reachable by anyone holding the address.
    const code = (e && e.code) || '';
    CLOUD_UID = null;
    CLOUD_SECURED = false;
    console.warn(
      /configuration-not-found|operation-not-allowed/.test(code)
        ? 'Firebase anonymous sign-in is not enabled — the shared store is UNSECURED. ' +
          'Firebase console -> Authentication -> Sign-in method -> Anonymous -> Enable.'
        : 'Firebase sign-in failed (' + (code || e.message) + ') — the shared store is UNSECURED.'
    );
  }

  return firebase.firestore();
}

let CLOUD = null;                 // db namespace, or null when unavailable
let CLOUD_UID = null;             // this device's anonymous identity, when signed in
let CLOUD_SECURED = false;        // true once the store is reached as a signed-in caller
let CLOUD_LIVE = false;           // at least one snapshot has been processed
let CLOUD_APPLYING = false;       // a remote snapshot is being adopted
let CLOUD_TIMER = null;           // debounce for pushes
let CLOUD_RENDER_TIMER = null;    // debounce for repaints
let CLOUD_PENDING_RENDER = false; // a repaint is waiting for a modal to close
let CLOUD_LAST = {};              // col -> { docId: json } last known cloud state
let CLOUD_FIRST = {};             // col -> true once the first snapshot arrived

/** The shared collections, and how they map onto the app state. */
/**
 * Biggest document either store will take. Firestore allows 1 MiB and the
 * claude.ai store 256 KiB, so the tighter one is the rule, less a little room
 * for the JSON the field names add.
 */
const CLOUD_DOC_MAX = 240 * 1024;

const CLOUD_COLS = [
  { col: 'sites', key: 'id', get: () => S.sites, set: (v) => { S.sites = v; } },
  { col: 'parts', key: 'id', get: () => S.parts, set: (v) => { S.parts = v; } },
  { col: 'tools', key: 'id', get: () => S.tools, set: (v) => { S.tools = v; } },
  { col: 'pos',   key: 'id', get: () => S.pos,   set: (v) => { S.pos = v; } },
  { col: 'users', key: 'u',  get: () => S.users, set: (v) => { S.users = v; } },

  // Delete requests. These only matter because they cross devices: raised on a
  // storekeeper's phone, decided on the manager's computer.
  {
    col: 'requests', key: 'id',
    get: () => S.requests || [],
    set: (v) => { S.requests = v.slice().sort((a, b) => (b.at || 0) - (a.at || 0)); }
  },

  {
    col: 'log', key: 'id',
    get: () => S.log.slice(0, 300),
    set: (v) => { S.log = v.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0)); }
  },
  {
    // Uploaded photos. A part record only ever carries the short key, so
    // without this the key syncs and the picture does not - every other device
    // looks up an id it has no bytes for and silently shows a blank tile.
    //
    // The bytes deliberately do NOT go inside the part record: saveState
    // mirrors the whole of S into localStorage, and a store full of photos
    // would blow its ~5 MB quota on every save. One document per photo keeps
    // them out of S, and at ~67 KB each sits well inside both the Firestore
    // 1 MiB and the claude.ai 256 KiB per-document ceilings.
    col: 'photos', key: 'id',
    photos: true,
    get: () => Object.keys(PH).map((id) => ({ id, data: PH[id] })),
    set: (v) => {
      const next = {};
      v.forEach((d) => {
        if (d && d.id && typeof d.data === 'string') next[d.id] = d.data;
      });
      PH = next;
    }
  }
];

/** Read a snapshot document defensively (data may be a method or a property). */
function cloudDocData(d) {
  try {
    return typeof d.data === 'function' ? d.data() : d.data;
  } catch (e) {
    return null;
  }
}

/**
 * Connect, decide seed-vs-adopt, and subscribe every collection.
 * Never blocks start-up: the app works from its device copy until this lands.
 */
async function initCloud() {
  // 1) The claude.ai viewer's shared store, when the page runs there
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      CLOUD = await window.claude.use('db');
    } catch (e) {
      CLOUD = null;
    }
  }

  // 2) Firebase, when the page is hosted on an ordinary website
  if (!CLOUD && FIREBASE_CONFIG) {
    try {
      CLOUD = await initFirebase();
    } catch (e) {
      console.warn('Firebase unavailable:', e && e.message);
      CLOUD = null;
    }
  }

  if (!CLOUD) return;

  setSync('● connecting…', '#C2740D');

  // Seed decision: if the cloud has never held any parts, this device's copy
  // becomes the shared starting point.
  let remoteHasData = false;
  try {
    const probe = await CLOUD.collection('parts').limit(1).get();
    remoteHasData = !!(probe && probe.docs && probe.docs.length);
  } catch (e) {
    // If a one-shot read is not available, the first snapshot decides instead.
    remoteHasData = null;
  }

  if (remoteHasData === false) {
    try {
      await cloudPushAll();
      console.log('✓ cloud store seeded from this device');
    } catch (e) {
      console.warn('cloud seed failed', e);
    }
  }

  CLOUD_COLS.forEach(cloudSubscribe);
  CLOUD_LIVE = true;
  setSync('● live', '#8FE3C8');
}

/** Subscribe one collection and adopt every snapshot that arrives. */
function cloudSubscribe(c) {
  try {
    CLOUD.collection(c.col).onSnapshot((snap) => {
      try {
        cloudAdopt(c, snap);
      } catch (e) {
        console.warn('cloud adopt failed for', c.col, e);
      }
    });
  } catch (e) {
    console.warn('cloud subscribe failed for', c.col, e);
  }
}

/** Apply one collection snapshot to the local state. */
function cloudAdopt(c, snap) {
  const items = [];
  const seen = {};

  (snap && snap.docs ? snap.docs : []).forEach((d) => {
    const v = cloudDocData(d);
    if (v && typeof v === 'object') {
      items.push(v);
      seen[String(d.id)] = JSON.stringify(v);
    }
  });

  const first = !CLOUD_FIRST[c.col];
  CLOUD_FIRST[c.col] = true;

  // An empty first snapshot while this device has data means the cloud is
  // still blank (or the one-shot probe was unavailable): seed it, do not
  // adopt the emptiness.
  if (first && !items.length && c.get().length) {
    CLOUD_LAST[c.col] = {};
    cloudQueue();
    return;
  }

  // Identical to what we already hold? Record it and stop.
  const localSeen = {};
  c.get().forEach((o) => {
    const id = String(o[c.key]);
    if (id) localSeen[id] = JSON.stringify(o);
  });
  CLOUD_LAST[c.col] = seen;

  const same = Object.keys(seen).length === Object.keys(localSeen).length &&
    Object.keys(seen).every((k) => localSeen[k] === seen[k]);
  if (same) return;

  CLOUD_APPLYING = true;
  try {
    if (c.col === 'sites') items.sort((a, b) => String(a.id).localeCompare(String(b.id)));
    c.set(items);

    if (c.col === 'users') {
      ensureSignInPossible();
      if (VIEW.user) {
        const me = S.users.find((u) => u.u === VIEW.user.u);
        if (!me || me.active === 0) {
          CLOUD_APPLYING = false;
          signOut();
          toast('Your account was changed on another device — please sign in again', 'bad');
          return;
        }
        VIEW.user = me;
      }
    }

    // Keep the device cache in step (never pushes back: CLOUD_APPLYING is set).
    // Photos live under their own key and must never be folded into S, or the
    // localStorage mirror inside dbSet would blow its quota.
    if (c.photos) dbSet(PH_KEY, PH, { mirror: !STORE.idb });
    else dbSet(LS_KEY, S);
  } finally {
    CLOUD_APPLYING = false;
  }

  cloudRepaint();
}

/** Repaint after remote changes — deferred while a modal or menu is open. */
function cloudRepaint() {
  if (!VIEW.user) return;

  clearTimeout(CLOUD_RENDER_TIMER);
  CLOUD_RENDER_TIMER = setTimeout(() => {
    const busy = hasClass($('#mask'), 'on') || hasClass($('#menu'), 'on');
    if (busy) {
      CLOUD_PENDING_RENDER = true;
      return;
    }

    const q = $('#q');
    const hadFocus = q && document.activeElement === q;

    buildSites();
    buildNav();
    render();

    if (hadFocus) {
      const nq = $('#q');
      if (nq) {
        nq.focus();
        nq.setSelectionRange(nq.value.length, nq.value.length);
      }
    }
  }, 180);
}

/** Queue a diff push of every shared collection (debounced). */
function cloudQueue() {
  if (!CLOUD || CLOUD_APPLYING) return;

  clearTimeout(CLOUD_TIMER);
  CLOUD_TIMER = setTimeout(() => {
    cloudPushDirty().catch((e) => {
      console.warn('cloud push failed', e);
      setSync('● sync failed', '#FF9A92');
    });
  }, 400);
}

/** Write only the records that differ from the last known cloud state. */
async function cloudPushDirty() {
  if (!CLOUD) return;

  let wrote = 0;
  const oversized = [];

  for (const c of CLOUD_COLS) {
    const last = CLOUD_LAST[c.col] || {};
    const next = {};

    for (const o of c.get()) {
      const id = String(o[c.key] || '');
      if (!id) continue;
      next[id] = JSON.stringify(o);
    }

    for (const id of Object.keys(next)) {
      if (last[id] === next[id]) continue;

      // Both stores cap a single document; the claude.ai one is the tighter at
      // 256 KiB. Skip an oversized record by name rather than letting the write
      // reject and abandon every collection after this one.
      if (next[id].length > CLOUD_DOC_MAX) {
        console.warn(`cloud: ${c.col}/${id} is ${Math.round(next[id].length / 1024)} KB, over the ${Math.round(CLOUD_DOC_MAX / 1024)} KB limit — not synced`);
        oversized.push(c.col + '/' + id);
        last[id] = next[id];   // do not retry it on every later save
        continue;
      }

      await CLOUD.doc(c.col + '/' + id).set(JSON.parse(next[id]));
      wrote++;
    }

    for (const id of Object.keys(last)) {
      if (!(id in next)) {
        try { await CLOUD.doc(c.col + '/' + id).delete(); } catch (e) { /* gone already */ }
        wrote++;
      }
    }

    CLOUD_LAST[c.col] = next;
  }

  if (oversized.length) {
    toast(`${oversized.length} item${oversized.length === 1 ? '' : 's'} too large to share — try a smaller photo or a link`, 'bad');
  }

  if (wrote && CLOUD_LIVE) {
    setSync('● live · saved ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }), '#8FE3C8');
  }
}

/** Push everything, used once to seed an empty cloud store. */
async function cloudPushAll() {
  CLOUD_LAST = {};
  await cloudPushDirty();
}

/**
 * js/roles.js - Modules, role templates and per-account permission resolution
 *
 * Permissions are stored per ACCOUNT, not per role. A role is only a template
 * that seeds a new account and that the manager can reset back to. Everything
 * the app gates on resolves through canDo(), so an account can be tuned without
 * touching anyone else who shares its role.
 */

/**
 * Every module the app exposes, with the actions that make sense for it.
 * The module id doubles as the page id used by NAV, PAGES and the router.
 */
const MODULES = [
  { id: 'home',  t: 'Overview',        acts: ['view', 'financial', 'inventory', 'export'] },
  { id: 'parts', t: 'Spare Parts',     acts: ['view', 'add', 'edit', 'del', 'issue', 'receive', 'transfer', 'adjust', 'export'] },
  { id: 'tools', t: 'Tools',           acts: ['view', 'add', 'edit', 'del', 'checkout', 'return', 'export'] },
  { id: 'cal',   t: 'Calibration',     acts: ['view', 'add', 'edit', 'update', 'export'] },
  { id: 'war',   t: 'Warranty',        acts: ['view', 'add', 'edit', 'update', 'export'] },
  { id: 'po',    t: 'Purchase Orders', acts: ['view', 'add', 'edit', 'approve', 'cancel', 'export'] },
  { id: 'log',   t: 'Activity Log',    acts: ['view', 'export'] },
  { id: 'admin', t: 'Settings',        acts: ['view', 'accounts', 'perms', 'sites', 'branding', 'sync'] }
];

/** Columns of the permission matrix. Anything else shows as an operation toggle. */
const CORE_ACTS = ['view', 'add', 'edit', 'del', 'approve', 'export'];

const ACT_LABEL = {
  view: 'View', add: 'Add', edit: 'Edit', del: 'Delete', approve: 'Approve', export: 'Export',
  issue: 'Issue stock', receive: 'Receive stock', transfer: 'Transfer stock', adjust: 'Adjust stock',
  checkout: 'Check out', return: 'Return', update: 'Update status', cancel: 'Cancel',
  financial: 'Financial figures', inventory: 'Inventory figures',
  accounts: 'Manage accounts', perms: 'Manage permissions', sites: 'Manage sites',
  branding: 'Branding', sync: 'Sheet sync'
};

const moduleById = (id) => MODULES.find((m) => m.id === id);

/** A permission set with every action off. */
function noPerms() {
  const p = {};
  MODULES.forEach((m) => {
    p[m.id] = {};
    m.acts.forEach((a) => (p[m.id][a] = 0));
  });
  return p;
}

/** A permission set with every action on. */
function allPerms() {
  const p = noPerms();
  MODULES.forEach((m) => m.acts.forEach((a) => (p[m.id][a] = 1)));
  return p;
}

/**
 * Build a permission set from a compact { module: [actions] } spec.
 * Unlisted modules and actions stay off.
 */
function grantPerms(spec) {
  const p = noPerms();
  Object.entries(spec).forEach(([mod, acts]) => {
    if (!p[mod]) return;
    acts.forEach((a) => {
      if (p[mod][a] !== undefined) p[mod][a] = 1;
    });
  });
  return p;
}

/**
 * Role templates. `label` is what the UI shows; `perms` seeds a new account and
 * is what "Reset to role default" restores.
 */
const ROLES = {
  manager: {
    label: 'Manager',
    blurb: 'Full system access, accounts, permissions and PO approval',
    perms: allPerms()
  },
  storekeeper: {
    label: 'Storekeeper',
    blurb: 'All stock and tool operations, raises orders',
    perms: grantPerms({
      home: ['view', 'inventory', 'export'],
      parts: ['view', 'add', 'edit', 'issue', 'receive', 'transfer', 'adjust', 'export'],
      tools: ['view', 'add', 'edit', 'checkout', 'return', 'export'],
      po: ['view', 'add', 'edit']
    })
  },
  tech: {
    label: 'Technician',
    blurb: 'Issues parts and books tools out',
    perms: grantPerms({
      home: ['view', 'inventory'],
      parts: ['view', 'issue'],
      tools: ['view', 'checkout', 'return'],
      po: ['view']
    })
  },
  guest: {
    label: 'Guest',
    blurb: 'Read only',
    perms: grantPerms({
      home: ['view'],
      parts: ['view'],
      tools: ['view'],
      cal: ['view'],
      war: ['view']
    })
  }
};

/**
 * The effective permissions for an account: its own saved set where it has one,
 * falling back to its role template for anything not stored. Accounts created
 * before permissions existed therefore keep behaving exactly as before.
 */
function permsFor(user) {
  const tpl = (user && ROLES[user.role] ? ROLES[user.role].perms : null) || noPerms();
  const own = user && user.perms ? user.perms : null;
  const out = noPerms();

  MODULES.forEach((m) => {
    m.acts.forEach((a) => {
      const saved = own && own[m.id] ? own[m.id][a] : undefined;
      out[m.id][a] = (saved === undefined ? tpl[m.id] && tpl[m.id][a] : saved) ? 1 : 0;
    });
  });

  return out;
}

/** Effective permissions for whoever is signed in. */
const myPerms = () => permsFor(VIEW.user);

/**
 * The single gate every feature goes through.
 * An action other than 'view' also requires 'view' on its module, so revoking a
 * module cannot leave a stray action live behind it.
 */
function canDo(mod, act) {
  if (!VIEW.user) return false;

  const p = permsFor(VIEW.user);
  if (!p[mod]) return false;
  if (act !== 'view' && !p[mod].view) return false;

  return !!p[mod][act];
}

/** Can the signed-in account open this page at all? */
const canSee = (page) => canDo(page, 'view');

/** Page ids the signed-in account may open, in menu order. */
const visiblePages = () => MODULES.filter((m) => canDo(m.id, 'view')).map((m) => m.id);

/** Where to land an account that has no page in mind. */
const landingPage = () => visiblePages()[0] || null;

/**
 * Legacy flat capability names, mapped onto the module model. Kept so any call
 * site still using can('x') keeps working; new code should call canDo().
 */
const LEGACY_CAN = {
  edit: ['parts', 'edit'],
  del: ['parts', 'del'],
  issue: ['parts', 'issue'],
  receive: ['parts', 'receive'],
  adjust: ['parts', 'adjust'],
  checkout: ['tools', 'checkout'],
  po: ['po', 'add'],
  poApprove: ['po', 'approve'],
  cal: ['cal', 'update'],
  admin: ['admin', 'view'],
  creds: ['admin', 'accounts'],
  export: ['home', 'export']
};

const can = (k) => {
  const m = LEGACY_CAN[k];
  return m ? canDo(m[0], m[1]) : false;
};

/* ---------- warehouse / site access ---------- */

/**
 * Site ids an account may work in. `sites: []` or a missing list means every
 * site; a single legacy `site` field is honoured as a one-entry list.
 */
function siteIdsFor(user) {
  if (!user) return [];

  const list = Array.isArray(user.sites)
    ? user.sites.filter((id) => id && id !== 'all')
    : (user.site && user.site !== 'all' ? [user.site] : []);

  return list.length ? list : S.sites.map((s) => s.id);
}

/** Site ids the signed-in account may work in. */
const mySiteIds = () => siteIdsFor(VIEW.user);

/** Is this site within the signed-in account's reach? */
const siteAllowed = (id) => id === 'all' || mySiteIds().includes(id);

/** Does this account reach every site the store knows about? */
const hasAllSites = (user) => siteIdsFor(user).length >= S.sites.length;
