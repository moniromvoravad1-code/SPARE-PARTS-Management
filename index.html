/**
 * Tools matching the current tab and search, most urgent first
 */
function filterTools() {
  const q = VIEW.q.toLowerCase();

  return S.tools
    .filter(inSite)
    .filter((t) => VIEW.tab === 'all' || toolState(t) === VIEW.tab || (VIEW.tab === 'out' && t.status === 'out'))
    .filter((t) => !q || (t.name + ' ' + t.code + ' ' + t.holder + ' ' + t.cat).toLowerCase().includes(q))
    .sort((a, b) => {
      const r = { over: 0, out: 1, maint: 2, in: 3 };
      return r[toolState(a)] - r[toolState(b)] || a.code.localeCompare(b.code);
    });
}

            <td>

/**
 * Save the tool editor
 */
async function saveTool(id) {
  const g = (k) => $('#tf' + k).value.trim();

  if (!g('Name')) return toast('Tool name is required', 'bad');

  const int = Number($('#tfInt').value) || 0;
  const last = $('#tfLast').value || null;

  const base = {
    name: g('Name'), code: g('Code'), cat: g('Cat'), site: g('Site'), cond: g('Cond'),
    calInt: int,
    calLast: int ? last : null,
    calNext: int && last ? addD(int * 30, last) : null,
    cert: g('Cert'), notes: g('Notes'),
    war: Number($('#tfWar').value) || 0,
    warFrom: $('#tfWarFrom').value || null
  };

  let phDirty = false;

  if (id) {
    const obj = toolById(id);
    Object.assign(obj, base);
    phDirty = commitPhoto(obj);
    logIt('edit', `Updated tool ${base.name} (${base.code})`, base.site);
  } else {
    const obj = Object.assign({ id: uid('t'), status: 'in', holder: '', outAt: null, dueAt: null, photo: '' }, base);
    phDirty = commitPhoto(obj);
    S.tools.push(obj);
    logIt('add', `Added tool ${base.name} (${base.code})`, base.site);
  }

  // Awaited so the outcome is known before we claim it worked
  const okState = await saveState();
  const okPhotos = phDirty ? await savePhotos() : true;

  closeModal();
  buildNav();
  render();

  if (okState && okPhotos) toast(id ? 'Tool updated' : 'Tool added', 'good');
}

/**
 * Strip one tool out of the register along with its device photo. Logs the
 * removal; the caller saves and repaints.
 */
function removeTool(t) {
  if (t.photo && !/^https?:/i.test(t.photo)) delete PH[t.photo];

  S.tools = S.tools.filter((x) => x.id !== t.id);
  VIEW.sel = VIEW.sel.filter((x) => x !== t.id);

  logIt('del', `Deleted tool ${t.name} (${t.code})`, t.site);
}

}

/* ---------- tool movements ---------- */

/**
 * Book a tool out to a person
 */
function checkoutModal(id) {
  if (!can('checkout')) return toast('Your role cannot book tools out', 'bad');

  const avail = S.tools.filter((t) => inSite(t) && t.status === 'in');
  if (!avail.length) return toast('No tools available at this site', 'bad');

  const pick = id || avail[0].id;
  const self = VIEW.user.role === 'tech';
  const presets = [['End of today', 0], ['3 days', 3], ['1 week', 7], ['2 weeks', 14]];

  openModal('Check out tool', 'Book a tool out to a person', `
    <div class="fld">
      <label>Tool</label>
      <select id="coTool" onchange="coSync()">
        ${avail.map((t) => `<option value="${t.id}" ${pick === t.id ? 'selected' : ''}>${esc(t.code)} — ${esc(t.name)} (${esc(t.site)})</option>`).join('')}
      </select>
      <div class="hlp" id="coHint"></div>
    </div>
    <div class="fld">
      <label>Issued to</label>
      <input id="coWho" value="${esc(VIEW.user.name)}" ${self ? 'readonly' : ''}>
      ${self ? '<div class="hlp">Technicians book tools out under their own name.</div>' : ''}
    </div>
    <div class="fld">
      <label>Return by</label>
      <div class="pick" style="margin-bottom:8px">
        ${presets.map(([l, d], i) =>
          `<button type="button" class="${i === 2 ? 'on' : ''}" onclick="coDue(this,${d})">${l}</button>`
        ).join('')}
      </div>
      <input id="coDue" type="date" value="${addD(7)}">
    </div>
    <div class="fld">
      <label>Purpose</label>
      <input id="coWhy" placeholder="e.g. Bavet quarterly IR scan">
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doCheckout()">Check out</button>
  `);

  coSync();
}

/**
 * Apply a return-by preset
 */
function coDue(btn, d) {
  $$('#modal .pick button').forEach((b) => b.classList.remove('on'));
  btn.classList.add('on');
  $('#coDue').value = addD(d);
}

/**
 * Warn about calibration state on the selected tool
 */
function coSync() {
  const t = toolById($('#coTool').value);
  const st = calState(t);

  $('#coHint').innerHTML =
    st === 'exp'
      ? `<b style="color:var(--out)">Calibration expired ${fmtD(t.calNext)} — this tool should not be used for verification work.</b>`
      : st === 'due'
        ? `<b style="color:var(--low)">Calibration due ${fmtD(t.calNext)}.</b>`
        : t.calInt
          ? `Calibration valid to ${fmtD(t.calNext)}.`
          : 'No calibration required.';
}

/**
 * Commit a checkout
 */
function doCheckout() {
  const t = toolById($('#coTool').value);
  const who = $('#coWho').value.trim();
  const due = $('#coDue').value;
  const why = $('#coWhy').value.trim();

  if (!who) return toast('Enter who is taking the tool', 'bad');
  if (!due) return toast('Set a return date', 'bad');

  t.status = 'out';
  t.holder = who;
  t.outAt = Date.now();
  t.dueAt = due;

  logIt('checkout',
    `Checked out ${t.name} (${t.code}) to ${who}, due ${fmtD(due)}${why ? ' — ' + why : ''}`,
    t.site, { tool: t.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(`${t.code} booked out to ${who}`, 'good');
}

/**
 * Return a tool to the store
 */
function checkinModal(id) {
  if (!can('checkout')) return toast('Your role cannot check tools in', 'bad');

  const out = S.tools.filter((t) => inSite(t) && t.status === 'out');
  if (!out.length) return toast('No tools are currently out', 'bad');

  const pick = id || out[0].id;

  openModal('Check in tool', 'Return a tool to the store', `
    <div class="fld">
      <label>Tool</label>
      <select id="ciTool">
        ${out.map((t) => `<option value="${t.id}" ${pick === t.id ? 'selected' : ''}>
          ${esc(t.code)} — ${esc(t.name)} · ${esc(t.holder)}${daysTo(t.dueAt) < 0 ? ' (overdue)' : ''}
        </option>`).join('')}
      </select>
    </div>
    <div class="fld">
      <label>Condition on return</label>
      <div class="pick">
        ${['Good', 'Fair', 'Needs repair'].map((c, i) =>
          `<button type="button" class="${i === 0 ? 'on' : ''}" data-cond="${c}" onclick="pickOne(this)">${c}</button>`
        ).join('')}
      </div>
    </div>
    <div class="fld">
      <label>Note</label>
      <textarea id="ciNote" placeholder="Damage, missing accessories, anything the next user should know"></textarea>
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doCheckin()">Check in</button>
  `);
}

/**
 * Commit a check-in - a tool returned as "Needs repair" goes straight to service
 */
function doCheckin() {
  const t = toolById($('#ciTool').value);
  const picked = $('#modal .pick button.on');
  const cond = picked ? picked.dataset.cond : 'Good';
  const note = $('#ciNote').value.trim();
  const late = t.dueAt && daysTo(t.dueAt) < 0 ? ` (${Math.abs(daysTo(t.dueAt))} days late)` : '';
  const who = t.holder;

  t.status = cond === 'Needs repair' ? 'maint' : 'in';
  t.cond = cond;
  t.holder = '';
  t.outAt = null;
  t.dueAt = null;
  if (note) t.notes = note;

  logIt('checkin',
    `Checked in ${t.name} (${t.code}) from ${who}${late} — condition ${cond}${note ? ': ' + note : ''}`,
    t.site, { tool: t.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(cond === 'Needs repair' ? `${t.code} received and flagged for service` : `${t.code} back in store`, 'good');
}

/**
 * Send a tool for service, or bring it back
 */
function svcToggle(id) {
  const t = toolById(id);
  if (t.status === 'out') return toast('Check the tool in first', 'bad');

  t.status = t.status === 'maint' ? 'in' : 'maint';
  logIt('edit',
    `${t.name} (${t.code}) ${t.status === 'maint' ? 'sent for service' : 'returned to service'}`,
    t.site);

  saveState();
  buildNav();
  render();
  toast(t.status === 'maint' ? 'Flagged for service' : 'Back in service', 'good');
}

/**
 * Record a calibration certificate
 */
function calModal(id) {
  if (!can('cal')) return toast('Your role cannot record calibration', 'bad');

  const t = toolById(id);

  openModal('Record calibration', `${t.name} · ${t.code}`, `
    <div class="fld">
      <label>Date calibrated</label>
      <input id="clDate" type="date" value="${iso(today())}" onchange="clSync()">
    </div>
    <div class="fld">
      <label>Certificate number</label>
      <input id="clCert" class="mono" value="${esc(t.cert)}" placeholder="CAL-0000">
    </div>
    <div class="f2">
      <div class="fld">
        <label>Interval (months)</label>
        <input id="clInt" type="number" value="${t.calInt}" onchange="clSync()">
      </div>
      <div class="fld">
        <label>Next due</label>
        <input id="clNext" type="date" readonly>
      </div>
    </div>
    <div class="fld">
      <label>Result</label>
      <div class="pick">
        ${['Pass', 'Pass with adjustment', 'Fail'].map((c, i) =>
          `<button type="button" class="${i === 0 ? 'on' : ''}" data-res="${c}" onclick="pickOne(this)">${c}</button>`
        ).join('')}
      </div>
    </div>
    <div class="fld">
      <label>Lab / provider</label>
      <input id="clLab" placeholder="e.g. NMC Cambodia">
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doCal('${id}')">Save certificate</button>
  `);

  clSync();
}

/**
 * Recalculate the next-due date from the date and interval
 */
function clSync() {
  const d = $('#clDate').value;
  const i = Number($('#clInt').value) || 0;
  $('#clNext').value = d && i ? addD(i * 30, d) : '';
}

/**
 * Commit a calibration record - a failure sends the tool for service
 */
function doCal(id) {
  const t = toolById(id);
  const d = $('#clDate').value;
  const i = Number($('#clInt').value) || 0;
  const cert = $('#clCert').value.trim();
  const picked = $('#modal .pick button.on');
  const res = picked ? picked.dataset.res : 'Pass';
  const lab = $('#clLab').value.trim();

  if (!d) return toast('Set the calibration date', 'bad');

  t.calLast = d;
  t.calInt = i;
  t.calNext = i ? addD(i * 30, d) : null;
  t.cert = cert;
  if (res === 'Fail') t.status = 'maint';

  logIt('cal',
    `Calibration ${res.toLowerCase()} for ${t.name} (${t.code})` +
    `${cert ? ' cert ' + cert : ''}${lab ? ' at ' + lab : ''}` +
    `${t.calNext ? ', next due ' + fmtD(t.calNext) : ''}`,
    t.site, { tool: t.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(res === 'Fail' ? 'Recorded as failed — tool flagged for service' : 'Calibration recorded', 'good');
}

/* ---------- order editor ---------- */

// Lines being edited, flushed to the order on save
let poDraft = [];

/**
 * Raise or edit an order
 * @param {string} [id] - Existing order to edit
 * @param {string} [seedPart] - A part id to start from, or 'auto' for every suggestion
 */
function poModal(id, seedPart) {
  if (!can('po')) return toast('Your role cannot raise orders', 'bad');

  const o = id ? poById(id) : null;

  if (o) {
    poDraft = o.lines.map((l) => ({ ...l }));
  } else if (seedPart === 'auto') {
    poDraft = sugList().map((p) => ({ part: p.id, qty: reorderQty(p), cost: p.cost }));
  } else if (seedPart) {
    const p = partById(seedPart);
    poDraft = [{ part: p.id, qty: reorderQty(p), cost: p.cost }];
  } else {
    poDraft = [];
  }

  const sup = o ? o.sup : (poDraft[0] ? partById(poDraft[0].part).sup : '');
  const site = o ? o.site : (VIEW.site === 'all' ? S.sites[0].id : VIEW.site);
  const lead = poDraft.length
    ? Math.max(...poDraft.map((l) => (partById(l.part) || {}).lt || 14))
    : 14;

  openModal(o ? 'Edit order' : 'New purchase order', o ? o.no : 'Raise a supply request', `
    <div class="f2">
      <div class="fld"><label>Supplier</label><input id="poSup" value="${esc(sup)}" placeholder="Supplier name"></div>
      <div class="fld">
        <label>Deliver to</label>
        <select id="poSite">
          ${S.sites.map((s) => `<option value="${s.id}" ${site === s.id ? 'selected' : ''}>${esc(s.code)} — ${esc(s.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="fld">
      <label>Expected delivery</label>
      <input id="poEta" type="date" value="${o ? o.eta : addD(lead)}">
      <div class="hlp">Pre-filled from the longest supplier lead time on this order.</div>
    </div>
    <div class="fld">
      <label>Lines</label>
      <div id="poLines"></div>
      <select class="sel" id="poAdd" style="width:100%;margin-top:8px" onchange="poAddLine()">
        <option value="">＋ Add a part to this order…</option>${partOpts()}
      </select>
    </div>
    <div class="fld"><label>Notes</label><textarea id="poNotes">${o ? esc(o.notes) : ''}</textarea></div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="savePO('${id || ''}')">${o ? 'Save order' : 'Create order'}</button>
  `);

  poLines();
}

/**
 * Redraw the draft lines and running total
 */
function poLines() {
  const h = $('#poLines');
  if (!h) return;

  if (!poDraft.length) {
    h.innerHTML = `
      <div style="padding:14px;text-align:center;color:var(--ink3);font-size:12.5px;
        border:1px dashed var(--line2);border-radius:9px">No lines yet — add a part below.</div>
    `;
    return;
  }

  h.innerHTML = poDraft.map((l, i) => {
    const p = partById(l.part);
    if (!p) return '';

    return `
      <div style="display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:13px">${esc(p.name)}</div>
          <div class="psku">${esc(p.sku)} · on hand ${p.qty}/${p.min} · ${money(l.cost)} each</div>
        </div>
        <input type="number" value="${l.qty}" min="1" style="width:64px;padding:7px;border:1px solid var(--line);
          border-radius:7px;text-align:center;font-family:var(--mono)" oninput="poQty(${i},this.value)">
        <button class="btn sm" onclick="poDel(${i})">✕</button>
      </div>
    `;
  }).join('') + `
    <div style="display:flex;justify-content:space-between;padding-top:10px;font-size:14px">
      <b>Order total</b>
      <b class="mono">${money(poDraft.reduce((a, l) => a + l.qty * l.cost, 0))}</b>
    </div>
  `;
}

/**
 * Add the part chosen in the picker to the draft
 */
function poAddLine() {
  const id = $('#poAdd').value;
  if (!id) return;
  $('#poAdd').value = '';

  if (poDraft.some((l) => l.part === id)) return toast('Already on this order', 'bad');

  const p = partById(id);
  poDraft.push({ part: id, qty: reorderQty(p), cost: p.cost });

  // First line sets the supplier if one has not been typed
  if (!$('#poSup').value) $('#poSup').value = p.sup;

  poLines();
}

/**
 * Change a draft line quantity
 */
function poQty(i, v) {
  poDraft[i].qty = Math.max(1, parseInt(v) || 1);
  poLines();
}

/**
 * Remove a draft line
 */
function poDel(i) {
  poDraft.splice(i, 1);
  poLines();
}

/**
 * Save the order editor
 */
function savePO(id) {
  const sup = $('#poSup').value.trim();
  const site = $('#poSite').value;
  const eta = $('#poEta').value;
  const notes = $('#poNotes').value.trim();

  if (!sup) return toast('Supplier is required', 'bad');
  if (!poDraft.length) return toast('Add at least one line', 'bad');

  if (id) {
    const o = poById(id);
    Object.assign(o, { sup, site, eta, notes, lines: poDraft.map((l) => ({ ...l })) });
    logIt('po',
      `Updated ${o.no} — ${o.lines.length} line${o.lines.length > 1 ? 's' : ''}, ${money(poTotal(o))}`,
      site, { po: o.id });
  } else {
    S.cfg.poSeq = (S.cfg.poSeq || 0) + 1;

    const d = new Date();
    const no = 'PO-' + String(d.getFullYear()).slice(2) +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(S.cfg.poSeq).padStart(3, '0');

    const o = {
      id: uid('po'), no, sup, site, status: 'draft', created: Date.now(),
      eta, by: VIEW.user.u, notes, lines: poDraft.map((l) => ({ ...l }))
    };
    S.pos.unshift(o);

    logIt('po',
      `Created ${no} — ${sup}, ${o.lines.length} line${o.lines.length > 1 ? 's' : ''}, ${money(poTotal(o))}`,
      site, { po: o.id });
  }

  poDraft = [];
  saveState();
  closeModal();
  buildNav();
  render();
  toast(id ? 'Order saved' : 'Order created as draft', 'good');
}

/**
 * Move an order to its next status - receiving books the stock in
 */
function poAdvance(id, to) {
  const o = poById(id);

  if (to === 'ordered' && !can('poApprove')) return toast('A manager must approve draft orders', 'bad');

  if (to === 'received') {
    let n = 0;

    o.lines.forEach((l) => {
      const p = partById(l.part);
      if (!p) return;

      p.qty += l.qty;
      p.updated = Date.now();
      n += l.qty;
      if (p.war) p.warFrom = iso(today());   // delivered batch restarts the warranty

      logIt('receive', `Received ${l.qty} × ${p.name} on ${o.no}`, p.site, {
        part: p.id,
        qty: l.qty,
        value: +(l.qty * l.cost).toFixed(2)
      });
    });

    o.status = 'received';
    logIt('po', `${o.no} received — ${n} items booked into ${o.site} store`, o.site, { po: o.id });

    saveState();
    closeModal();
    buildNav();
    render();
    return toast(`${o.no} received — ${n} items added to stock`, 'good');
  }

  o.status = to;
  logIt('po', `${o.no} marked as ${to === 'shipped' ? 'in transit' : to}`, o.site, { po: o.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(`${o.no} → ${to === 'shipped' ? 'in transit' : to}`, 'good');
}

/**
 * Confirm cancelling an order
 */
function poCancel(id) {
  const o = poById(id);

  openModal('Cancel order', o.no, `
    <p style="font-size:13.5px;margin:0">
      Cancel <b>${esc(o.no)}</b> to ${esc(o.sup)}? Stock will not be booked in and the order closes.
    </p>
  `, `
    <button class="btn" onclick="closeModal()">Keep order</button>
    <button class="btn dgr" onclick="doPoCancel('${id}')">Cancel order</button>
  `);
}

/**
 * Cancel an order
 */
function doPoCancel(id) {
  const o = poById(id);
  o.status = 'cancelled';

  logIt('po', `Cancelled ${o.no} (${o.sup})`, o.site, { po: o.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast('Order cancelled', 'good');
}

function renderLog() {

  }

  ];

      <div class="srch">

      </div>
      <select class="sel" data-filter="tab">
        ${filters.map(([k, l]) =>
          `<option value="${k}" ${VIEW.tab === k ? 'selected' : ''}>${l}</option>`
        ).join('')}
      </select>
      ${can('export') ? '<button class="btn" onclick="expLogCSV()">Download CSV</button>' : ''}
      ${can('export') ? '<button class="btn" onclick="window.print()">Print</button>' : ''}
    </div>
    <div class="card"><div class="card-b flush" id="listHost">${logList()}</div></div>
  `;
}

/**
 * Download the activity currently on screen, filters and all
 */
async function expLogCSV() {
  if (!can('export')) return toast('Manager access required', 'bad');

  const L = filterLog();
  if (!L.length) return toast('Nothing to download', 'bad');

  const head = ['When', 'Type', 'By', 'Site', 'Detail', 'Part', 'Qty', 'Value'];
  const q = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;

  const rows = L.map((l) => {
    const p = l.part ? partById(l.part) : null;
    return [
      new Date(l.ts).toISOString(), l.type, l.by, l.site || '', l.txt,
      p ? p.sku : '', l.qty == null ? '' : l.qty, l.value == null ? '' : l.value
    ].map(q).join(',');
  });

  const ok = await dl(`voltgrid-activity-${iso(today())}.csv`, [head.join(','), ...rows].join('\n'), 'text/csv');
  if (ok) {
    logIt('export', `Downloaded activity log (${L.length} entries)`, VIEW.site);
    saveState();
    toast(`Activity log downloaded — ${L.length} entries`, 'good');
  }
}

/**
 * Activity entries matching the current site, filter and search, newest first
 */
function filterLog() {
  const q = VIEW.q.toLowerCase();

  // Tool movements cover both directions
  const grp = { checkout: ['checkout', 'checkin'] };

  return S.log
    .filter((l) => VIEW.site === 'all' || l.site === VIEW.site)
    .filter((l) => VIEW.tab === 'all' || l.type === VIEW.tab || (grp[VIEW.tab] || []).includes(l.type))
    .filter((l) => !q || (l.txt + ' ' + l.by).toLowerCase().includes(q));
}

/**
 * Rendered activity list
 */
function logList() {
  if (!canSee('log')) return empty('🔒', 'Manager access required', '');

  const L = filterLog();

  if (!L.length) return empty('≡', 'No matching activity', '');

  const ic = {
    issue: '↑', receive: '↓', adjust: '≠', checkout: '⚒', checkin: '↩',
    po: '⇄', cal: '◎', edit: '✎', add: '＋', del: '✕'
  };

  const tone = {
    issue: 'low', receive: 'br', adjust: 'low', checkout: 'ord',
    checkin: 'br', po: 'ord', cal: 'br', del: 'out'
  };

  return L.slice(0, 200).map((l) => `
    <div class="al">
      <div class="al-i ${tone[l.type] || 'br'}">${ic[l.type] || '•'}</div>
      <div style="min-width:0">
        <div class="al-t" style="font-weight:500">${esc(l.txt)}</div>
        <div class="al-s">${esc(l.by)} · ${esc(l.site || '—')} · ${fmtDT(l.ts)}</div>
      </div>
      <div class="al-r" style="color:var(--ink3)">${ago(l.ts)}</div>
    </div>
  `).join('');
}

/**

function permMatrixHtml() {

/**
 * Flip one permission in the draft and repaint the matrix.
 * Turning a module off clears everything under it; granting any action
 * implies being able to open the module.
 */
function permSet(mod, act, on) {
  PERM_DRAFT[mod][act] = on ? 1 : 0;

  if (act === 'view' && !on) {
    Object.keys(PERM_DRAFT[mod]).forEach((k) => (PERM_DRAFT[mod][k] = 0));
  }
  if (act !== 'view' && on) PERM_DRAFT[mod].view = 1;

  const host = $('#permHost');

  const ops = $('#permOps');

}

/**
 * What changed between two permission sets, so the activity log records the
 * actual grants and revokes rather than just "permissions updated".
 */
function permDiff(before, after) {
  const on = [];
  const off = [];

  MODULES.forEach((m) => {
    m.acts.forEach((a) => {
      const b = before[m.id] ? before[m.id][a] : 0;
      const c = after[m.id] ? after[m.id][a] : 0;
      if (b === c) return;
      (c ? on : off).push(`${m.t} → ${ACT_LABEL[a] || a}`);
    });
  });

  return { on, off };
}

/**
 * Scramble any password still held in readable form.
 *
 * Signing in upgrades an account on its own, but an account whose owner has not
 * signed in since the upgrade would otherwise keep a readable password — and
 * once accounts are shared, that would travel. This lets the manager deal with
 * all of them at once, on their own device, at a moment of their choosing.
 */
async function securePasswords() {
  if (!canDo('admin', 'accounts')) return toast('Manager access required', 'bad');

  const stale = S.users.filter(pwIsLegacy);
  if (!stale.length) return toast('Every password is already secured', 'good');

  toast(`Securing ${stale.length} password${stale.length === 1 ? '' : 's'}…`);

  for (const u of stale) await pwSet(u, String(u.p));

  logIt('perm', `Secured ${stale.length} stored password${stale.length === 1 ? '' : 's'}`, 'all');
  await saveState();
  render();
  toast(`${stale.length} password${stale.length === 1 ? '' : 's'} secured`, 'good');
}

/**

async function saveUser(u) {
  if (!canDo('admin', 'accounts')) return toast('Manager access required', 'bad');

  const name = $('#ufName').value.trim();
  const user = $('#ufUser').value.trim().toLowerCase();
  const p = $('#ufPass').value;
  const role = $('#ufRole').value;
  const active = $('#ufActive') && $('#ufActive').value === '0' ? 0 : 1;
  const self = !!u && u === VIEW.user.u;

  if (!name) return toast('Name is required', 'bad');

  // Editing keeps the existing password when the field is left blank; only a
  // new account has to be given one.
  if (!u && !p) return toast('A password is required for a new account', 'bad');
  if (p) {
    const v = validatePassword(p);
    if (!v.valid) return toast(v.msg, 'bad');
  }

  const perms = canDo('admin', 'perms') ? JSON.parse(JSON.stringify(PERM_DRAFT)) : null;

  // Never let the signed-in manager revoke their own way back into Settings
  if (perms && self) {
    perms.admin.view = 1;
    perms.admin.accounts = 1;
    perms.admin.perms = 1;
  }

  const sites = SITE_DRAFT.slice();
  const siteLabel = sites.length ? sites.join(', ') : 'all warehouses';

  if (u) {
    const acc = S.users.find((x) => x.u === u);
    const before = permsFor(acc);

    Object.assign(acc, {
      name, role, active, sites,
      site: sites.length === 1 ? sites[0] : 'all',
      updated: Date.now()
    });
    if (p) await pwSet(acc, p);
    if (perms) acc.perms = perms;

    const d = perms ? permDiff(before, perms) : { on: [], off: [] };
    logIt('perm',
      `Updated account ${name} (${u}) — ${siteLabel}` +
      (d.on.length ? `; enabled ${d.on.join(', ')}` : '') +
      (d.off.length ? `; disabled ${d.off.join(', ')}` : ''),
      'all', { target: u });
  } else {
    if (!user) return toast('Username is required', 'bad');
    if (S.users.some((x) => x.u === user)) return toast('That username already exists', 'bad');

    const acc = {
      u: user, name, role, active, sites,
      site: sites.length === 1 ? sites[0] : 'all',
      updated: Date.now(),
      ...(await pwHash(p))
    };
    if (perms) acc.perms = perms;
    S.users.push(acc);

    logIt('perm', `Created account ${name} (${user}) as ${ROLES[role].label} — ${siteLabel}`,
      'all', { target: user });
  }

  // The signed-in account may have just changed its own reach
  if (self) VIEW.user = S.users.find((x) => x.u === u);

  saveState();
  closeModal();
  buildSites();
  buildNav();
  render();
  toast('Account saved', 'good');
}

/**
 * Add a list of people from a JSON file, without touching stock or history.
 *
 * Accepts either a bare array or { "users": [...] }. Each entry needs at least
 * a username, a password and a name; position, ID card, role and site are
 * optional. Existing usernames are left exactly as they are, so importing the
 * same list twice is safe.
 */
function impUsers(inp) {
  if (!can('admin')) return toast('Manager access required', 'bad');

  const f = inp.files[0];
  if (!f) return;

  const r = new FileReader();

  r.onload = async (e) => {
    inp.value = '';

    let list;
    try {
      const d = JSON.parse(e.target.result);
      list = Array.isArray(d) ? d : d.users;
      if (!Array.isArray(list)) throw new Error('no users array');
    } catch (err) {
      return toast('That file is not an account list', 'bad');
    }

    const added = [];
    const skipped = [];
    const rejected = [];

    if (list.length > 3) toast('Securing passwords…');

    for (const a of list) {
      const u = String(a.u || '').trim().toLowerCase();
      const hashed = a.hash && a.salt;

      if (!u || !a.name || (!hashed && !a.p)) { rejected.push(u || '(no username)'); continue; }
      if (!ROLES[a.role]) { rejected.push(u + ' (unknown role)'); continue; }
      if (!hashed && String(a.p).length < 6) { rejected.push(u + ' (password too short)'); continue; }
      if (S.users.some((x) => x.u === u)) { skipped.push(u); continue; }

      // An already-hashed record is carried across verbatim, so a team can be
      // moved between deployments without anyone's password being known.
      const cred = hashed
        ? { pwAlg: a.pwAlg || PW_ALG, pwIter: Number(a.pwIter) || PW_ITER, salt: String(a.salt), hash: String(a.hash) }
        : await pwHash(String(a.p));

      S.users.push({
        u,
        name: String(a.name),
        position: a.position ? String(a.position) : '',
        idCard: a.idCard ? String(a.idCard) : '',
        role: a.role,
        site: a.site && a.site !== 'all' && S.sites.some((s) => s.id === a.site) ? a.site : 'all',
        active: a.active === 0 ? 0 : 1,
        updated: Date.now(),
        ...cred
      });
      added.push(u);
    }

    if (!added.length && !skipped.length) {
      return toast('Nothing in that file could be imported', 'bad');
    }

    if (added.length) {
      logIt('add', `Imported ${added.length} account${added.length === 1 ? '' : 's'}: ${added.join(', ')}`, 'all');
      await saveState();
    }

    render();

    const parts = [`${added.length} added`];
    if (skipped.length) parts.push(`${skipped.length} already here`);
    if (rejected.length) parts.push(`${rejected.length} rejected`);
    toast(parts.join(' · '), added.length ? 'good' : null);
  };

  r.readAsText(f);
}

/* ---------- photo maintenance ---------- */

/**
 * Drop device photos no item points at any more
 */
/**
 * Check every picture reference in the store and say what is wrong with it.
 *
 * Link checks need the network, so they are done with a real load attempt and
 * a timeout rather than by guessing from the address.
 *
 * @returns {Promise<Array>} one row per problem, worst first
 */
async function photoAudit() {
  const rows = [];
  const items = [...S.parts, ...S.tools];
  const used = new Set();
  const links = [];

  items.forEach((o) => {
    const refs = photoRefs(o);
    const where = (o.sku || o.code || o.id) + ' · ' + (o.name || '');

    if (o.photos && !Array.isArray(o.photos)) {
      rows.push({ kind: 'invalid', item: where, ref: '', note: 'the extra-photo list is not a list' });
    }

    if (refs.length > MAX_EXTRA_PHOTOS + 1) {
      rows.push({ kind: 'invalid', item: where, ref: '', note: `${refs.length} pictures, over the limit of ${MAX_EXTRA_PHOTOS + 1}` });
    }

    refs.forEach((ref) => {
      if (isLinkRef(ref)) {
        links.push({ ref, item: where });
        return;
      }

      if (!/^ph_[a-z0-9]+$/i.test(ref)) {
        rows.push({ kind: 'invalid', item: where, ref, note: 'not a stored picture and not a web address' });
        return;
      }

      used.add(ref);

      if (!PH[ref]) {
        rows.push({
          kind: 'missing', item: where, ref,
          note: CLOUD ? 'the picture has not reached this device' : 'the picture is not on this device and there is no shared store'
        });
        return;
      }

      if (!/^data:image\//i.test(PH[ref])) {
        rows.push({ kind: 'invalid', item: where, ref, note: 'stored data is not an image' });
        return;
      }

      const size = JSON.stringify({ id: ref, data: PH[ref] }).length;
      if (size > CLOUD_DOC_MAX) {
        rows.push({
          kind: 'toobig', item: where, ref,
          note: `${Math.round(size / 1024)} KB — over the ${Math.round(CLOUD_DOC_MAX / 1024)} KB limit, so it is never shared`
        });
      } else if (CLOUD && CLOUD_FIRST.photos && !(CLOUD_LAST.photos || {})[ref]) {
        rows.push({ kind: 'unshared', item: where, ref, note: 'held on this device but not yet in the shared store' });
      }
    });
  });

  // Stored pictures nothing points at any more
  Object.keys(PH).forEach((ref) => {
    if (!used.has(ref)) {
      rows.push({ kind: 'orphan', item: '—', ref, note: 'stored but no part or tool uses it' });
    }
  });

  // Do the link checks together, with a ceiling on how long we wait
  const check = (u) => new Promise((res) => {
    const img = new Image();
    const done = (ok) => { img.onload = img.onerror = null; res(ok); };
    const timer = setTimeout(() => done(false), 8000);
    img.onload = () => { clearTimeout(timer); done(true); };
    img.onerror = () => { clearTimeout(timer); done(false); };
    img.src = u;
  });

  const seenLinks = {};
  for (const l of links) {
    if (seenLinks[l.ref] === undefined) seenLinks[l.ref] = await check(l.ref);
    if (!seenLinks[l.ref]) {
      rows.push({ kind: 'badlink', item: l.item, ref: l.ref, note: 'this address did not load' });
    }
  }

  const order = { missing: 0, badlink: 1, invalid: 2, toobig: 3, unshared: 4, orphan: 5 };
  return rows.sort((a, b) => (order[a.kind] ?? 9) - (order[b.kind] ?? 9));
}

const PHOTO_KIND = {
  missing: ['Picture not here', 'out'],
  badlink: ['Link will not load', 'out'],
  invalid: ['Bad reference', 'out'],
  toobig: ['Too large to share', 'low'],
  unshared: ['Not shared yet', 'low'],
  orphan: ['Unused', 'mute']
};

/** Manager-only report on the health of every picture in the store. */
async function photoDiagnostics() {
  if (!canDo('admin', 'view')) return toast('Manager access required', 'bad');

  openModal('Photo diagnostics', 'Checking every picture…', `
    <div class="empty"><div class="e-i">◌</div><div class="e-t">Checking…</div>
      <div class="e-s">Web links are being loaded to see whether they still work.</div></div>
  `, '<button class="btn" onclick="closeModal()">Close</button>', true);

  const rows = await photoAudit();
  const items = [...S.parts, ...S.tools];
  const withPhoto = items.filter((o) => photoRefs(o).length).length;

  const body = `
    <div class="f2" style="margin-bottom:12px">
      <div class="kv"><span>Items with a picture</span><b>${withPhoto} of ${items.length}</b></div>
      <div class="kv"><span>Pictures stored here</span><b>${Object.keys(PH).length}</b></div>
      <div class="kv"><span>Shared store</span><b>${CLOUD ? (CLOUD_LIVE ? 'connected' : 'connecting') : 'not connected'}</b></div>
      <div class="kv"><span>Problems found</span><b style="color:${rows.length ? 'var(--out)' : 'var(--ok)'}">${rows.length}</b></div>
    </div>

    ${rows.length
      ? `<table class="tbl">
          <thead><tr><th>Problem</th><th>Item</th><th>Reference</th><th>Detail</th></tr></thead>
          <tbody>
            ${rows.map((r) => {
              const [label, pill] = PHOTO_KIND[r.kind] || [r.kind, 'mute'];
              return `<tr>
                <td><span class="pill ${pill}">${esc(label)}</span></td>
                <td>${esc(r.item)}</td>
                <td class="mono" style="font-size:11px">${esc(String(r.ref).slice(0, 34) || '—')}</td>
                <td style="color:var(--ink2)">${esc(r.note)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`
      : `<div class="empty"><div class="e-i">✓</div><div class="e-t">Every picture checks out</div>
          <div class="e-s">All references resolve, all links load, and nothing is orphaned.</div></div>`}

    ${PHOTO_ERRORS.length
      ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
           color:var(--ink3);margin:16px 0 6px">Recent load failures on this device</div>
         ${PHOTO_ERRORS.slice(0, 8).map((e) => `
           <div style="font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)">
             <span class="mono">${esc(e.ref.slice(0, 30) || '—')}</span> · ${esc(e.item)}
             <div style="color:var(--ink3);font-size:11.5px">${esc(e.kind)} — ${esc(e.detail)} · ${ago(e.at)}</div>
           </div>`).join('')}`
      : ''}
  `;

  const orphans = rows.filter((r) => r.kind === 'orphan').length;

  openModal('Photo diagnostics', `${rows.length} problem${rows.length === 1 ? '' : 's'} found`, body, `
    <button class="btn" onclick="closeModal()">Close</button>
    ${orphans ? `<button class="btn" onclick="closeModal();prunePhotos()">Remove ${orphans} unused</button>` : ''}
    <button class="btn pri" onclick="photoDiagnostics()">Check again</button>
  `, true);
}

function prunePhotos() {
  // Photos are shared now, so "unused" has to be judged against the whole
  // store, not a half-loaded copy of it. Until the parts and tools snapshots
  // have arrived, every photo here looks orphaned and pruning would delete the
  // lot for everybody.
  if (CLOUD && !(CLOUD_FIRST.parts && CLOUD_FIRST.tools)) {
    return toast('Still loading from the cloud — try again in a moment', 'bad');
  }

  const used = new Set([...S.parts, ...S.tools].map((o) => o.photo).filter(Boolean));
  const dead = Object.keys(PH).filter((k) => !used.has(k));

  if (!dead.length) return toast('No unused photos to remove');

  dead.forEach((k) => delete PH[k]);
  savePhotos();
  render();
  toast(`Removed ${dead.length} unused photo${dead.length === 1 ? '' : 's'}${CLOUD ? ' — on every device' : ''}`, 'good');
}

/**
 * Confirm wiping every stored photo
 */
function clearPhotos() {
  if (!can('admin')) return toast('Manager access required', 'bad');

  openModal('Delete all photos', 'Linked images are not affected', `
    <p style="font-size:13.5px;margin:0">
      This removes every uploaded photo
      (${Object.keys(PH).length} images, ${(photoBytes(PH) / 1024 / 1024).toFixed(2)} MB).
      Parts and tools stay, they just lose their picture. Export a backup first if you want to keep them.
    </p>
    ${CLOUD
      ? `<p style="font-size:13px;color:var(--out);font-weight:600;margin:10px 0 0">
           Photos are shared, so this deletes them for everyone, on every device — not just here.
         </p>`
      : ''}
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn dgr" onclick="doClearPhotos()">Delete all photos</button>
  `);
}

/**
 * Wipe stored photos and clear the pointers that used them
 */
function doClearPhotos() {
  PH = {};
  [...S.parts, ...S.tools].forEach((o) => {
    if (o.photo && !/^https?:/i.test(o.photo)) o.photo = '';
  });

  savePhotos();
  saveState();
  closeModal();
  render();
  toast('Device photos deleted', 'good');
}

/* ---------- data in / out ---------- */

/**
 * Hand a generated file to the user.
 *
 * Opened as a normal page the browser downloads it directly. Opened inside a
 * viewer that sandboxes downloads, the host save surface takes it instead.
 *
 * @returns {Promise<boolean>} true once the file has been handed over
 */
async function dl(name, text, type) {
  const host = window.claude && typeof window.claude.use === 'function'
    ? await window.claude.use('downloads')
    : null;

  if (host) {
    try {
      await host.save({ filename: name, data: text });
      return true;
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') return false;
      if (code === 'extension_not_enabled') {
        toast('This viewer cannot save that file type — export the JSON backup instead', 'bad');
        return false;
      }
      if (code === 'too_large') {
        toast('That export is too large to save here', 'bad');
        return false;
      }
      toast('Could not save the file', 'bad');
      return false;
    }
  }

  const b = new Blob([text], { type: type || 'application/json' });
  const a = document.createElement('a');

  a.href = URL.createObjectURL(b);
  a.download = name;
  a.click();

  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  return true;
}

/**
 * Export the whole store, photos included
 */
async function expJSON() {
  // A full backup carries the activity log with it, so it follows the same rule
  if (!can('export')) return toast('Manager access required', 'bad');

  // A backup keeps salts and hashes so it can restore sign-in, but never a
  // readable password — a backup may be taken part-way through the upgrade.
  const users = S.users.map((u) => {
    const c = { ...u };
    delete c.p;
    if (!c.hash) c.needsPassword = 1;
    return c;
  });

  const ok = await dl(
    `voltgrid-store-${iso(today())}.json`,
    JSON.stringify(Object.assign({}, S, { users, _photos: PH }), null, 2)
  );
  if (ok) toast('Backup downloaded', 'good');
}

  ];

  const q = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;

  const rows = S.parts.map((p) => [
    p.sku, p.name, p.cat, p.site, p.bin, p.qty, p.min, p.unit, p.cost, (p.qty * p.cost).toFixed(2),
    p.sup, p.lt, stockState(p), p.war || 0, p.warFrom || '', warUntil(p) || '', warState(p),
    /^https?:/i.test(p.photo || '') ? p.photo : (p.photo ? 'on device' : '')
  ].map(q).join(','));

  const ok = await dl(`voltgrid-parts-${iso(today())}.csv`, [head.join(','), ...rows].join('\n'), 'text/csv');
  if (ok) toast('Parts CSV downloaded', 'good');
}

/**
 * Reset to seed data, keeping whoever is signed in
 */
function doReset() {
  const me = VIEW.user.u;

  PH = {};
  savePhotos();

  S = seed();
  VIEW.user = S.users.find((u) => u.u === me) || S.users[0];

  saveState();
  brand();
  buildSites();
  buildNav();
  render();
  closeModal();
  toast('Reset to demo data', 'good');
}

/* ===== js/app.js ===== */
/**
 * js/app.js - Main application orchestrator
 */

// Global app state initialized
let APP_READY = false;

// Page renderers, keyed by page id
const PAGES = {
  home: renderHome,
  parts: renderParts,
  tools: renderTools,
  cal: renderCalibration,
  war: renderWarranty,
  po: renderPO,
  log: renderLog,
  admin: renderAdmin
};

// List renderers, for repainting a page body without a full rebuild
const PAGE_LISTS = {
  parts: partsList,
  tools: toolsList,
  cal: calList,
  war: warList,
  po: poList,
  log: logList
};

/**
 * Main render function - delegates to page-specific renderers
 */
function render() {
  if (!VIEW.user) return;

  // Fall back to the first page this account can open
  if (!canSee(VIEW.page)) VIEW.page = landingPage();

  // Every module revoked: say so plainly instead of rendering a blank shell
  if (!VIEW.page) {
    $('#pgTitle').textContent = 'No access';
    $('#pgSite').textContent = '';
    $('#page').innerHTML = empty('🔒', 'No modules enabled',
      'This account has no modules turned on. A manager can grant access in Settings → Accounts.');
    buildNav();
    $('#alertDot').classList.add('hide');
    return;
  }

  $('#pgTitle').textContent = pageTitle(VIEW.page);
  buildSites();

  const renderFn = PAGES[VIEW.page];
  if (renderFn) {
    renderFn();
  } else {
    $('#page').innerHTML = empty('🔒', 'Access denied', 'You do not have permission to view this page');
  }

  bind();
  $('#alertDot').classList.toggle('hide', !alertCount());
}

/**
 * Wire up the search box, filters, tabs and shortcut links on the current page
 */
function bind() {
  $$('[data-go]').forEach((el) => {
    el.onclick = () => go(el.dataset.go);
  });

  const q = $('#q');
  if (q) {
    q.oninput = (e) => {
      VIEW.q = e.target.value;
      VIEW.sel = [];
      repaint();
    };
  }

  $$('[data-filter]').forEach((el) => {
    el.onchange = (e) => {
      VIEW[el.dataset.filter] = e.target.value;
      VIEW.sel = [];
      repaint();
    };
  });

  $$('[data-tab]').forEach((el) => {
    el.onclick = () => {
      VIEW.tab = el.dataset.tab;
      VIEW.sel = [];
      render();
    };
  });
}

/**
 * Repaint just the list on the current page, keeping the search box focused
 */
function repaint() {
  const host = $('#listHost');
  const listFn = PAGE_LISTS[VIEW.page];

  if (!host || !listFn) {
    render();
    return;
  }

  host.innerHTML = listFn();
}

/**
 * Apply branding
 */
function brand() {
  const c = S.cfg;
  const ini = (c.appName || 'SNT')
    .split(' ')
    .map((x) => x[0])
    .join('')
    .slice(0, 2)
    .toUpperCase();

  ['lk', 'rl'].forEach((k) => {
    const holder = $(`#${k}Logo`);
    if (c.logo) {
      holder.outerHTML = `<img id="${k}Logo" src="${c.logo}" alt="">`;
    } else {
      holder.outerHTML = `<div id="${k}Logo" class="${k === 'lk' ? 'lk-mark' : 'rail-mark'}">${esc(ini)}</div>`;
    }
  });

  $('#lkName').textContent = c.appName;
  $('#rlName').textContent = c.appName;
  document.title = c.appName + ' V3.2';
}

/**
 * Setup clock on lock screen
 */
function tick() {
  const d = new Date();
  $('#lkTime').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  $('#lkDate').textContent = d.toLocaleDateString('en-GB', {
    weekday: 'long',
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  });
}

setInterval(tick, 1000);

/**
 * Initialize application
 */
async function initApp() {
  try {
    // Initialize storage
    await initStorage();

    // Pick the password hashing engine before loadState, which may have to
    // repair a store back to the shipped account
    await initPwEngine();

    // Load state or initialize with seed
    await loadState();

    // Load device photos before anything can render a thumbnail
    await loadPhotos();

    // Apply branding
    brand();
    tick();

    // Local until the live store answers
    setSync('● local only');

    // Setup auth handlers
    initAuth();

    // Connect the live shared store. Never awaited: signing in must work even
    // while the connection is still coming up, or is unavailable entirely.
    initCloud().catch((e) => {
      console.warn('cloud unavailable, working from this device only:', e && e.message);
      setSync('● local only');
    });

    // Resume the session left behind by the last visit. Refreshing the page
    // should never throw the user back to the lock screen — only an explicit
    // sign-out, which clears S.session, or a session past the ceiling does
    // that. "Remember me" lifts the ceiling so the sign-in also survives
    // closing the browser.
    const rememberMe = lsGet(REMEMBER_KEY) === 'true';
    const resumable = S.session &&
      (rememberMe || Date.now() - S.session.at < SESSION_CONFIG.maxSessionDuration);

    if (resumable) {
      const user = S.users.find((u) => u.u === S.session.u && u.active !== 0);
      if (user) {
        logIt('auto_login', `Resumed session: ${user.name}`, 'all', { user: user.u });
        enter(user, rememberMe);
      }
    }

    APP_READY = true;
    console.log('✓ SPARE PARTS MANAGEMENT SYSTEM initialized');
  } catch (e) {
    console.error('Initialization error:', e);
    toast('Failed to initialize application', 'bad');
  }
}

// Escape closes whatever is open, menu first
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeMenu();
    closeModal();
  }
});

// Start app when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
