/* ---------- consumption + goods in ---------- */

/**
 * Consumption, replenishment, 12-month trend and top consumers
 */
function useBlock() {
  const w = use(weekStart());
  const m = use(monthStart());
  const y = use(yearStart());
  const iw = stockIn(weekStart());
  const im = stockIn(monthStart());
  const iy = stockIn(yearStart());

  const d = today();
  const wkDays = ((d.getDay() + 6) % 7) + 1;
  const moDays = d.getDate();
  const doy = Math.floor((d - yearStart()) / DAY) + 1;

  const mode = VIEW.flowMode || 'month';
  const span = FLOW_SPANS[mode] || FLOW_SPANS.month;
  const bars = flowBy(mode);
  const peak = Math.max(...bars.map((b) => Math.max(b.in, b.out)), 1);
  const top = topUsed(monthStart(), 5);
  const topMax = Math.max(...top.map((t) => t.val), 1);

  const burn = y.val / Math.max(doy, 1) * 30.4;
  const cover = burn > 0 ? (stockValue() / burn).toFixed(1) : '—';

  const net = (a, b) => {
    const n = a - b;
    return `<span class="${n < 0 ? 'up' : 'dn'}">${n < 0 ? '▼' : '▲'} ${money(Math.abs(n)).replace('.00', '')}</span>
      ${n < 0 ? 'net drawdown' : 'net build-up'}`;
  };

  const card = (lbl, u, prev, sub, cls) => `
    <div class="kpi ${cls}">
      <div class="kpi-l">${lbl}</div>
      <div class="kpi-v">${money(u.val).replace('.00', '')}</div>
      <div class="kpi-d">${u.qty} items · ${u.n} movement${u.n === 1 ? '' : 's'}</div>
      <div class="kpi-d">${percentChange(u.val, prev.val)}</div>
      <div class="kpi-d" style="color:var(--ink3)">${sub}</div>
    </div>
  `;

  const received = stockIn(weekStart()).lines;

  return `
    <div class="card">
      <div class="card-h">
        <div>
          <div class="card-t">Consumption — stock out</div>
          <div class="card-s">Parts issued from the store · ${VIEW.site === 'all' ? 'all warehouses' : siteName(VIEW.site)}</div>
        </div>
        <div class="r">${canSee('log') ? '<button class="btn sm" data-go="log">Movements</button>' : ''}</div>
      </div>
      <div class="card-b">
        <div class="kpis" style="margin-bottom:0">
          ${card('This week', w, usePrev('week'), `Mon–today · day ${wkDays} of 7`, 'br')}
          ${card('This month', m, usePrev('month'), `1–${moDays} ${MON[d.getMonth()]} ${d.getFullYear()}`, 'ord')}
          ${card('Year to date', y, usePrev('year'), `1 Jan – ${moDays} ${MON[d.getMonth()]} · day ${doy}`, 'ok')}
          <div class="kpi low">
            <div class="kpi-l">Avg burn rate</div>
            <div class="kpi-v">${money(burn).replace('.00', '')}</div>
            <div class="kpi-d">per month, YTD average</div>
            <div class="kpi-d">${Math.round(y.qty / Math.max(doy, 1) * 30.4)} items / month</div>
            <div class="kpi-d" style="color:var(--ink3)">${cover} months of cover on hand</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">
        <div>
          <div class="card-t">New stock in</div>
          <div class="card-s">Goods received and booked into the store</div>
        </div>
        <div class="r">${can('receive') ? '<button class="btn sm pri" onclick="receiveModal()">Receive stock</button>' : ''}</div>
      </div>
      <div class="card-b">
        <div class="kpis" style="margin-bottom:0">
          ${card('This week', iw, flowPrev('receive', 'week'), net(iw.val, w.val), 'br')}
          ${card('This month', im, flowPrev('receive', 'month'), net(im.val, m.val), 'ord')}
          ${card('Year to date', iy, flowPrev('receive', 'year'), net(iy.val, y.val), 'ok')}
          <div class="kpi ${iy.val < y.val ? 'out' : 'ok'}">
            <div class="kpi-l">Replenishment ratio</div>
            <div class="kpi-v">${y.val ? Math.round(iy.val / y.val * 100) : 0}%</div>
            <div class="kpi-d">received vs issued, YTD</div>
            <div class="kpi-d" style="color:var(--ink3)">
              ${iy.val < y.val
                ? 'Drawing stock down faster than replacing it'
                : 'Replacing at or above the burn rate'}
            </div>
          </div>
        </div>

        ${received.length
          ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
              color:var(--ink3);margin:16px 0 2px">Received this week</div>
            ${received.slice(0, ROWCAP).map((l) => {
              const p = partById(l.part);
              return `
                <div class="kv">
                  <span style="color:var(--ink)">${esc(p ? p.name : '—')}
                    <span class="mono" style="font-size:11px;color:var(--ink3)">
                      ${p ? esc(p.sku) : ''} · ${esc(l.site)} · ${ago(l.ts)}</span>
                  </span>
                  <b class="mono">+${l.qty} ${p ? esc(p.unit) : ''}</b>
                </div>
              `;
            }).join('')}
            ${received.length > ROWCAP && canSee('log')
              ? `<button class="morerow" style="border-radius:8px;margin-top:10px;border:1px solid var(--line)"
                  onclick="goLog('receive')">View all ${received.length} receipts
                  <span>+${received.length - ROWCAP} more</span></button>`
              : ''}`
          : ''}
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-h">
          <div>
            <div class="card-t">Stock in vs stock out</div>
            <div class="card-s">${span.label} by value</div>
          </div>
          <div class="r">
            <div class="seg">
              ${[['day', 'Day'], ['week', 'Week'], ['month', 'Month'], ['year', 'Year']].map(([k, l]) =>
                `<button class="${mode === k ? 'on' : ''}" onclick="setFlowMode('${k}')">${l}</button>`
              ).join('')}
            </div>
          </div>
        </div>
        <div class="card-b">
          <div class="bars">
            ${bars.map((b, i) => {
              // 30 daily labels would collide, so caption every fifth bar and today
              const showLabel = mode !== 'day' || i % 5 === 0 || b.now;
              return `
                <div class="bcol ${b.now ? 'now' : ''}"
                  title="${b.label}${mode === 'year' ? '' : ' ' + b.year} — in ${money(b.in)} (${b.inQty}) · out ${money(b.out)} (${b.outQty})">
                  <div class="pair">
                    <i class="bin" style="height:${Math.max(b.in / peak * 100, 1)}%"></i>
                    <i class="bout" style="height:${Math.max(b.out / peak * 100, 1)}%"></i>
                  </div>
                  <span>${showLabel ? b.label : '&nbsp;'}</span>
                </div>
              `;
            }).join('')}
          </div>
          <div class="legend">
            <span><i style="background:var(--ok)"></i>Received in</span>
            <span><i style="background:var(--brand)"></i>Issued out</span>
            <span>${span.partial} is still running</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-h">
          <div>
            <div class="card-t">Top consumers this month</div>
            <div class="card-s">Where the spend is going</div>
          </div>
        </div>
        <div class="card-b">
          ${top.length
            ? `<div class="top5">${top.map((t) => `
                <div class="t5r">
                  <div class="t5n">
                    <b>${esc(t.p.name)}</b>
                    <div class="psku">${esc(t.p.sku)} · ${t.qty} ${esc(t.p.unit)} issued</div>
                  </div>
                  <div class="t5b"><div class="sb"><i style="width:${t.val / topMax * 100}%"></i></div></div>
                  <div class="t5v">${money(t.val).replace('.00', '')}</div>
                </div>
              `).join('')}</div>`
            : empty('▤', 'Nothing issued yet this month', 'Issued parts appear here as they leave the store.')}
        </div>
      </div>
    </div>
  `;
}

/**
 * Parts matching the current search and filters, worst stock state first
 */
function filterParts() {
  const q = VIEW.q.toLowerCase();

  return S.parts
    .filter((p) => inSite(p))
    .filter((p) => VIEW.cat === 'all' || p.cat === VIEW.cat)
    .filter((p) =>
      VIEW.stock === 'all' ||
      stockState(p) === VIEW.stock ||
      (VIEW.stock === 'low' && stockState(p) === 'out'))
    .filter((p) => !q || (p.name + ' ' + p.sku + ' ' + p.bin + ' ' + p.sup).toLowerCase().includes(q))
    .sort((a, b) => {
      const r = { out: 0, low: 1, ok: 2 };
      return r[stockState(a)] - r[stockState(b)] || a.name.localeCompare(b.name);
    });
}

/* ---------- issue / receive / adjust ---------- */

/**
 * Issue stock out of the store
 */
function issueModal(id) {
  if (!can('issue')) return toast('Your role cannot issue stock', 'bad');
  if (!S.parts.length) return toast('There are no parts to issue yet', 'bad');

  const first = id || (filterParts()[0] || S.parts[0]).id;

  openModal('Issue parts', 'Take stock out of the store', `
    <div class="fld">
      <label>Part</label>
      <select id="ipPart" onchange="issueSync()">${partOpts(first)}</select>
    </div>
    <div class="fld">
      <label>Quantity to issue</label>
      ${stepper('ipQty', 1)}
      <div class="hlp" id="ipHint"></div>
    </div>
    <div class="fld">
      <label>Issued to</label>
      <input id="ipTo" value="${esc(VIEW.user.name)}" placeholder="Technician name">
    </div>
    <div class="fld">
      <label>Work order / reason</label>
      <input id="ipRef" placeholder="e.g. WO-2280 PCS-2 fan replacement">
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doIssue()">Issue stock</button>
  `);

  $('#ipQty').addEventListener('input', issueSync);
  issueSync();
}

/**
 * Live "after this issue" hint
 */
function issueSync() {
  const p = partById($('#ipPart').value);
  const q = parseInt($('#ipQty').value) || 0;
  const after = p.qty - q;

  $('#ipHint').innerHTML = `
    On hand ${p.qty} ${esc(p.unit)} →
    <b style="color:${after < 0 ? 'var(--out)' : after <= p.min ? 'var(--low)' : 'var(--ok)'}">${after} after issue</b>
    ${after < 0 ? ' — not enough stock' : after <= p.min && after >= 0 ? ' — will drop below minimum' : ''}
  `;
  $('#ipQty').max = p.qty;
}

/**
 * Commit an issue
 */
function doIssue() {
  const p = partById($('#ipPart').value);
  const q = parseInt($('#ipQty').value) || 0;
  const to = $('#ipTo').value.trim() || VIEW.user.name;
  const ref = $('#ipRef').value.trim();

  if (q < 1) return toast('Enter a quantity of 1 or more', 'bad');
  if (q > p.qty) return toast(`Only ${p.qty} ${p.unit} on hand`, 'bad');

  p.qty -= q;
  p.updated = Date.now();
  logIt('issue', `Issued ${q} × ${p.name} to ${to}${ref ? ' (' + ref + ')' : ''}`, p.site, {
    part: p.id,
    qty: q,
    value: +(q * p.cost).toFixed(2)
  });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(`Issued ${q} ${p.unit} — ${p.qty} left`, 'good');
}

/**
 * Book delivered goods into the store
 */
function receiveModal(id) {
  if (!can('receive')) return toast('Your role cannot receive stock', 'bad');
  if (!S.parts.length) return toast('Add a part before receiving stock', 'bad');

  const first = id || S.parts[0].id;

  openModal('Receive stock', 'Book delivered goods into the store', `
    <div class="fld">
      <label>Part</label>
      <select id="rcPart" onchange="rcSync()">${partOpts(first)}</select>
    </div>
    <div class="fld">
      <label>Quantity received</label>
      ${stepper('rcQty', 1)}
      <div class="hlp" id="rcHint"></div>
    </div>
    <div class="fld">
      <label>Delivery note / PO reference</label>
      <input id="rcRef" placeholder="e.g. PO-2608-013">
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doReceive()">Receive stock</button>
  `);

  $('#rcQty').addEventListener('input', rcSync);
  rcSync();
}

/**
 * Live "after this receipt" hint
 */
function rcSync() {
  const p = partById($('#rcPart').value);
  const q = parseInt($('#rcQty').value) || 0;

  $('#rcHint').innerHTML = `On hand ${p.qty} → <b style="color:var(--ok)">${p.qty + q} ${esc(p.unit)}</b> · bin ${esc(p.bin)}`;
}

/**
 * Commit a receipt
 */
function doReceive() {
  const p = partById($('#rcPart').value);
  const q = parseInt($('#rcQty').value) || 0;
  const ref = $('#rcRef').value.trim();

  if (q < 1) return toast('Enter a quantity of 1 or more', 'bad');

  p.qty += q;
  p.updated = Date.now();
  if (p.war) p.warFrom = iso(today());   // a new batch restarts the supplier warranty

  logIt('receive', `Received ${q} × ${p.name} into ${p.bin}${ref ? ' (' + ref + ')' : ''}`, p.site, {
    part: p.id,
    qty: q,
    value: +(q * p.cost).toFixed(2)
  });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(`Received ${q} ${p.unit} — now ${p.qty}`, 'good');
}

/**
 * Physical stock count / correction
 */
function adjustModal(id) {
  if (!can('adjust')) return toast('Your role cannot adjust stock', 'bad');

  const p = partById(id);

  openModal('Stock count', `${p.name} · ${p.sku}`, `
    <div class="fld">
      <label>Counted quantity</label>
      ${stepper('adQty', p.qty)}
      <div class="hlp" id="adHint">System says ${p.qty} ${esc(p.unit)}</div>
    </div>
    <div class="fld">
      <label>Reason for the difference</label>
      <select id="adWhy">
        <option>Physical count correction</option>
        <option>Damaged / scrapped</option>
        <option>Found in another bin</option>
        <option>Returned unused</option>
        <option>Data entry error</option>
      </select>
    </div>
    <div class="fld">
      <label>Note</label>
      <textarea id="adNote" placeholder="Optional detail for the audit trail"></textarea>
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doAdjust('${id}')">Save count</button>
  `);

  $('#adQty').addEventListener('input', () => {
    const q = parseInt($('#adQty').value) || 0;
    const d = q - p.qty;
    $('#adHint').innerHTML = `
      System says ${p.qty} ${esc(p.unit)} · difference
      <b style="color:${d === 0 ? 'var(--ink2)' : d > 0 ? 'var(--ok)' : 'var(--out)'}">${d > 0 ? '+' : ''}${d}</b>
    `;
  });
}

/**
 * Commit a stock count
 */
function doAdjust(id) {
  const p = partById(id);
  const q = parseInt($('#adQty').value) || 0;
  const why = $('#adWhy').value;
  const n = $('#adNote').value.trim();
  const d = q - p.qty;

  if (d === 0) {
    closeModal();
    return toast('No change recorded');
  }

  p.qty = q;
  p.updated = Date.now();
  logIt('adjust',
    `Stock count: ${p.name} ${d > 0 ? '+' : ''}${d} → ${q} ${p.unit} (${why})${n ? ' — ' + n : ''}`,
    p.site);

  saveState();
  closeModal();
  buildNav();
  render();
  toast(`Adjusted by ${d > 0 ? '+' : ''}${d}`, 'good');
}

/**
 * Save the part editor
 */
function savePart(id) {
  const g = (k) => $('#pf' + k).value.trim();
  const n = (k) => Number($('#pf' + k).value) || 0;

  if (!g('Name')) return toast('Part name is required', 'bad');
  if (!g('Sku')) return toast('SKU is required', 'bad');

  let phDirty = false;

  if (id) {
    const p = partById(id);
    Object.assign(p, {
      name: g('Name'), sku: g('Sku'), bin: g('Bin'), cat: g('Cat'), site: g('Site'),
      min: n('Min'), unit: g('Unit') || 'pcs', cost: n('Cost'), sup: g('Sup'), lt: n('Lt'),
      war: n('War'), warFrom: $('#pfWarFrom').value || null, updated: Date.now()
    });
    phDirty = commitPhoto(p);
    logIt('edit', `Updated part ${p.name} (${p.sku})`, p.site);
  } else {
    const p = {
      id: uid('p'),
      name: g('Name'), sku: g('Sku'), bin: g('Bin'), cat: g('Cat'), site: g('Site'),
      qty: n('Qty'), min: n('Min'), unit: g('Unit') || 'pcs', cost: n('Cost'), sup: g('Sup'), lt: n('Lt'),
      war: n('War'), warFrom: $('#pfWarFrom').value || null, updated: Date.now()
    };
    phDirty = commitPhoto(p);
    S.parts.push(p);
    logIt('add', `Added part ${p.name} (${p.sku}) with ${p.qty} ${p.unit}`, p.site);
  }

  saveState();
  if (phDirty) savePhotos();

  closeModal();
  buildNav();
  render();
  toast(id ? 'Part updated' : 'Part added', 'good');
}

/**
 * Confirm part deletion
 */
function delPart(id) {
  const p = partById(id);

  openModal('Delete part', p.sku, `

      Deleting <b>${esc(p.name)}</b> removes it from the store and from any draft orders.
      The activity log keeps the history.
    </p>
  `, `
    <button class="btn" onclick="closeModal()">Keep it</button>
    <button class="btn dgr" onclick="doDelPart('${id}')">Delete part</button>
  `);
}

/**
 * Strip one part out of the store: its device photo, its stock line and any
 * order lines pointing at it. Logs the removal; the caller saves and repaints.
 */
function removePart(p) {
  if (p.photo && !/^https?:/i.test(p.photo)) delete PH[p.photo];

  S.parts = S.parts.filter((x) => x.id !== p.id);
  S.pos.forEach((o) => {
    o.lines = o.lines.filter((l) => l.part !== p.id);
  });
  VIEW.sel = VIEW.sel.filter((x) => x !== p.id);

  logIt('del', `Deleted part ${p.name} (${p.sku})`, p.site);
}

/**
 * Delete a part, its device photo and any order lines pointing at it
 */
function doDelPart(id) {
  removePart(partById(id));

  savePhotos();
  saveState();
  closeModal();
  buildNav();
  render();
  toast('Part deleted', 'good');
}

/**
 * Confirm deletion of everything ticked in the list
 */
function delSelParts() {
  if (!can('del')) return toast('Only a manager can delete parts', 'bad');

  const L = VIEW.sel.map(partById).filter(Boolean);

    <button class="btn dgr" onclick="doDelSelParts()">Delete ${L.length} part${L.length > 1 ? 's' : ''}</button>
  `);

/**
 * Delete every ticked part
 */
function doDelSelParts() {
  const L = VIEW.sel.map(partById).filter(Boolean);

  saveState();
  closeModal();
  buildNav();

  toast(`Deleted ${L.length} part${L.length > 1 ? 's' : ''}`, 'good');
}

/**
 * Tools matching the current tab and search, most urgent first
 */
function filterTools() {
  const q = VIEW.q.toLowerCase();

  return S.tools
    .filter(inSite)
    .filter((t) => VIEW.tab === 'all' || toolState(t) === VIEW.tab || (VIEW.tab === 'out' && t.status === 'out'))
    .filter((t) => !q || (t.name + ' ' + t.code + ' ' + t.holder + ' ' + t.cat).toLowerCase().includes(q))
    .sort((a, b) => {
      const r = { over: 0, out: 1, maint: 2, in: 3 };
      return r[toolState(a)] - r[toolState(b)] || a.code.localeCompare(b.code);
    });
}

/**
 * Tools list - table on desktop, cards on mobile
 */

  const L = filterTools();

            <td>${t.holder ? esc(t.holder) : '<span style="color:var(--ink3)">—</span>'}</td>
            <td class="mono" style="font-size:12px">${due(t)}</td>
            <td>
              ${calPill(calState(t))}
              ${t.calNext ? `<div class="psku">${fmtD(t.calNext)}</div>` : ''}
            </td>
            <td>${tlPill(toolState(t))}</td>
            <td style="text-align:right">${act(t)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>

    <div class="rows">
      ${L.map((t) => `
        <div class="row">
          ${selBox(t.id)}
          ${thumb(t, t.code.replace('TL-', ''))}
          <div class="row-m">
            <div style="display:flex;gap:8px;align-items:flex-start">

/**
 * Save the tool editor
 */
function saveTool(id) {
  const g = (k) => $('#tf' + k).value.trim();

  if (!g('Name')) return toast('Tool name is required', 'bad');

  const int = Number($('#tfInt').value) || 0;
  const last = $('#tfLast').value || null;

  const base = {
    name: g('Name'), code: g('Code'), cat: g('Cat'), site: g('Site'), cond: g('Cond'),
    calInt: int,
    calLast: int ? last : null,
    calNext: int && last ? addD(int * 30, last) : null,
    cert: g('Cert'), notes: g('Notes'),
    war: Number($('#tfWar').value) || 0,
    warFrom: $('#tfWarFrom').value || null
  };

  let phDirty = false;

  if (id) {
    const obj = toolById(id);
    Object.assign(obj, base);
    phDirty = commitPhoto(obj);
    logIt('edit', `Updated tool ${base.name} (${base.code})`, base.site);
  } else {
    const obj = Object.assign({ id: uid('t'), status: 'in', holder: '', outAt: null, dueAt: null, photo: '' }, base);
    phDirty = commitPhoto(obj);
    S.tools.push(obj);
    logIt('add', `Added tool ${base.name} (${base.code})`, base.site);
  }

  saveState();
  if (phDirty) savePhotos();

  closeModal();
  buildNav();
  render();
  toast(id ? 'Tool updated' : 'Tool added', 'good');
}

/**
 * Book a tool out to a person
 */
function checkoutModal(id) {
  if (!can('checkout')) return toast('Your role cannot book tools out', 'bad');

  const avail = S.tools.filter((t) => inSite(t) && t.status === 'in');
  if (!avail.length) return toast('No tools available at this site', 'bad');

  const pick = id || avail[0].id;
  const self = VIEW.user.role === 'tech';
  const presets = [['End of today', 0], ['3 days', 3], ['1 week', 7], ['2 weeks', 14]];

  openModal('Check out tool', 'Book a tool out to a person', `
    <div class="fld">
      <label>Tool</label>
      <select id="coTool" onchange="coSync()">
        ${avail.map((t) => `<option value="${t.id}" ${pick === t.id ? 'selected' : ''}>${esc(t.code)} — ${esc(t.name)} (${esc(t.site)})</option>`).join('')}
      </select>
      <div class="hlp" id="coHint"></div>
    </div>
    <div class="fld">
      <label>Issued to</label>
      <input id="coWho" value="${esc(VIEW.user.name)}" ${self ? 'readonly' : ''}>
      ${self ? '<div class="hlp">Technicians book tools out under their own name.</div>' : ''}
    </div>
    <div class="fld">
      <label>Return by</label>
      <div class="pick" style="margin-bottom:8px">
        ${presets.map(([l, d], i) =>
          `<button type="button" class="${i === 2 ? 'on' : ''}" onclick="coDue(this,${d})">${l}</button>`
        ).join('')}
      </div>
      <input id="coDue" type="date" value="${addD(7)}">
    </div>
    <div class="fld">
      <label>Purpose</label>
      <input id="coWhy" placeholder="e.g. Bavet quarterly IR scan">
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doCheckout()">Check out</button>
  `);

  coSync();
}

/**
 * Apply a return-by preset
 */
function coDue(btn, d) {
  $$('#modal .pick button').forEach((b) => b.classList.remove('on'));
  btn.classList.add('on');
  $('#coDue').value = addD(d);
}

/**
 * Warn about calibration state on the selected tool
 */
function coSync() {
  const t = toolById($('#coTool').value);
  const st = calState(t);

  $('#coHint').innerHTML =
    st === 'exp'
      ? `<b style="color:var(--out)">Calibration expired ${fmtD(t.calNext)} — this tool should not be used for verification work.</b>`
      : st === 'due'
        ? `<b style="color:var(--low)">Calibration due ${fmtD(t.calNext)}.</b>`
        : t.calInt
          ? `Calibration valid to ${fmtD(t.calNext)}.`
          : 'No calibration required.';
}

/**
 * Commit a checkout
 */
function doCheckout() {
  const t = toolById($('#coTool').value);
  const who = $('#coWho').value.trim();
  const due = $('#coDue').value;
  const why = $('#coWhy').value.trim();

  if (!who) return toast('Enter who is taking the tool', 'bad');
  if (!due) return toast('Set a return date', 'bad');

  t.status = 'out';
  t.holder = who;
  t.outAt = Date.now();
  t.dueAt = due;

  logIt('checkout',
    `Checked out ${t.name} (${t.code}) to ${who}, due ${fmtD(due)}${why ? ' — ' + why : ''}`,
    t.site, { tool: t.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(`${t.code} booked out to ${who}`, 'good');
}

/**
 * Return a tool to the store
 */
function checkinModal(id) {
  if (!can('checkout')) return toast('Your role cannot check tools in', 'bad');

  const out = S.tools.filter((t) => inSite(t) && t.status === 'out');
  if (!out.length) return toast('No tools are currently out', 'bad');

  const pick = id || out[0].id;

  openModal('Check in tool', 'Return a tool to the store', `
    <div class="fld">
      <label>Tool</label>
      <select id="ciTool">
        ${out.map((t) => `<option value="${t.id}" ${pick === t.id ? 'selected' : ''}>
          ${esc(t.code)} — ${esc(t.name)} · ${esc(t.holder)}${daysTo(t.dueAt) < 0 ? ' (overdue)' : ''}
        </option>`).join('')}
      </select>
    </div>
    <div class="fld">
      <label>Condition on return</label>
      <div class="pick">
        ${['Good', 'Fair', 'Needs repair'].map((c, i) =>
          `<button type="button" class="${i === 0 ? 'on' : ''}" data-cond="${c}" onclick="pickOne(this)">${c}</button>`
        ).join('')}
      </div>
    </div>
    <div class="fld">
      <label>Note</label>
      <textarea id="ciNote" placeholder="Damage, missing accessories, anything the next user should know"></textarea>
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doCheckin()">Check in</button>
  `);
}

/**
 * Commit a check-in - a tool returned as "Needs repair" goes straight to service
 */
function doCheckin() {
  const t = toolById($('#ciTool').value);
  const picked = $('#modal .pick button.on');
  const cond = picked ? picked.dataset.cond : 'Good';
  const note = $('#ciNote').value.trim();
  const late = t.dueAt && daysTo(t.dueAt) < 0 ? ` (${Math.abs(daysTo(t.dueAt))} days late)` : '';
  const who = t.holder;

  t.status = cond === 'Needs repair' ? 'maint' : 'in';
  t.cond = cond;
  t.holder = '';
  t.outAt = null;
  t.dueAt = null;
  if (note) t.notes = note;

  logIt('checkin',
    `Checked in ${t.name} (${t.code}) from ${who}${late} — condition ${cond}${note ? ': ' + note : ''}`,
    t.site, { tool: t.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(cond === 'Needs repair' ? `${t.code} received and flagged for service` : `${t.code} back in store`, 'good');
}

/**
 * Send a tool for service, or bring it back
 */
function svcToggle(id) {
  const t = toolById(id);
  if (t.status === 'out') return toast('Check the tool in first', 'bad');

  t.status = t.status === 'maint' ? 'in' : 'maint';
  logIt('edit',
    `${t.name} (${t.code}) ${t.status === 'maint' ? 'sent for service' : 'returned to service'}`,
    t.site);

  saveState();
  buildNav();
  render();
  toast(t.status === 'maint' ? 'Flagged for service' : 'Back in service', 'good');
}

/**
 * Calibration list, soonest due first
 */
function calList() {
  const q = VIEW.q.toLowerCase();

  const L = S.tools
    .filter((t) => inSite(t) && t.calInt > 0)
    .filter((t) => VIEW.tab === 'all' || calState(t) === VIEW.tab)
    .filter((t) => !q || (t.name + ' ' + t.code + ' ' + t.cert).toLowerCase().includes(q))
    .sort((a, b) => new Date(a.calNext) - new Date(b.calNext));

  if (!L.length) return empty('◎', 'Nothing here', 'No instruments in this status.');

  const countdown = (t) => {
    const d = daysTo(t.calNext);
    if (d < 0) return `<b style="color:var(--out)">${Math.abs(d)} days overdue</b>`;
    if (d <= 30) return `<b style="color:var(--low)">in ${d} days</b>`;
    return `<span style="color:var(--ink2)">in ${d} days</span>`;
  };

  const act = (t) => can('cal')
    ? `<button class="btn sm pri" onclick="calModal('${t.id}')">Record calibration</button>`
    : '';

  return `
    <table class="tbl">
      <thead>
        <tr>
          <th>Instrument</th><th>Site</th><th>Certificate</th><th>Interval</th>
          <th>Last</th><th>Next due</th><th>Countdown</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${L.map((t) => `
          <tr>
            <td>
              <div class="pname">${esc(t.name)}</div>
              <div class="psku">${esc(t.code)}</div>
            </td>
            <td class="mono" style="font-size:12px">${esc(t.site)}</td>
            <td class="mono" style="font-size:12px">${esc(t.cert || '—')}</td>
            <td class="mono" style="font-size:12px">${t.calInt} mo</td>
            <td class="mono" style="font-size:12px">${fmtD(t.calLast)}</td>
            <td class="mono" style="font-size:12px"><b>${fmtD(t.calNext)}</b></td>
            <td style="font-size:12.5px">${countdown(t)}</td>
            <td>${calPill(calState(t))}</td>
            <td style="text-align:right">${act(t)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>

    <div class="rows">
      ${L.map((t) => `
        <div class="row">
          <div class="row-m">
            <div style="display:flex;gap:8px;align-items:flex-start">
              <div style="flex:1;min-width:0">
                <div class="pname">${esc(t.name)}</div>
                <div class="psku">${esc(t.code)} · ${esc(t.site)} · cert ${esc(t.cert || '—')}</div>
              </div>
              ${calPill(calState(t))}
            </div>
            <div style="margin-top:7px;font-size:12.5px">
              Next due <b class="mono">${fmtD(t.calNext)}</b> — ${countdown(t)}
            </div>
            <div style="font-size:12px;color:var(--ink3);margin-top:2px">
              Every ${t.calInt} months · last ${fmtD(t.calLast)}
            </div>
            ${act(t) ? `<div class="row-x">${act(t)}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

/**
 * Record a calibration certificate
 */
function calModal(id) {
  if (!can('cal')) return toast('Your role cannot record calibration', 'bad');

  const t = toolById(id);

  openModal('Record calibration', `${t.name} · ${t.code}`, `
    <div class="fld">
      <label>Date calibrated</label>
      <input id="clDate" type="date" value="${iso(today())}" onchange="clSync()">
    </div>
    <div class="fld">
      <label>Certificate number</label>
      <input id="clCert" class="mono" value="${esc(t.cert)}" placeholder="CAL-0000">
    </div>
    <div class="f2">
      <div class="fld">
        <label>Interval (months)</label>
        <input id="clInt" type="number" value="${t.calInt}" onchange="clSync()">
      </div>
      <div class="fld">
        <label>Next due</label>
        <input id="clNext" type="date" readonly>
      </div>
    </div>
    <div class="fld">
      <label>Result</label>
      <div class="pick">
        ${['Pass', 'Pass with adjustment', 'Fail'].map((c, i) =>
          `<button type="button" class="${i === 0 ? 'on' : ''}" data-res="${c}" onclick="pickOne(this)">${c}</button>`
        ).join('')}
      </div>
    </div>
    <div class="fld">
      <label>Lab / provider</label>
      <input id="clLab" placeholder="e.g. NMC Cambodia">
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="doCal('${id}')">Save certificate</button>
  `);

  clSync();
}

/**
 * Recalculate the next-due date from the date and interval
 */
function clSync() {
  const d = $('#clDate').value;
  const i = Number($('#clInt').value) || 0;
  $('#clNext').value = d && i ? addD(i * 30, d) : '';
}

/**
 * Commit a calibration record - a failure sends the tool for service
 */
function doCal(id) {
  const t = toolById(id);
  const d = $('#clDate').value;
  const i = Number($('#clInt').value) || 0;
  const cert = $('#clCert').value.trim();
  const picked = $('#modal .pick button.on');
  const res = picked ? picked.dataset.res : 'Pass';
  const lab = $('#clLab').value.trim();

  if (!d) return toast('Set the calibration date', 'bad');

  t.calLast = d;
  t.calInt = i;
  t.calNext = i ? addD(i * 30, d) : null;
  t.cert = cert;
  if (res === 'Fail') t.status = 'maint';

  logIt('cal',
    `Calibration ${res.toLowerCase()} for ${t.name} (${t.code})` +
    `${cert ? ' cert ' + cert : ''}${lab ? ' at ' + lab : ''}` +
    `${t.calNext ? ', next due ' + fmtD(t.calNext) : ''}`,
    t.site, { tool: t.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(res === 'Fail' ? 'Recorded as failed — tool flagged for service' : 'Calibration recorded', 'good');
}

/**
 * Warranty list, expired first then soonest to expire
 */
function warList() {
  const q = VIEW.q.toLowerCase();

  const L = warItems()
    .filter((x) => VIEW.tab === 'all' || x.st === VIEW.tab)
    .filter((x) => VIEW.cat === 'all' || x.kind === VIEW.cat)
    .filter((x) => !q || (x.name + ' ' + x.code + ' ' + (x.o.sup || '')).toLowerCase().includes(q))
    .sort((a, b) => {
      const r = { exp: 0, soon: 1, ok: 2, none: 3 };
      return r[a.st] - r[b.st] || (a.until && b.until ? new Date(a.until) - new Date(b.until) : 0);
    });

  if (!L.length) return empty('▣', 'Nothing here', 'No items in this warranty status.');

  const countdown = (x) => {
    if (!x.until) return '<span style="color:var(--ink3)">—</span>';
    const d = daysTo(x.until);
    if (d < 0) return `<b style="color:var(--out)">${Math.abs(d)} days ago</b>`;
    if (d <= 60) return `<b style="color:var(--low)">in ${d} days</b>`;
    return `<span style="color:var(--ink2)">in ${Math.round(d / 30)} months</span>`;
  };

  const act = (x) => can('edit')
    ? `<button class="btn sm" onclick="${x.kind === 'part' ? `partModal('${x.o.id}')` : `toolModal('${x.o.id}')`}">Edit</button>`
    : '';

  return `
    <table class="tbl">
      <thead>
        <tr>
          <th>Item</th><th>Type</th><th>Site</th><th>Supplier</th>
          <th>Term</th><th>Started</th><th>Expires</th><th>Countdown</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${L.map((x) => `
          <tr>
            <td>
              <div class="pname">${esc(x.name)}</div>
              <div class="psku">${esc(x.code)} · ${esc(x.sub)}</div>
            </td>
            <td><span class="pill ${x.kind === 'part' ? 'br' : 'mute'}">${x.kind}</span></td>
            <td class="mono" style="font-size:12px">${esc(x.o.site)}</td>
            <td style="color:var(--ink2)">${esc(x.o.sup || '—')}</td>
            <td class="mono" style="font-size:12px">${x.o.war ? x.o.war + ' mo' : '—'}</td>
            <td class="mono" style="font-size:12px">${fmtD(x.o.warFrom)}</td>
            <td class="mono" style="font-size:12px"><b>${x.until ? fmtD(x.until) : '—'}</b></td>
            <td style="font-size:12.5px">${countdown(x)}</td>
            <td>${warPill(x.st)}</td>
            <td style="text-align:right">${act(x)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>

    <div class="rows">
      ${L.map((x) => `
        <div class="row">
          <div class="row-m">
            <div style="display:flex;gap:8px;align-items:flex-start">
              <div style="flex:1;min-width:0">
                <div class="pname">${esc(x.name)}</div>
                <div class="psku">${esc(x.code)} · ${esc(x.o.site)} · ${esc(x.o.sup || x.sub)}</div>
              </div>
              ${warPill(x.st)}
            </div>
            ${x.until
              ? `<div style="margin-top:7px;font-size:12.5px">
                   Expires <b class="mono">${fmtD(x.until)}</b> — ${countdown(x)}
                 </div>
                 <div style="font-size:12px;color:var(--ink3);margin-top:2px">
                   ${x.o.war} month term from ${fmtD(x.o.warFrom)}
                 </div>`
              : '<div style="margin-top:7px;font-size:12.5px;color:var(--ink3)">No supplier warranty recorded</div>'}
            ${act(x) ? `<div class="row-x">${act(x)}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

              <div class="card-s">Below minimum and not on any open order</div>

    <div class="tabs">
      ${tabs.map(([k, l]) =>

/**
 * One reorder suggestion row
 */
function sugRow(p) {
  const need = reorderQty(p);

  return `
    <div class="al">
      <div class="al-i ${stockState(p) === 'out' ? 'out' : 'low'}">▤</div>

/**
 * All reorder suggestions in one sheet
 */
function sugModal() {
  const sug = sugList();
  const tot = sug.reduce((a, p) => a + reorderQty(p) * p.cost, 0);

  openModal('Reorder suggestions', `${sug.length} parts below minimum with no order raised`,
    `<div style="margin:-16px">${sug.map(sugRow).join('') || empty('✓', 'Nothing to reorder', '')}</div>`,
    `<button class="btn" onclick="closeModal()">Close</button>
     ${sug.length && can('po')
       ? `<button class="btn pri" onclick="poModal(null,'auto')">Raise order · ${money(tot).replace('.00', '')}</button>`
       : ''}`);
}

/**
 * Purchase order list, newest first
 */
function poList() {
  const q = VIEW.q.toLowerCase();

  const L = S.pos
    .filter(inSite)
    .filter((o) => VIEW.tab === 'all' || o.status === VIEW.tab)
    .filter((o) => !q || (o.no + ' ' + o.sup).toLowerCase().includes(q))
    .sort((a, b) => b.created - a.created);

  if (!L.length) {
    return empty('⇄', 'No orders here', 'Raise one from a reorder suggestion or the New order button.');
  }

  const act = (o) => `<button class="btn sm" data-menu onclick="poMenu(event,'${o.id}')">Actions ▾</button>`;

  const eta = (o) => {
    if (o.status === 'received') return '<span style="color:var(--ok)">Received</span>';
    const d = daysTo(o.eta);
    return `<span style="color:${d < 0 ? 'var(--out)' : 'var(--ink)'}">${fmtD(o.eta)}${d < 0 ? ` (${Math.abs(d)}d late)` : ''}</span>`;
  };

  return `
    <table class="tbl">
      <thead>
        <tr>
          <th>Order</th><th>Supplier</th><th>Site</th><th class="num">Lines</th>
          <th class="num">Value</th><th>Expected</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${L.map((o) => `
          <tr>
            <td>
              <div class="pname mono">${esc(o.no)}</div>
              <div class="psku">raised ${fmtDT(o.created)}</div>
            </td>
            <td>${esc(o.sup)}</td>
            <td class="mono" style="font-size:12px">${esc(o.site)}</td>
            <td class="num">${o.lines.length}</td>
            <td class="num"><b>${money(poTotal(o))}</b></td>
            <td class="mono" style="font-size:12px">${eta(o)}</td>
            <td>${poPill(o.status)}</td>
            <td style="text-align:right">${act(o)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>

    <div class="rows">
      ${L.map((o) => `
        <div class="row">
          <div class="row-m">
            <div style="display:flex;gap:8px;align-items:flex-start">
              <div style="flex:1;min-width:0">
                <div class="pname mono">${esc(o.no)}</div>
                <div class="psku">${esc(o.sup)} · ${esc(o.site)} · ${o.lines.length} line${o.lines.length > 1 ? 's' : ''}</div>
              </div>
              ${poPill(o.status)}
            </div>
            <div style="margin-top:7px;font-size:12.5px">

/**

/* ---------- order editor ---------- */

// Lines being edited, flushed to the order on save
let poDraft = [];

/**
 * Raise or edit an order
 * @param {string} [id] - Existing order to edit
 * @param {string} [seedPart] - A part id to start from, or 'auto' for every suggestion
 */
function poModal(id, seedPart) {
  if (!can('po')) return toast('Your role cannot raise orders', 'bad');

  const o = id ? poById(id) : null;

  if (o) {
    poDraft = o.lines.map((l) => ({ ...l }));
  } else if (seedPart === 'auto') {
    poDraft = sugList().map((p) => ({ part: p.id, qty: reorderQty(p), cost: p.cost }));
  } else if (seedPart) {
    const p = partById(seedPart);
    poDraft = [{ part: p.id, qty: reorderQty(p), cost: p.cost }];
  } else {
    poDraft = [];
  }

  const sup = o ? o.sup : (poDraft[0] ? partById(poDraft[0].part).sup : '');
  const site = o ? o.site : (VIEW.site === 'all' ? S.sites[0].id : VIEW.site);
  const lead = poDraft.length
    ? Math.max(...poDraft.map((l) => (partById(l.part) || {}).lt || 14))
    : 14;

  openModal(o ? 'Edit order' : 'New purchase order', o ? o.no : 'Raise a supply request', `
    <div class="f2">
      <div class="fld"><label>Supplier</label><input id="poSup" value="${esc(sup)}" placeholder="Supplier name"></div>
      <div class="fld">
        <label>Deliver to</label>
        <select id="poSite">
          ${S.sites.map((s) => `<option value="${s.id}" ${site === s.id ? 'selected' : ''}>${esc(s.code)} — ${esc(s.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="fld">
      <label>Expected delivery</label>
      <input id="poEta" type="date" value="${o ? o.eta : addD(lead)}">
      <div class="hlp">Pre-filled from the longest supplier lead time on this order.</div>
    </div>
    <div class="fld">
      <label>Lines</label>
      <div id="poLines"></div>
      <select class="sel" id="poAdd" style="width:100%;margin-top:8px" onchange="poAddLine()">
        <option value="">＋ Add a part to this order…</option>${partOpts()}
      </select>
    </div>
    <div class="fld"><label>Notes</label><textarea id="poNotes">${o ? esc(o.notes) : ''}</textarea></div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="savePO('${id || ''}')">${o ? 'Save order' : 'Create order'}</button>
  `);

  poLines();
}

/**
 * Redraw the draft lines and running total
 */
function poLines() {
  const h = $('#poLines');
  if (!h) return;

  if (!poDraft.length) {
    h.innerHTML = `
      <div style="padding:14px;text-align:center;color:var(--ink3);font-size:12.5px;
        border:1px dashed var(--line2);border-radius:9px">No lines yet — add a part below.</div>
    `;
    return;
  }

  h.innerHTML = poDraft.map((l, i) => {
    const p = partById(l.part);
    if (!p) return '';

    return `
      <div style="display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:13px">${esc(p.name)}</div>
          <div class="psku">${esc(p.sku)} · on hand ${p.qty}/${p.min} · ${money(l.cost)} each</div>
        </div>
        <input type="number" value="${l.qty}" min="1" style="width:64px;padding:7px;border:1px solid var(--line);
          border-radius:7px;text-align:center;font-family:var(--mono)" oninput="poQty(${i},this.value)">
        <button class="btn sm" onclick="poDel(${i})">✕</button>
      </div>
    `;
  }).join('') + `
    <div style="display:flex;justify-content:space-between;padding-top:10px;font-size:14px">
      <b>Order total</b>
      <b class="mono">${money(poDraft.reduce((a, l) => a + l.qty * l.cost, 0))}</b>
    </div>
  `;
}

/**
 * Add the part chosen in the picker to the draft
 */
function poAddLine() {
  const id = $('#poAdd').value;
  if (!id) return;
  $('#poAdd').value = '';

  if (poDraft.some((l) => l.part === id)) return toast('Already on this order', 'bad');

  const p = partById(id);
  poDraft.push({ part: id, qty: reorderQty(p), cost: p.cost });

  // First line sets the supplier if one has not been typed
  if (!$('#poSup').value) $('#poSup').value = p.sup;

  poLines();
}

/**
 * Change a draft line quantity
 */
function poQty(i, v) {
  poDraft[i].qty = Math.max(1, parseInt(v) || 1);
  poLines();
}

/**
 * Remove a draft line
 */
function poDel(i) {
  poDraft.splice(i, 1);
  poLines();
}

/**
 * Save the order editor
 */
function savePO(id) {
  const sup = $('#poSup').value.trim();
  const site = $('#poSite').value;
  const eta = $('#poEta').value;
  const notes = $('#poNotes').value.trim();

  if (!sup) return toast('Supplier is required', 'bad');
  if (!poDraft.length) return toast('Add at least one line', 'bad');

  if (id) {
    const o = poById(id);
    Object.assign(o, { sup, site, eta, notes, lines: poDraft.map((l) => ({ ...l })) });
    logIt('po',
      `Updated ${o.no} — ${o.lines.length} line${o.lines.length > 1 ? 's' : ''}, ${money(poTotal(o))}`,
      site, { po: o.id });
  } else {
    S.cfg.poSeq = (S.cfg.poSeq || 0) + 1;

    const d = new Date();
    const no = 'PO-' + String(d.getFullYear()).slice(2) +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(S.cfg.poSeq).padStart(3, '0');

    const o = {
      id: uid('po'), no, sup, site, status: 'draft', created: Date.now(),
      eta, by: VIEW.user.u, notes, lines: poDraft.map((l) => ({ ...l }))
    };
    S.pos.unshift(o);

    logIt('po',
      `Created ${no} — ${sup}, ${o.lines.length} line${o.lines.length > 1 ? 's' : ''}, ${money(poTotal(o))}`,
      site, { po: o.id });
  }

  poDraft = [];
  saveState();
  closeModal();
  buildNav();
  render();
  toast(id ? 'Order saved' : 'Order created as draft', 'good');
}

/**
 * Move an order to its next status - receiving books the stock in
 */
function poAdvance(id, to) {
  const o = poById(id);

  if (to === 'ordered' && !can('poApprove')) return toast('A manager must approve draft orders', 'bad');

  if (to === 'received') {
    let n = 0;

    o.lines.forEach((l) => {
      const p = partById(l.part);
      if (!p) return;

      p.qty += l.qty;
      p.updated = Date.now();
      n += l.qty;
      if (p.war) p.warFrom = iso(today());   // delivered batch restarts the warranty

      logIt('receive', `Received ${l.qty} × ${p.name} on ${o.no}`, p.site, {
        part: p.id,
        qty: l.qty,
        value: +(l.qty * l.cost).toFixed(2)
      });
    });

    o.status = 'received';
    logIt('po', `${o.no} received — ${n} items booked into ${o.site} store`, o.site, { po: o.id });

    saveState();
    closeModal();
    buildNav();
    render();
    return toast(`${o.no} received — ${n} items added to stock`, 'good');
  }

  o.status = to;
  logIt('po', `${o.no} marked as ${to === 'shipped' ? 'in transit' : to}`, o.site, { po: o.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast(`${o.no} → ${to === 'shipped' ? 'in transit' : to}`, 'good');
}

/**
 * Confirm cancelling an order
 */
function poCancel(id) {
  const o = poById(id);

  openModal('Cancel order', o.no, `
    <p style="font-size:13.5px;margin:0">
      Cancel <b>${esc(o.no)}</b> to ${esc(o.sup)}? Stock will not be booked in and the order closes.
    </p>
  `, `
    <button class="btn" onclick="closeModal()">Keep order</button>
    <button class="btn dgr" onclick="doPoCancel('${id}')">Cancel order</button>
  `);
}

/**
 * Cancel an order
 */
function doPoCancel(id) {
  const o = poById(id);
  o.status = 'cancelled';

  logIt('po', `Cancelled ${o.no} (${o.sup})`, o.site, { po: o.id });

  saveState();
  closeModal();
  buildNav();
  render();
  toast('Order cancelled', 'good');
}

/**
 * Download the activity currently on screen, filters and all
 */
async function expLogCSV() {
  if (!can('export')) return toast('Manager access required', 'bad');

  const L = filterLog();
  if (!L.length) return toast('Nothing to download', 'bad');

  const head = ['When', 'Type', 'By', 'Site', 'Detail', 'Part', 'Qty', 'Value'];
  const q = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;

  const rows = L.map((l) => {
    const p = l.part ? partById(l.part) : null;
    return [
      new Date(l.ts).toISOString(), l.type, l.by, l.site || '', l.txt,
      p ? p.sku : '', l.qty == null ? '' : l.qty, l.value == null ? '' : l.value
    ].map(q).join(',');
  });

  const ok = await dl(`voltgrid-activity-${iso(today())}.csv`, [head.join(','), ...rows].join('\n'), 'text/csv');
  if (ok) {
    logIt('export', `Downloaded activity log (${L.length} entries)`, VIEW.site);
    saveState();
    toast(`Activity log downloaded — ${L.length} entries`, 'good');
  }
}

/**
 * Activity entries matching the current site, filter and search, newest first
 */
function filterLog() {
  const q = VIEW.q.toLowerCase();

  // Tool movements cover both directions
  const grp = { checkout: ['checkout', 'checkin'] };

  return S.log
    .filter((l) => VIEW.site === 'all' || l.site === VIEW.site)
    .filter((l) => VIEW.tab === 'all' || l.type === VIEW.tab || (grp[VIEW.tab] || []).includes(l.type))
    .filter((l) => !q || (l.txt + ' ' + l.by).toLowerCase().includes(q));
}

/**
 * Rendered activity list
 */
function logList() {
  if (!canSee('log')) return empty('🔒', 'Manager access required', '');

  const L = filterLog();

  if (!L.length) return empty('≡', 'No matching activity', '');

  const ic = {
    issue: '↑', receive: '↓', adjust: '≠', checkout: '⚒', checkin: '↩',
    po: '⇄', cal: '◎', edit: '✎', add: '＋', del: '✕'
  };

  const tone = {
    issue: 'low', receive: 'br', adjust: 'low', checkout: 'ord',
    checkin: 'br', po: 'ord', cal: 'br', del: 'out'
  };

  return L.slice(0, 200).map((l) => `
    <div class="al">
      <div class="al-i ${tone[l.type] || 'br'}">${ic[l.type] || '•'}</div>
      <div style="min-width:0">
        <div class="al-t" style="font-weight:500">${esc(l.txt)}</div>
        <div class="al-s">${esc(l.by)} · ${esc(l.site || '—')} · ${fmtDT(l.ts)}</div>
      </div>
      <div class="al-r" style="color:var(--ink3)">${ago(l.ts)}</div>
    </div>
  `).join('');
}

/**

 */
function siteModal(id) {
  if (!can('admin')) return toast('Manager access required', 'bad');

  const s = id ? S.sites.find((x) => x.id === id) : { id: '', name: '', code: '' };

  openModal(id ? 'Edit site' : 'Add site', id ? s.id : 'New location', `
    <div class="fld">
      <label>Site name</label>
      <input id="sfName" value="${esc(s.name)}" placeholder="Bavet BESS 20MW">
    </div>
    <div class="fld">
      <label>Short code</label>
      <input id="sfCode" class="mono" value="${esc(s.code)}" maxlength="6" placeholder="BVT" ${id ? 'disabled' : ''}>
      <div class="hlp">Used on labels and bin references. Cannot change later.</div>
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    ${id && S.sites.length > 1 ? `<button class="btn dgr" onclick="doDelSite('${id}')">Delete</button>` : ''}
    <button class="btn pri" onclick="saveSite('${id || ''}')">Save site</button>
  `);
}

/**
 * Save the site editor
 */
function saveSite(id) {
  const name = $('#sfName').value.trim();
  const code = $('#sfCode').value.trim().toUpperCase();

  if (!name) return toast('Site name is required', 'bad');

  if (id) {
    S.sites.find((x) => x.id === id).name = name;
  } else {
    if (!code) return toast('Short code is required', 'bad');
    if (S.sites.some((x) => x.id === code)) return toast('That code is already used', 'bad');
    S.sites.push({ id: code, name, code });
  }

  saveState();
  closeModal();
  buildSites();
  render();
  toast('Site saved', 'good');
}

/**
 * Delete an empty site
 */
function doDelSite(id) {
  if (S.parts.some((p) => p.site === id) || S.tools.some((t) => t.site === id)) {
    return toast('Move its parts and tools out first', 'bad');
  }

  S.sites = S.sites.filter((x) => x.id !== id);
  if (VIEW.site === id) VIEW.site = 'all';

  saveState();
  closeModal();
  buildSites();
  render();
  toast('Site deleted', 'good');
}

/**
 * Working copy of the permissions being edited, so toggles can be cancelled.
 */
let PERM_DRAFT = null;
let SITE_DRAFT = [];

/**
 * The permission matrix: one row per module, one column per core action.
 */
function permMatrixHtml() {
  return `
    <table class="permtbl">
      <thead>
        <tr>
          <th class="mod">Module</th>
          ${CORE_ACTS.map((a) => `<th>${esc(ACT_LABEL[a])}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${MODULES.map((m) => `
          <tr class="${PERM_DRAFT[m.id].view ? '' : 'off'}">
            <td class="mod"><b>${esc(m.t)}</b></td>
            ${CORE_ACTS.map((a) => {
              if (!m.acts.includes(a)) return '<td class="na">—</td>';
              const on = PERM_DRAFT[m.id][a] ? 'checked' : '';
              const dim = a !== 'view' && !PERM_DRAFT[m.id].view ? 'disabled' : '';
              return `<td><input type="checkbox" ${on} ${dim}
                onchange="permSet('${m.id}','${a}',this.checked)"></td>`;
            }).join('')}
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

/**
 * Module-specific operations that do not fit the matrix columns.
 */
function permOpsHtml() {
  return `
    <div class="permops">
      ${MODULES.map((m) => {
        const extra = m.acts.filter((a) => !CORE_ACTS.includes(a));
        if (!extra.length) return '';
        return `
          <div class="grp">${esc(m.t)}</div>
          ${extra.map((a) => `
            <label>
              <input type="checkbox" ${PERM_DRAFT[m.id][a] ? 'checked' : ''}
                ${PERM_DRAFT[m.id].view ? '' : 'disabled'}
                onchange="permSet('${m.id}','${a}',this.checked)">
              ${esc(ACT_LABEL[a] || a)}
            </label>
          `).join('')}
        `;
      }).join('')}
    </div>
  `;
}

/**
 * Flip one permission in the draft and repaint the matrix.
 * Turning a module off clears everything under it; granting any action
 * implies being able to open the module.
 */
function permSet(mod, act, on) {
  PERM_DRAFT[mod][act] = on ? 1 : 0;

  if (act === 'view' && !on) {
    Object.keys(PERM_DRAFT[mod]).forEach((k) => (PERM_DRAFT[mod][k] = 0));
  }
  if (act !== 'view' && on) PERM_DRAFT[mod].view = 1;

  const host = $('#permHost');
  if (host) host.innerHTML = permMatrixHtml();

  const ops = $('#permOps');
  if (ops) ops.innerHTML = permOpsHtml();
}

/**
 * Enable all / disable all / reset to the role template
 */
function permBulk(mode) {
  const role = $('#ufRole') ? $('#ufRole').value : 'guest';
  const tpl = ROLES[role] || ROLES.guest;

  PERM_DRAFT = mode === 'all' ? allPerms()
    : mode === 'none' ? noPerms()
    : JSON.parse(JSON.stringify(tpl.perms));

  permSet('home', 'view', !!PERM_DRAFT.home.view);

  toast(mode === 'all' ? 'Everything enabled'
    : mode === 'none' ? 'Everything disabled'
    : `Reset to the ${tpl.label} default`);
}

/**
 * Tick or clear one warehouse in the draft
 */
function siteSet(id, on) {
  SITE_DRAFT = on ? [...new Set([...SITE_DRAFT, id])] : SITE_DRAFT.filter((x) => x !== id);

  const host = $('#siteHost');
  if (host) host.innerHTML = sitePickHtml();

/**

function siteSetAll(on) {

/**
 * What changed between two permission sets, so the activity log records the
 * actual grants and revokes rather than just "permissions updated".
 */
function permDiff(before, after) {
  const on = [];
  const off = [];

  MODULES.forEach((m) => {
    m.acts.forEach((a) => {
      const b = before[m.id] ? before[m.id][a] : 0;
      const c = after[m.id] ? after[m.id][a] : 0;
      if (b === c) return;
      (c ? on : off).push(`${m.t} → ${ACT_LABEL[a] || a}`);
    });
  });

  return { on, off };
}

/**
 * Save the account editor
 */
function saveUser(u) {
  if (!canDo('admin', 'accounts')) return toast('Manager access required', 'bad');

  const name = $('#ufName').value.trim();
  const user = $('#ufUser').value.trim().toLowerCase();
  const p = $('#ufPass').value;
  const role = $('#ufRole').value;
  const active = $('#ufActive') && $('#ufActive').value === '0' ? 0 : 1;
  const self = !!u && u === VIEW.user.u;

  if (!name || !p) return toast('Name and password are required', 'bad');

  const perms = canDo('admin', 'perms') ? JSON.parse(JSON.stringify(PERM_DRAFT)) : null;

  // Never let the signed-in manager revoke their own way back into Settings
  if (perms && self) {
    perms.admin.view = 1;
    perms.admin.accounts = 1;
    perms.admin.perms = 1;
  }

  const sites = SITE_DRAFT.slice();
  const siteLabel = sites.length ? sites.join(', ') : 'all warehouses';

  if (u) {
    const acc = S.users.find((x) => x.u === u);
    const before = permsFor(acc);

    Object.assign(acc, {
      name, p, role, active, sites,
      site: sites.length === 1 ? sites[0] : 'all'
    });
    if (perms) acc.perms = perms;

    const d = perms ? permDiff(before, perms) : { on: [], off: [] };
    logIt('perm',
      `Updated account ${name} (${u}) — ${siteLabel}` +
      (d.on.length ? `; enabled ${d.on.join(', ')}` : '') +
      (d.off.length ? `; disabled ${d.off.join(', ')}` : ''),
      'all', { target: u });
  } else {
    if (!user) return toast('Username is required', 'bad');
    if (S.users.some((x) => x.u === user)) return toast('That username already exists', 'bad');

    const acc = {
      u: user, p, name, role, active, sites,
      site: sites.length === 1 ? sites[0] : 'all'
    };
    if (perms) acc.perms = perms;
    S.users.push(acc);

    logIt('perm', `Created account ${name} (${user}) as ${ROLES[role].label} — ${siteLabel}`,
      'all', { target: user });
  }

  // The signed-in account may have just changed its own reach
  if (self) VIEW.user = S.users.find((x) => x.u === u);

  saveState();
  closeModal();
  buildSites();
  buildNav();
  render();
  toast('Account saved', 'good');
}

/**
 * Add a list of people from a JSON file, without touching stock or history.
 *
 * Accepts either a bare array or { "users": [...] }. Each entry needs at least
 * a username, a password and a name; position, ID card, role and site are
 * optional. Existing usernames are left exactly as they are, so importing the
 * same list twice is safe.
 */
function impUsers(inp) {
  if (!can('admin')) return toast('Manager access required', 'bad');

  const f = inp.files[0];
  if (!f) return;

  const r = new FileReader();

  r.onload = (e) => {
    inp.value = '';

    let list;
    try {
      const d = JSON.parse(e.target.result);
      list = Array.isArray(d) ? d : d.users;
      if (!Array.isArray(list)) throw new Error('no users array');
    } catch (err) {
      return toast('That file is not an account list', 'bad');
    }

    const added = [];
    const skipped = [];
    const rejected = [];

    list.forEach((a) => {
      const u = String(a.u || '').trim().toLowerCase();

      if (!u || !a.p || !a.name) return rejected.push(u || '(no username)');
      if (!ROLES[a.role]) return rejected.push(u + ' (unknown role)');
      if (String(a.p).length < 6) return rejected.push(u + ' (password too short)');
      if (S.users.some((x) => x.u === u)) return skipped.push(u);

      S.users.push({
        u,
        p: String(a.p),
        name: String(a.name),
        position: a.position ? String(a.position) : '',
        idCard: a.idCard ? String(a.idCard) : '',
        role: a.role,
        site: a.site && a.site !== 'all' && S.sites.some((s) => s.id === a.site) ? a.site : 'all'
      });
      added.push(u);
    });

    if (!added.length && !skipped.length) {
      return toast('Nothing in that file could be imported', 'bad');
    }

    if (added.length) {
      logIt('add', `Imported ${added.length} account${added.length === 1 ? '' : 's'}: ${added.join(', ')}`, 'all');
      saveState();
    }

    render();

    const parts = [`${added.length} added`];
    if (skipped.length) parts.push(`${skipped.length} already here`);
    if (rejected.length) parts.push(`${rejected.length} rejected`);
    toast(parts.join(' · '), added.length ? 'good' : null);
  };

  r.readAsText(f);
}

/**
 * Delete an account
 */
function doDelUser(u) {
  S.users = S.users.filter((x) => x.u !== u);

/**
 * Hand a generated file to the user.
 *
 * Opened as a normal page the browser downloads it directly. Opened inside a
 * viewer that sandboxes downloads, the host save surface takes it instead.
 *
 * @returns {Promise<boolean>} true once the file has been handed over
 */
async function dl(name, text, type) {
  const host = window.claude && typeof window.claude.use === 'function'
    ? await window.claude.use('downloads')
    : null;

  if (host) {
    try {
      await host.save({ filename: name, data: text });
      return true;
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') return false;
      if (code === 'extension_not_enabled') {
        toast('This viewer cannot save that file type — export the JSON backup instead', 'bad');
        return false;
      }
      if (code === 'too_large') {
        toast('That export is too large to save here', 'bad');
        return false;
      }
      toast('Could not save the file', 'bad');
      return false;
    }
  }

  const b = new Blob([text], { type: type || 'application/json' });
  const a = document.createElement('a');

  a.href = URL.createObjectURL(b);
  a.download = name;
  a.click();

  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  return true;
}

/* ---------- Google Sheets sync ---------- */

/**
 * Update the sync indicator in the sidebar footer
 */
function setSync(t, colour) {
  const dot = $('#syncDot');
  if (!dot) return;

  dot.textContent = t;
  dot.style.color = colour || '';
}

/**
 * Push the local store up to the Apps Script endpoint
 */
async function syncPush() {
  if (!S.cfg.sheetUrl) return toast('Add the Apps Script URL first', 'bad');

  setSync('● syncing…', '#C2740D');
  toast('Pushing to Google Sheets…');

  try {
    await fetch(S.cfg.sheetUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'push',
        payload: {
          parts: S.parts,
          tools: S.tools,
          pos: S.pos,
          sites: S.sites,
          log: S.log.slice(0, 200)
        }
      })
    });

    S.cfg.lastSync = Date.now();
    saveState();
    setSync('● synced ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }), '#8FE3C8');
    toast('Pushed to Google Sheets', 'good');
  } catch (e) {
    setSync('● sync failed', '#FF9A92');
    toast('Could not reach the Sheets endpoint', 'bad');
  }
}

/**
 * Read the sheet and replace the local store with what it holds.
 *
 * Data only — no UI work — so this is safe to call before anyone has signed
 * in. Accounts are never touched: they live on the device, not in the sheet.
 *
 * @returns {Promise<Object>} counts of what came back
 * @throws if the endpoint is unreachable or answers with something unusable
 */
async function pullData() {
  // Give up rather than hang: an unreachable or sign-in-walled URL would
  // otherwise leave the request open indefinitely.
  const stop = new AbortController();
  const timer = setTimeout(() => stop.abort(), 15000);

  let d;
  try {
    const r = await fetch(S.cfg.sheetUrl + '?action=pull', { signal: stop.signal });
    d = await r.json();
  } finally {
    clearTimeout(timer);
  }

  // A sheet with no Parts tab is almost always a wrong URL or a failed deploy,
  // and overwriting good local data with it would be destructive.
  if (!d || !Array.isArray(d.parts) || !d.parts.length) {
    throw new Error('the sheet returned no parts');
  }

  S.parts = d.parts;
  if (Array.isArray(d.tools)) S.tools = d.tools;
  if (Array.isArray(d.pos)) S.pos = d.pos;
  if (Array.isArray(d.sites) && d.sites.length) S.sites = d.sites;
  if (Array.isArray(d.log)) S.log = d.log;

  S.cfg.lastSync = Date.now();
  await saveState();

  return {
    parts: S.parts.length,
    tools: S.tools.length,
    pos: S.pos.length,
    sites: S.sites.length,
    log: S.log.length
  };
}

/**
 * Pull the store back down from the Apps Script endpoint, and redraw
 */
async function syncPull() {
  if (!S.cfg.sheetUrl) return toast('Add the Apps Script URL first', 'bad');

  setSync('● syncing…', '#C2740D');

  try {
    const n = await pullData();

    // Only touch the UI if someone is actually looking at it
    if (VIEW.user) {
      buildSites();
      buildNav();
      render();
    }

    setSync('● synced ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }), '#8FE3C8');
    toast(`Pulled ${n.parts} parts, ${n.tools} tools, ${n.pos} orders`, 'good');
  } catch (e) {
    setSync('● sync failed', '#FF9A92');
    toast('Could not read from the Sheets endpoint', 'bad');
  }
}

/* ===== js/app.js ===== */
/**
 * js/app.js - Main application orchestrator
 */

// Global app state initialized
let APP_READY = false;

// Page renderers, keyed by page id
const PAGES = {
  home: renderHome,
  parts: renderParts,
  tools: renderTools,
  cal: renderCalibration,
  war: renderWarranty,
  po: renderPO,
  log: renderLog,
  admin: renderAdmin
};

// List renderers, for repainting a page body without a full rebuild
const PAGE_LISTS = {
  parts: partsList,
  tools: toolsList,
  cal: calList,
  war: warList,
  po: poList,
  log: logList
};

/**
 * Main render function - delegates to page-specific renderers
 */
function render() {
  if (!VIEW.user) return;

  // Fall back to the first page this account can open
  if (!canSee(VIEW.page)) VIEW.page = landingPage();

  // Every module revoked: say so plainly instead of rendering a blank shell
  if (!VIEW.page) {
    $('#pgTitle').textContent = 'No access';
    $('#pgSite').textContent = '';
    $('#page').innerHTML = empty('🔒', 'No modules enabled',
      'This account has no modules turned on. A manager can grant access in Settings → Accounts.');
    buildNav();
    $('#alertDot').classList.add('hide');
    return;
  }

  $('#pgTitle').textContent = pageTitle(VIEW.page);
  buildSites();

  const renderFn = PAGES[VIEW.page];
  if (renderFn) {
    renderFn();
  } else {
    $('#page').innerHTML = empty('🔒', 'Access denied', 'You do not have permission to view this page');
  }

  bind();
  $('#alertDot').classList.toggle('hide', !alertCount());
}

/**
 * Wire up the search box, filters, tabs and shortcut links on the current page
 */
function bind() {
  $$('[data-go]').forEach((el) => {
    el.onclick = () => go(el.dataset.go);
  });

  const q = $('#q');
  if (q) {
    q.oninput = (e) => {
      VIEW.q = e.target.value;
      VIEW.sel = [];
      repaint();
    };
  }

  $$('[data-filter]').forEach((el) => {
    el.onchange = (e) => {
      VIEW[el.dataset.filter] = e.target.value;
      VIEW.sel = [];
      repaint();
    };
  });

  $$('[data-tab]').forEach((el) => {
    el.onclick = () => {
      VIEW.tab = el.dataset.tab;
      VIEW.sel = [];
      render();
    };
  });
}

/**
 * Repaint just the list on the current page, keeping the search box focused
 */
function repaint() {
  const host = $('#listHost');
  const listFn = PAGE_LISTS[VIEW.page];

  if (!host || !listFn) {
    render();
    return;
  }

  host.innerHTML = listFn();
}

/**
 * Apply branding
 */
function brand() {
  const c = S.cfg;
  const ini = (c.appName || 'SNT')
    .split(' ')
    .map((x) => x[0])
    .join('')
    .slice(0, 2)
    .toUpperCase();
  
  ['lk', 'rl'].forEach((k) => {
    const holder = $(`#${k}Logo`);
    if (c.logo) {
      holder.outerHTML = `<img id="${k}Logo" src="${c.logo}" alt="">`;
    } else {
      holder.outerHTML = `<div id="${k}Logo" class="${k === 'lk' ? 'lk-mark' : 'rail-mark'}">${esc(ini)}</div>`;
    }
  });
  
  $('#lkName').textContent = c.appName;
  $('#rlName').textContent = c.appName;
  document.title = c.appName + ' — Spare Parts & Tools';
}

/**
 * Setup clock on lock screen
 */
function tick() {
  const d = new Date();
  $('#lkTime').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  $('#lkDate').textContent = d.toLocaleDateString('en-GB', {
    weekday: 'long',
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  });
}

setInterval(tick, 1000);

/**
 * Initialize application
 */
async function initApp() {
  try {
    // Initialize storage
    await initStorage();
    
    // Load state or initialize with seed
    await loadState();
    
    // Load device photos before anything can render a thumbnail
    await loadPhotos();

    // Apply branding
    brand();
    tick();

    // Show where the data currently lives
    setSync(
      S.cfg.sheetUrl
        ? '● ' + (S.cfg.lastSync ? 'synced ' + ago(S.cfg.lastSync) : 'connected')
        : '● local only'
    );

    // Setup auth handlers
    initAuth();

    // Read the sheet only once signing in is possible, so a slow or
    // unreachable endpoint can never leave the login screen dead.
    if (S.cfg.autoSync && S.cfg.sheetUrl) {
      setSync('● reading sheet…', '#C2740D');
      pullData()
        .then((n) => {
          console.log(`✓ loaded from Google Sheets: ${n.parts} parts, ${n.tools} tools, ${n.pos} orders`);
          setSync('● synced ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }), '#8FE3C8');
          if (VIEW.user) {
            buildSites();
            buildNav();
            render();
          }
        })
        .catch((e) => {
          console.warn('Could not read the sheet, using the copy on this device:', e.message);
          setSync('● local only');
        });
    }

    // Resume the session left behind by the last visit. Refreshing the page
    // should never throw the user back to the lock screen — only an explicit
    // sign-out, which clears S.session, or a session past the ceiling does
    // that. "Remember me" lifts the ceiling so the sign-in also survives
    // closing the browser.
    const rememberMe = localStorage.getItem('voltgrid_rememberMe') === 'true';
    const resumable = S.session &&
      (rememberMe || Date.now() - S.session.at < SESSION_CONFIG.maxSessionDuration);

    if (resumable) {
      const user = S.users.find((u) => u.u === S.session.u && u.active !== 0);
      if (user) {
        logIt('auto_login', `Resumed session: ${user.name}`, 'all', { user: user.u });
        enter(user, rememberMe);
      }
    }
    
    APP_READY = true;
    console.log('✓ SPARE PARTS MANAGEMENT SYSTEM initialized');
  } catch (e) {
    console.error('Initialization error:', e);
    toast('Failed to initialize application', 'bad');
  }
}

// Escape closes whatever is open, menu first
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeMenu();
    closeModal();
  }
});

// Start app when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
