  <!-- CSS Modules -->
  <style>
/* ===== css/variables.css ===== */
/**
 * css/variables.css - CSS custom properties and design tokens
 */

:root {
  /* Colors - Backgrounds */
  --bg: #EDF1F6;
  --surface: #fff;
  --surface2: #F6F9FC;
  --surface3: #EEF3F9;
  
  /* Colors - Text */
  --ink: #0B1220;
  --ink2: #4A5A70;
  --ink3: #8695AA;
  
  /* Colors - Borders & Dividers */
  --line: #DEE6EF;
  --line2: #CBD6E3;
  
  /* Colors - Navigation Rail */
  --rail: #0D1626;
  --rail2: #16233A;
  --rail3: #233350;
  --railInk: #93A4BD;
  
  /* Colors - Status */
  --brand: #0F766E;
  --brand2: #14958B;
  --brandSoft: #E2F4F1;
  
  --ok: #12805C;
  --okSoft: #E3F5EC;
  
  --low: #A55A08;
  --lowSoft: #FDF0DC;
  
  --out: #B42318;
  --outSoft: #FCE9E7;
  
  --ord: #1D4ED8;
  --ordSoft: #E8EEFE;
  
  --mute: #64748B;
  --muteSoft: #EEF2F7;
  
  /* Fonts */
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  
  /* Spacing */
  --r: 10px;
  
  /* Effects */
  --sh: 0 1px 2px rgba(11, 18, 32, 0.06), 0 1px 3px rgba(11, 18, 32, 0.04);
  --shL: 0 10px 30px rgba(11, 18, 32, 0.14);
  
  /* Safe area insets (mobile) */
  --sat: env(safe-area-inset-top);
  --sab: env(safe-area-inset-bottom);
}

/* ===== css/base.css ===== */
/**
 * css/base.css - Base styles and resets
 */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
}

a {
  color: var(--brand);
  text-decoration: none;
}

.mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

.hide {
  display: none !important;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-thumb {
  background: var(--line2);
  border-radius: 4px;
}

/* Accessibility: respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

/* ===== css/layout.css ===== */
/**
 * css/layout.css - Layout, grid, flexbox, and responsive styles
 */

/* ============ LOCK SCREEN ============ */
#lock {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: radial-gradient(1200px 600px at 20% -10%, #1B3350 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 110%, #0F4F4A 0%, transparent 55%), #0A1220;
  display: flex;
  flex-direction: column;
  color: #fff;
  padding: calc(var(--sat) + 22px) 22px calc(var(--sab) + 22px);
}

#lock.gone {
  display: none;
}

.lk-top {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.lk-clock {
  font-family: var(--mono);
  font-size: 60px;
  font-weight: 200;
  letter-spacing: -2px;
  line-height: 1;
}

.lk-date {
  color: #8FA3BE;
  font-size: 13px;
  margin-top: 8px;
  letter-spacing: 0.5px;
}

.lk-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 34px;
}

.lk-brand img {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  object-fit: contain;
  background: #fff;
}

.lk-mark {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: linear-gradient(140deg, var(--brand2), #0B5F70);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 16px;
}

.lk-name {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.lk-sub {
  font-size: 11px;
  color: #7F93AE;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  margin-top: 2px;
}

.lk-form {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
}

.lk-field {
  position: relative;
  margin-bottom: 11px;
}

.lk-field input {
  width: 100%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #fff;
  border-radius: 12px;
  padding: 15px 46px 15px 15px;
  font-size: 16px;
  outline: none;
}

.lk-field input:focus {
  border-color: var(--brand2);
  background: rgba(255, 255, 255, 0.1);
}

.lk-field input::placeholder {
  color: #7186A2;
}

.lk-eye {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  padding: 10px;
  color: #8FA3BE;
  font-size: 12px;
}

.lk-go {
  width: 100%;
  background: var(--brand2);
  color: #fff;
  font-weight: 700;
  border-radius: 12px;
  padding: 15px;
  font-size: 15px;
  margin-top: 4px;
}

.lk-go:active {
  transform: scale(0.99);
}

.lk-err {
  background: rgba(180, 35, 24, 0.2);
  border: 1px solid rgba(255, 120, 110, 0.35);
  color: #FFB4AD;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 12.5px;
  margin-bottom: 11px;
}

/* ============ SHELL ============ */
#app {
  display: none;
  min-height: 100%;
}

#app.on {
  display: block;
}

.rail {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 236px;
  background: var(--rail);
  z-index: 60;
  display: flex;
  flex-direction: column;
  padding-top: var(--sat);
  transition: transform 0.22s ease;
}

.rail-head {
  padding: 16px 16px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--rail3);
}

.rail-head img {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  object-fit: contain;
  background: #fff;
  flex: none;
}

.rail-mark {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  flex: none;
  background: linear-gradient(140deg, var(--brand2), #0B5F70);
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 800;
  font-size: 14px;
}

.rail-nm {
  color: #fff;
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: -0.2px;
  line-height: 1.2;
}

.rail-sb {
  color: #6E829E;
  font-size: 9.5px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  margin-top: 1px;
}

.rail-foot {
  padding: 11px 16px calc(11px + var(--sab));
  border-top: 1px solid var(--rail3);
  color: #54678A;
  font-size: 10.5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(6, 11, 20, 0.55);
  z-index: 55;
  display: none;
}

.scrim.on {
  display: block;
}

.main {
  margin-left: 236px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.top {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: var(--sat);
}

.top-in {
  height: 54px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
}

.burger {
  display: none;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--surface3);
  place-items: center;
  font-size: 16px;
  flex: none;
}

.pg-t {
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: -0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-r {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

.wrap {
  padding: 16px;
  max-width: 1360px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
}

/* ============ NAV ============ */
.nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
}

.nav-lbl {
  color: #56698A;
  font-size: 9.5px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  padding: 12px 8px 6px;
  font-weight: 700;
}

.nav a {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 11px;
  border-radius: 8px;
  color: var(--railInk);
  font-size: 13.5px;
  font-weight: 500;
  margin-bottom: 2px;
  cursor: pointer;
}

.nav a .ic {
  width: 18px;
  text-align: center;
  font-size: 15px;
  flex: none;
  opacity: .9;
}

.nav a .bdg {
  margin-left: auto;
  background: var(--out);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: 999px;
  min-width: 18px;
  text-align: center;
}

.nav a .bdg.amber {
  background: #C2740D;
}

.nav a:hover {
  background: var(--rail2);
  color: #D6E1EE;
}

.nav a.on {
  background: var(--rail3);
  color: #fff;
  box-shadow: inset 3px 0 0 var(--brand2);
}

/* ============ TOP BAR CONTROLS ============ */
.sitesel {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 600;
  max-width: 170px;
  outline: none;
}

.icbtn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 14px;
  position: relative;
}

.icbtn .dot {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--out);
}

.avat {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 12.5px;
  flex: none;
}

.pg-s {
  font-size: 11px;
  color: var(--ink3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}

.sitebtn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12.5px;
  max-width: 250px;
  flex: none;
}

.sitebtn .cd {
  font-family: var(--mono);
  font-weight: 700;
  letter-spacing: .3px;
}

.sitebtn .nm {
  font-weight: 500;
  color: var(--ink2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sitebtn .cv {
  color: var(--ink3);
  font-size: 10px;
  flex: none;
}

.sitebtn .wd {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--out);
  flex: none;
}

@media (max-width: 860px) {
  .rail {
    transform: translateX(-100%);
    width: 265px;
    box-shadow: var(--shL);
  }

  .rail.on {
    transform: translateX(0);
  }

  .main {
    margin-left: 0;
  }

  .burger {
    display: grid;
  }

  .wrap {
    padding: 12px;
  }

  .sitebtn .nm {
    display: none;
  }

  .sitebtn {
    padding: 7px 9px;
  }
}

@media print {
  .rail,
  .top {
    display: none;
  }

  .main {
    margin: 0;
  }
}

/* ===== css/components.css ===== */
/**
 * css/components.css - Reusable component styles
 */

/* ============ CARDS / KPI ============ */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 13px;
  box-shadow: var(--sh);
  position: relative;
  overflow: hidden;
  text-align: left;
  display: block;
  width: 100%;
}

.kpi:before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--line2);
}

.kpi.ok:before {
  background: var(--ok);
}

.kpi.low:before {
  background: var(--low);
}

.kpi.out:before {
  background: var(--out);
}

.kpi.ord:before {
  background: var(--ord);
}

.kpi.br:before {
  background: var(--brand);
}

.kpi-l {
  font-size: 10.5px;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  font-weight: 700;
}

.kpi-v {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -1.2px;
  margin-top: 5px;
  line-height: 1;
}

.kpi-d {
  font-size: 11.5px;
  color: var(--ink2);
  margin-top: 5px;
}

.kpi-d .up {
  color: var(--out);
  font-weight: 700;
}

.kpi-d .dn {
  color: var(--ok);
  font-weight: 700;
}

.kpi-d .fl {
  color: var(--ink3);
  font-weight: 700;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh);
  margin-bottom: 14px;
}

.card-h {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 9px;
}

.card-t {
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: -0.1px;
}

.card-s {
  font-size: 11.5px;
  color: var(--ink3);
  margin-top: 1px;
}

.card-h .r {
  margin-left: auto;
  display: flex;
  gap: 6px;
  align-items: center;
}

.card-b {
  padding: 14px;
}

.card-b.flush {
  padding: 0;
}

/* ============ CONTROLS ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 13px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--surface2);
  border: 1px solid var(--line2);
  color: var(--ink);
}

.btn:hover {
  background: var(--surface3);
}

.btn.pri {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.btn.pri:hover {
  background: var(--brand2);
}

.btn.dgr {
  background: var(--out);
  border-color: var(--out);
  color: #fff;
}

.btn.sm {
  padding: 5px 9px;
  font-size: 11.5px;
  border-radius: 7px;
}

.btn.blk {
  width: 100%;
}

.btn:disabled {
  opacity: 0.45;
  pointer-events: none;
}

/* ============ TABS ============ */
.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding: 3px;
  background: var(--surface3);
  border-radius: 9px;
  margin-bottom: 12px;
}

.tabs button {
  padding: 7px 13px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink2);
  white-space: nowrap;
  border: none;
  background: none;
}

.tabs button.on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--sh);
}

/* ============ PILLS / BADGES ============ */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  white-space: nowrap;
}

.pill.ok {
  background: var(--okSoft);
  color: var(--ok);
}

.pill.low {
  background: var(--lowSoft);
  color: var(--low);
}

.pill.out {
  background: var(--outSoft);
  color: var(--out);
}

.pill.ord {
  background: var(--ordSoft);
  color: var(--ord);
}

.pill.mute {
  background: var(--muteSoft);
  color: var(--mute);
}

.pill.br {
  background: var(--brandSoft);
  color: var(--brand);
}

/* ============ PROGRESS / BARS ============ */
.bar-use {
  height: 8px;
  border-radius: 4px;
  background: var(--surface3);
  overflow: hidden;
  margin: 8px 0 4px;
}

.bar-use i {
  display: block;
  height: 100%;
  background: var(--brand);
  transition: width 0.3s;
}

.bar-use i.warn {
  background: var(--low);
}

.bar-use i.full {
  background: var(--out);
}

/* Stock bar with marker */
.sb {
  position: relative;
  height: 6px;
  background: var(--surface3);
  border-radius: 3px;
  overflow: visible;
  min-width: 78px;
}

.sb i {
  display: block;
  height: 6px;
  border-radius: 3px;
  background: var(--ok);
  transition: width 0.3s;
}

.sb.low i {
  background: var(--low);
}

.sb.out i {
  background: var(--out);
}

.sb u {
  position: absolute;
  top: -3px;
  height: 12px;
  width: 2px;
  background: var(--ink);
  opacity: 0.5;
  border-radius: 1px;
}

.sb-lg {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink3);
  margin-top: 3px;
  display: flex;
  justify-content: space-between;
}

/* ============ FORMS ============ */
.fld {
  margin-bottom: 11px;
}

.fld label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink2);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 5px;
}

.fld input,
.fld select,
.fld textarea {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  font-size: 15px;
  outline: none;
}

.fld input:focus,
.fld select:focus,
.fld textarea:focus {
  border-color: var(--brand);
}

.fld textarea {
  min-height: 66px;
  resize: vertical;
  font-size: 14px;
}

.fld .hlp {
  font-size: 11px;
  color: var(--ink3);
  margin-top: 4px;
}

.f2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* ============ EMPTY STATE ============ */
.empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--ink3);
}

.empty .e-i {
  font-size: 30px;
  opacity: 0.35;
}

.empty .e-t {
  font-weight: 700;
  color: var(--ink2);
  margin-top: 8px;
  font-size: 13.5px;
}

.empty .e-s {
  font-size: 12.5px;
  margin-top: 3px;
}

/* ============ MODAL / SHEET ============ */
.mask {
  position: fixed;
  inset: 0;
  background: rgba(6, 11, 20, 0.5);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.mask.on {
  display: flex;
}

.modal {
  background: var(--surface);
  border-radius: 14px;
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shL);
  overflow: hidden;
}

.m-h {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;

.m-t {

/* ============ TOAST ============ */
.toast {

}

.toast.on {

.toast.bad {

}

.sel {

.tbl {

.al-s {

.al-r {

// Get today's date at midnight
function today() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// Format date to ISO string (YYYY-MM-DD)
const iso = (d) => new Date(d).toISOString().slice(0, 10);

// Add N days to a date
const addD = (n, base) => iso(new Date((base ? new Date(base) : today()).getTime() + n * DAY));

// Days until a date (negative if past)
const daysTo = (d) => Math.round((new Date(d + 'T00:00:00') - today()) / DAY);

// Format date to readable format
const fmtD = (d) => {
  if (!d) return '—';
  const x = new Date(d + 'T00:00:00');
  return x.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
};

// Format datetime
const fmtDT = (t) => new Date(t).toLocaleString('en-GB', {
  day: '2-digit',
  month: 'short',
  hour: '2-digit',
  minute: '2-digit'
});

// Format as currency
const money = (n) => '$' + (Number(n) || 0).toLocaleString('en-US', {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});

// Format relative time ("2h ago", "just now", etc.)
const ago = (t) => {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return fmtDT(t);
};

// Generate week start date (Monday)
function weekStart() {
  const d = today();
  return new Date(d.getTime() - ((d.getDay() + 6) % 7) * DAY);
}

// Generate month start date
function monthStart() {
  const d = today();
  return new Date(d.getFullYear(), d.getMonth(), 1);
}

// Generate year start date
function yearStart() {
  const d = today();
  return new Date(d.getFullYear(), 0, 1);
}

// Calculate percentage change
function percentChange(current, previous) {
  if (!previous) return current ? '<span class="up">new</span>' : '<span class="fl">no prior data</span>';
  const p = Math.round((current - previous) / previous * 100);
  if (Math.abs(p) < 1) return '<span class="fl">level</span> vs last period';
  return `<span class="${p > 0 ? 'up' : 'dn'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</span> vs last period`;
}

// Stock bar proportions
function stockBarProportions(part) {
  const span = Math.max(part.min * 2, part.qty, 1);
  const width = Math.min(100, part.qty / span * 100);
  const minMark = Math.min(100, part.min / span * 100);
  return { width, minMark, span };
}

/**
 * js/storage.js - IndexedDB and localStorage abstraction layer
 */

let _db = null;

// Open IndexedDB connection
function openDB() {
  return new Promise((res) => {
    if (!window.indexedDB) return res(null);
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(DB_STORE)) {
          d.createObjectStore(DB_STORE);
        }
      };
      r.onsuccess = (e) => res(e.target.result);
      r.onerror = () => res(null);
      setTimeout(() => res(_db), 2500);
    } catch (e) {
      res(null);
    }
  });
}

// Get value from IndexedDB or localStorage
async function dbGet(k) {
  // Try IndexedDB first
  if (_db) {
    try {
      return await new Promise((res, rej) => {
        const t = _db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k);
        t.onsuccess = () => res(t.result);
        t.onerror = () => rej();
      });
    } catch (e) {
      // Fall through to localStorage
    }
  }
  
  // Fall back to localStorage
  try {
    const v = localStorage.getItem(k);
    return v ? JSON.parse(v) : undefined;
  } catch (e) {
    return undefined;
  }
}

// Set value in IndexedDB and localStorage
async function dbSet(k, v) {
  // Write to IndexedDB if available
  if (_db) {
    try {
      await new Promise((res, rej) => {
        const t = _db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(v, k);
        t.onsuccess = () => res();
        t.onerror = () => rej();
      });
    } catch (e) {
      // Continue to localStorage
    }
  }
  
  // Always write to localStorage as backup
  try {
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) {
    console.warn('Storage quota exceeded or unavailable');
  }
}

// Clear all data
async function dbClear() {
  if (_db) {
    try {
      const t = _db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).clear();
      await new Promise((res, rej) => {
        t.onsuccess = () => res();
        t.onerror = () => rej();
      });
    } catch (e) {
      // Continue
    }
  }
  localStorage.clear();
}

// Initialize storage on app load
async function initStorage() {
  _db = await openDB();
}

const moduleById = (id) => MODULES.find((m) => m.id === id);

/** A permission set with every action off. */
function noPerms() {
  const p = {};
  MODULES.forEach((m) => {
    p[m.id] = {};
    m.acts.forEach((a) => (p[m.id][a] = 0));
  });
  return p;
}

/** A permission set with every action on. */
function allPerms() {
  const p = noPerms();
  MODULES.forEach((m) => m.acts.forEach((a) => (p[m.id][a] = 1)));
  return p;
}

/**
 * Build a permission set from a compact { module: [actions] } spec.
 * Unlisted modules and actions stay off.
 */
function grantPerms(spec) {
  const p = noPerms();
  Object.entries(spec).forEach(([mod, acts]) => {
    if (!p[mod]) return;
    acts.forEach((a) => {
      if (p[mod][a] !== undefined) p[mod][a] = 1;
    });
  });
  return p;
}

      home: ['view'],
      parts: ['view'],
      tools: ['view'],
      cal: ['view'],
      war: ['view']
    })
  }
};

/**
 * The effective permissions for an account: its own saved set where it has one,
 * falling back to its role template for anything not stored. Accounts created
 * before permissions existed therefore keep behaving exactly as before.
 */
function permsFor(user) {
  const tpl = (user && ROLES[user.role] ? ROLES[user.role].perms : null) || noPerms();
  const own = user && user.perms ? user.perms : null;
  const out = noPerms();

  MODULES.forEach((m) => {
    m.acts.forEach((a) => {
      const saved = own && own[m.id] ? own[m.id][a] : undefined;
      out[m.id][a] = (saved === undefined ? tpl[m.id] && tpl[m.id][a] : saved) ? 1 : 0;
    });
  });

  return out;
}

/** Effective permissions for whoever is signed in. */
const myPerms = () => permsFor(VIEW.user);

/**
 * The single gate every feature goes through.
 * An action other than 'view' also requires 'view' on its module, so revoking a
 * module cannot leave a stray action live behind it.
 */
function canDo(mod, act) {
  if (!VIEW.user) return false;

  const p = permsFor(VIEW.user);
  if (!p[mod]) return false;
  if (act !== 'view' && !p[mod].view) return false;

  return !!p[mod][act];
}

/** Can the signed-in account open this page at all? */
const canSee = (page) => canDo(page, 'view');

/** Page ids the signed-in account may open, in menu order. */
const visiblePages = () => MODULES.filter((m) => canDo(m.id, 'view')).map((m) => m.id);

/** Where to land an account that has no page in mind. */
const landingPage = () => visiblePages()[0] || null;

/**
 * Legacy flat capability names, mapped onto the module model. Kept so any call
 * site still using can('x') keeps working; new code should call canDo().
 */
const LEGACY_CAN = {
  edit: ['parts', 'edit'],
  del: ['parts', 'del'],
  issue: ['parts', 'issue'],
  receive: ['parts', 'receive'],
  adjust: ['parts', 'adjust'],
  checkout: ['tools', 'checkout'],
  po: ['po', 'add'],
  poApprove: ['po', 'approve'],
  cal: ['cal', 'update'],
  admin: ['admin', 'view'],
  creds: ['admin', 'accounts'],
  export: ['home', 'export']
};

const can = (k) => {
  const m = LEGACY_CAN[k];
  return m ? canDo(m[0], m[1]) : false;
};

/* ---------- warehouse / site access ---------- */

/**
 * Site ids an account may work in. `sites: []` or a missing list means every
 * site; a single legacy `site` field is honoured as a one-entry list.
 */
function siteIdsFor(user) {
  if (!user) return [];

  const list = Array.isArray(user.sites)
    ? user.sites.filter((id) => id && id !== 'all')
    : (user.site && user.site !== 'all' ? [user.site] : []);

  return list.length ? list : S.sites.map((s) => s.id);
}

/** Site ids the signed-in account may work in. */
const mySiteIds = () => siteIdsFor(VIEW.user);

/** Is this site within the signed-in account's reach? */
const siteAllowed = (id) => id === 'all' || mySiteIds().includes(id);

/** Does this account reach every site the store knows about? */
const hasAllSites = (user) => siteIdsFor(user).length >= S.sites.length;

/**
 * js/session.js - Session management and user tracking
 */

const SESSION_CONFIG = {
  inactivityTimeout: 15 * 60 * 1000, // 15 minutes
  warningTime: 2 * 60 * 1000, // Show warning 2 minutes before timeout
  maxSessionDuration: 8 * 60 * 60 * 1000, // 8 hours max session
  enableTracking: true
};

let SESSION_DATA = {
  startTime: null,
  lastActivityTime: null,
  warningShown: false,
  inactivityTimer: null,
  warningTimer: null,
  trackingEvents: []
};

/**
 * Initialize session tracking
 */
function initSessionTracking() {
  if (!SESSION_CONFIG.enableTracking || !VIEW.user) return;
  
  SESSION_DATA.startTime = Date.now();
  SESSION_DATA.lastActivityTime = Date.now();
  SESSION_DATA.warningShown = false;
  SESSION_DATA.trackingEvents = [];
  
  // Track user activity
  setupActivityTracking();
  
  // Log session start
  logIt('session_start', `Session started for ${VIEW.user.name}`, 'all', {
    user: VIEW.user.u,
    role: VIEW.user.role,
    site: VIEW.site
  });
}

/**
 * Setup activity tracking
 */
function setupActivityTracking() {
  const trackActivity = () => {
    SESSION_DATA.lastActivityTime = Date.now();
    SESSION_DATA.warningShown = false;
    resetInactivityTimers();
  };
  
  // Events that count as activity
  document.addEventListener('click', trackActivity);
  document.addEventListener('keydown', trackActivity);
  document.addEventListener('mousemove', trackActivity);
  document.addEventListener('scroll', trackActivity);
  
  // Start inactivity timers
  resetInactivityTimers();
}

/**
 * Reset inactivity timers
 */
function resetInactivityTimers() {
  if (!VIEW.user) return;
  
  // Clear existing timers
  if (SESSION_DATA.inactivityTimer) clearTimeout(SESSION_DATA.inactivityTimer);
  if (SESSION_DATA.warningTimer) clearTimeout(SESSION_DATA.warningTimer);
  
  // Warning timer
  SESSION_DATA.warningTimer = setTimeout(() => {
    if (!SESSION_DATA.warningShown && VIEW.user) {
      SESSION_DATA.warningShown = true;
      showSessionWarning();
    }
  }, SESSION_CONFIG.inactivityTimeout - SESSION_CONFIG.warningTime);
  
  // Timeout timer
  SESSION_DATA.inactivityTimer = setTimeout(() => {
    if (VIEW.user) {
      logIt('session_timeout', 'Session timed out due to inactivity', 'all', {
        duration: Date.now() - SESSION_DATA.startTime,
        lastActivity: Date.now() - SESSION_DATA.lastActivityTime
      });
      signOut();
      toast('Your session has expired. Please log in again.', 'bad');
    }
  }, SESSION_CONFIG.inactivityTimeout);
}

/**
 * Show session warning
 */
function showSessionWarning() {
  const remaining = Math.ceil(SESSION_CONFIG.warningTime / 1000);
  
  toast(`Session will expire in ${remaining} seconds. Click to stay logged in.`, 'bad');
  
  // Make toast clickable to reset timer
  const toastEl = $('#toast');
  toastEl.style.cursor = 'pointer';
  toastEl.onclick = () => {
    SESSION_DATA.lastActivityTime = Date.now();
    SESSION_DATA.warningShown = false;
    resetInactivityTimers();
    toast('Session reset. You are still logged in.', 'good');
  };
}

/**
 * Get session duration
 */
function getSessionDuration() {
  if (!SESSION_DATA.startTime) return 0;
  return Date.now() - SESSION_DATA.startTime;
}

/**
 * Get inactivity time
 */
function getInactivityTime() {
  if (!SESSION_DATA.lastActivityTime) return 0;
  return Date.now() - SESSION_DATA.lastActivityTime;
}

/**
 * Format session duration for display
 */
function formatSessionDuration(ms) {
  const hours = Math.floor(ms / (1000 * 60 * 60));
  const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((ms % (1000 * 60)) / 1000);
  
  if (hours > 0) {
    return `${hours}h ${minutes}m`;
  } else if (minutes > 0) {
    return `${minutes}m ${seconds}s`;
  } else {
    return `${seconds}s`;
  }
}

/**
 * Get session info
 */
function getSessionInfo() {
  if (!VIEW.user) return null;
  
  return {
    user: VIEW.user.name,
    role: VIEW.user.role,
    site: VIEW.site,
    startTime: SESSION_DATA.startTime,
    duration: getSessionDuration(),
    inactivityTime: getInactivityTime(),
    durationFormatted: formatSessionDuration(getSessionDuration()),
    inactivityFormatted: formatSessionDuration(getInactivityTime())
  };
}

/**
 * End session and log activity
 */
function endSession() {
  if (!VIEW.user) return;
  
  const duration = getSessionDuration();
  
  logIt('session_end', `Session ended for ${VIEW.user.name}`, 'all', {
    user: VIEW.user.u,
    duration: duration,
    durationFormatted: formatSessionDuration(duration)
  });
  
  // Clear timers
  if (SESSION_DATA.inactivityTimer) clearTimeout(SESSION_DATA.inactivityTimer);
  if (SESSION_DATA.warningTimer) clearTimeout(SESSION_DATA.warningTimer);
  
  SESSION_DATA = {
    startTime: null,
    lastActivityTime: null,
    warningShown: false,
    inactivityTimer: null,
    warningTimer: null,
    trackingEvents: []
  };
}

/**
 * Show session info modal
 */
function showSessionInfo() {
  if (!VIEW.user) return;
  
  const info = getSessionInfo();
  
  openModal(
    'Session Information',
    `${info.user} · ${info.role}`,
    `
      <div class="kv">
        <span>Duration</span>
        <b>${info.durationFormatted}</b>
      </div>
      <div class="kv">
        <span>Inactivity Time</span>
        <b>${info.inactivityFormatted}</b>
      </div>
      <div class="kv">
        <span>Current Site</span>
        <b>${siteName(info.site)}</b>
      </div>
      <div class="kv">
        <span>Session Start</span>
        <b>${fmtDT(info.startTime)}</b>
      </div>
      <div class="kv">
        <span>Session Timeout</span>
        <b>${formatSessionDuration(SESSION_CONFIG.inactivityTimeout)}</b>
      </div>
    `,
    `<button class="btn pri" onclick="closeModal()">Close</button>`
  );
}

/* ===== js/models/logs.js ===== */
/**
 * js/models/logs.js - Activity log queries and filtering
 */

/**
 * Get flow of movements (issues/receives) between two dates
 * @param {string} type - 'issue' or 'receive'
 * @param {Date} from - Start date
 * @param {Date} to - End date
 * @returns {Object} {qty, val, n, lines}
 */
function flow(type, from, to) {
  const a = +from;
  const b = to == null ? Date.now() + DAY : +to;
  const L = S.log.filter(
    (l) =>
      l.type === type &&
      l.qty &&
      (VIEW.site === 'all' || l.site === VIEW.site) &&
      l.ts >= a &&
      l.ts < b
  );
  return {
    qty: L.reduce((s, l) => s + l.qty, 0),
    val: L.reduce((s, l) => s + (l.value || 0), 0),
    n: L.length,
    lines: L
  };
}

/**
 * How many buckets each period shows, and what the last one is called
 */
const FLOW_SPANS = {
  day: { n: 30, label: 'Last 30 days', partial: 'today' },
  week: { n: 12, label: 'Last 12 weeks', partial: 'this week' },
  month: { n: 12, label: 'Last 12 months', partial: 'this month' },
  year: { n: 5, label: 'Last 5 years', partial: 'this year' }
};

/**
 * Value in and out per period, oldest first.
 *
 * The last bucket is the one in progress, so it is always short — it is
 * flagged with `now` so the chart can mark it as partial rather than let it
 * read as a collapse in activity.
 *
 * @param {string} kind - 'day' | 'week' | 'month' | 'year'
 * @param {number} [count] - buckets to return; defaults to the span above
 */
function flowBy(kind, count) {
  const span = FLOW_SPANS[kind] || FLOW_SPANS.month;
  const n = count || span.n;
  const d = today();
  const out = [];

  const bucket = (from, to, label, year, now) => {
    const issued = use(from, to);
    const received = stockIn(from, to);
    return {
      label,
      year,
      out: issued.val,
      in: received.val,
      outQty: issued.qty,
      inQty: received.qty,
      now
    };
  };

  for (let i = n - 1; i >= 0; i--) {
    const now = i === 0;
    let from;
    let to;
    let label;

    if (kind === 'day') {
      from = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i);
      to = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i + 1);
      label = String(from.getDate());
    } else if (kind === 'week') {
      const ws = weekStart();
      from = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() - i * 7);
      to = new Date(from.getFullYear(), from.getMonth(), from.getDate() + 7);
      label = from.getDate() + ' ' + MON[from.getMonth()];
    } else if (kind === 'year') {
      const y = d.getFullYear() - i;
      from = new Date(y, 0, 1);
      to = new Date(y + 1, 0, 1);
      label = String(y);
    } else {
      from = new Date(d.getFullYear(), d.getMonth() - i, 1);
      to = new Date(d.getFullYear(), d.getMonth() - i + 1, 1);
      label = MON[from.getMonth()];
    }

    out.push(bucket(from, to, label, from.getFullYear(), now));
  }

  return out;
}

/**
 * Get parts issued out of store
 */
const use = (f, t) => flow('issue', f, t);

/**
 * Get goods received into store
 */
const stockIn = (f, t) => flow('receive', f, t);

/**
 * Get flow from previous period (for comparisons)
 */
function flowPrev(type, kind) {
  const now = Date.now();
  
  if (kind === 'week') {
    const w = +weekStart();
    return flow(type, w - 7 * DAY, w - 7 * DAY + (now - w));
  }
  
  if (kind === 'month') {
    const m = monthStart();
    const el = now - m;
    const pm = new Date(m.getFullYear(), m.getMonth() - 1, 1);
    return flow(type, pm, +pm + el);
  }
  
  const y = yearStart();
  const el = now - y;
  const py = new Date(y.getFullYear() - 1, 0, 1);
  return flow(type, py, +py + el);
}

const usePrev = (k) => flowPrev('issue', k);

/**
 * Get consumption by calendar month
 */
function byMonth(n) {
  const out = [];
  const d = today();
  
  for (let i = n - 1; i >= 0; i--) {
    const s = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const e = new Date(d.getFullYear(), d.getMonth() - i + 1, 1);
    const o = use(s, e);
    const inn = stockIn(s, e);
    
    out.push({
      label: MON[s.getMonth()],
      year: s.getFullYear(),
      out: o.val,
      in: inn.val,
      outQty: o.qty,
      inQty: inn.qty,
      now: i === 0
    });
  }
  
  return out;
}

const useByMonth = (n) => byMonth(n);

/**
 * Get top consumed parts
 */
function topUsed(from, limit) {
  const m = {};
  
  use(from).lines.forEach((l) => {
    if (!m[l.part]) m[l.part] = { qty: 0, val: 0 };
    m[l.part].qty += l.qty;
    m[l.part].val += l.value || 0;
  });
  
  return Object.entries(m)
    .map(([id, v]) => ({ p: partById(id), ...v }))
    .filter((x) => x.p)
    .sort((a, b) => b.val - a.val)
    .slice(0, limit || 5);
}

/* ===== js/models/warranty.js ===== */
/**
 * js/models/warranty.js - Warranty calculations and tracking
 */

/**
 * Calculate warranty expiration date
 */
function warUntil(o) {
  return (o && o.war && o.warFrom) ? addD(o.war * 30, o.warFrom) : null;
}

/**
 * Get warranty state of an item
 * @returns {string} 'none' | 'ok' | 'soon' | 'exp'
 */
function warState(o) {
  const u = warUntil(o);
  if (!u) return 'none';
  const d = daysTo(u);
  return d < 0 ? 'exp' : d <= 60 ? 'soon' : 'ok';
}

/**
 * Get all warranted items (parts and tools combined)
 */
function warItems() {
  return [
    ...S.parts
      .filter(inSite)
      .map((p) => ({
        kind: 'part',
        o: p,
        name: p.name,
        code: p.sku,
        sub: `${p.qty} ${p.unit} on hand`,
        val: p.qty * p.cost
      })),
    ...S.tools
      .filter(inSite)
      .map((t) => ({
        kind: 'tool',
        o: t,
        name: t.name,
        code: t.code,
        sub: t.cat,
        val: 0
      }))
  ]
    .map((x) => ({
      ...x,
      st: warState(x.o),
      until: warUntil(x.o)
    }));
}

/**
 * Get items with warranty expiring soon (within 60 days)
 */
const warExpiring = () => warItems().filter((x) => x.st === 'soon');

/**
 * Get items with expired warranty
 */
const warExpired = () => warItems().filter((x) => x.st === 'exp');

/**
 * Format warranty info for display
 */
function formatWarranty(o) {
  const state = warState(o);
  if (state === 'none') return 'No warranty';
  
  const until = warUntil(o);
  const days = daysTo(until);
  
  if (state === 'exp') return `Expired ${Math.abs(days)} days ago`;
  if (state === 'soon') return `Expires in ${days} days`;
  return `Valid for ${days} more days`;
}

/* ===== js/models/parts.js ===== */
/**
 * js/models/parts.js - Parts inventory management
 */

/**
 * Get stock state of a part
 * @param {Object} p - Part object
 * @returns {string} 'ok' | 'low' | 'out'
 */
function stockState(p) {
  if (p.qty <= 0) return 'out';
  if (p.qty <= p.min) return 'low';
  return 'ok';
}

/**
 * Get all parts with low stock
 */
const lowParts = () => S.parts.filter((p) => inSite(p) && stockState(p) !== 'ok');

/**
 * Get part by ID
 */
const partById = (id) => S.parts.find((p) => p.id === id);

/**
 * Get total stock value for current site
 */
const stockValue = () => S.parts.filter(inSite).reduce((a, p) => a + p.qty * p.cost, 0);

/**
 * Suggested reorder quantity - back up to twice the minimum, never less than one
 */
const reorderQty = (p) => Math.max(p.min * 2 - p.qty, p.min, 1);

/**
 * Create a new part
 */
function createPart(sku, name, cat, site, qty, min, unit, bin, cost, sup, lt) {
  return {
    id: uid('p'),
    sku,
    name,
    cat,
    site,
    qty,
    min,
    unit,
    bin,
    cost,
    sup,
    lt,
    photo: '',
    updated: Date.now()
  };
}

/**
 * Issue (decrease) part quantity
 */
function issuePart(partId, qty, site) {
  const p = partById(partId);
  if (!p) return false;
  
  p.qty = Math.max(0, p.qty - qty);
  p.updated = Date.now();
  
  const value = qty * p.cost;
  logIt('issue', `Issued ${qty} × ${p.name}`, site, {
    part: partId,
    qty,
    value
  });
  
  return true;
}

/**
 * Receive (increase) part quantity
 */
function receivePart(partId, qty, site) {
  const p = partById(partId);
  if (!p) return false;
  
  p.qty += qty;
  p.updated = Date.now();
  
  const value = qty * p.cost;
  logIt('receive', `Received ${qty} × ${p.name}`, site, {
    part: partId,
    qty,
    value
  });
  
  return true;
}

/**
 * Adjust part count (inventory correction)
 */
function adjustPart(partId, newQty, reason) {
  const p = partById(partId);
  if (!p) return false;
  
  const delta = newQty - p.qty;
  p.qty = newQty;
  p.updated = Date.now();
  
  logIt('adjust', `Stock adjustment: ${p.name} → ${newQty} (${reason})`, p.site);
  return true;
}

/**
 * Delete part (soft delete via log)
 */
function deletePart(partId) {
  const p = partById(partId);
  if (!p) return false;
  
  const idx = S.parts.indexOf(p);
  if (idx >= 0) {
    S.parts.splice(idx, 1);
    logIt('delete', `Deleted part: ${p.name}`, p.site);
    return true;
  }
  return false;
}

/* ===== js/models/tools.js ===== */
/**
 * js/models/tools.js - Tools management and calibration tracking
 */

/**
 * Get calibration state of a tool
 * @returns {string} 'na' | 'ok' | 'due' | 'exp'
 */
function calState(t) {
  if (!t.calInt || !t.calNext) return 'na';
  const d = daysTo(t.calNext);
  if (d < 0) return 'exp';
  if (d <= 30) return 'due';
  return 'ok';
}

/**
 * Get tool state (availability)
 * @returns {string} 'in' | 'out' | 'over' | 'maint'
 */
function toolState(t) {
  if (t.status === 'maint') return 'maint';
  if (t.status === 'out') return t.dueAt && daysTo(t.dueAt) < 0 ? 'over' : 'out';
  return 'in';
}

/**
 * Get all overdue tools (checked out past due date)
 */
const overTools = () => S.tools.filter((t) => inSite(t) && toolState(t) === 'over');

/**
 * Get all tools with calibration due or expired
 */
const calDue = () => S.tools.filter((t) => inSite(t) && ['due', 'exp'].includes(calState(t)));

/**
 * Checkout a tool
 */
function checkoutTool(toolId, holder, dueDate, site) {
  const t = S.tools.find((x) => x.id === toolId);
  if (!t) return false;
  
  t.status = 'out';
  t.holder = holder;
  t.outAt = Date.now();
  t.dueAt = dueDate;
  
  logIt('checkout', `Checked out ${t.name} — ${holder}`, site, { tool: toolId });
  return true;
}

/**
 * Return a tool
 */
function returnTool(toolId, site) {
  const t = S.tools.find((x) => x.id === toolId);
  if (!t) return false;
  
  t.status = 'in';
  t.holder = '';
  t.outAt = null;
  t.dueAt = null;
  
  logIt('return', `Returned ${t.name}`, site, { tool: toolId });
  return true;
}

/**
 * Update tool calibration record
 */
function calibrateTool(toolId, lastDate, nextDate, cert, site) {
  const t = S.tools.find((x) => x.id === toolId);
  if (!t) return false;
  
  t.calLast = lastDate;
  t.calNext = nextDate;
  t.cert = cert;
  
  logIt('calibration', `Calibrated ${t.name} (Cert: ${cert})`, site, { tool: toolId });
  return true;
}

/**
 * Get tool by ID
 */
const toolById = (id) => S.tools.find((t) => t.id === id);

/* ===== js/models/pos.js ===== */
/**
 * js/models/pos.js - Purchase order management
 */

/**
 * Get all open purchase orders (draft, ordered, shipped)
 */
const openPOs = () => S.pos.filter((o) => inSite(o) && ['draft', 'ordered', 'shipped'].includes(o.status));

/**
 * Get PO by ID
 */
const poById = (id) => S.pos.find((o) => o.id === id);

/**
 * Parts below minimum that are not already on an open order
 */
function sugList() {
  return lowParts().filter((p) => !openPOs().some((o) => o.lines.some((l) => l.part === p.id)));
}

/**
 * Create new purchase order
 */
function createPO(supplier, site, lines, notes) {
  const po = {
    id: uid('po'),
    no: `PO-${Date.now().toString().slice(-6)}`,
    sup: supplier,
    site,
    status: 'draft',
    created: Date.now(),
    eta: null,
    by: VIEW.user ? VIEW.user.u : 'system',
    notes,
    lines: lines || []
  };
  
  S.pos.push(po);
  logIt('po', `Created ${po.no} — ${supplier}, ${lines.length} line(s)`, site, { po: po.id });
  
  return po;
}

/**
 * Update PO status
 */
function updatePOStatus(poId, newStatus, eta) {
  const po = poById(poId);
  if (!po) return false;
  
  const oldStatus = po.status;
  po.status = newStatus;
  if (eta) po.eta = eta;
  
  logIt('po', `Updated ${po.no}: ${oldStatus} → ${newStatus}`, po.site, { po: poId });
  return true;
}

/**
 * Add line item to PO
 */
function addPOLine(poId, partId, qty, cost) {
  const po = poById(poId);
  if (!po) return false;
  
  po.lines.push({
    part: partId,
    qty,
    cost
  });
  
  return true;
}

/**
 * Remove line item from PO
 */
function removePOLine(poId, lineIndex) {
  const po = poById(poId);
  if (!po || lineIndex < 0 || lineIndex >= po.lines.length) return false;
  
  po.lines.splice(lineIndex, 1);
  return true;
}

/**
 * Get PO line value
 */
function poLineValue(line) {
  return line.qty * line.cost;
}

/**
 * Calculate total PO value
 */
function poTotal(po) {
  return po.lines.reduce((a, l) => a + poLineValue(l), 0);
}

/**
 * Approve a PO (manager only)
 */
function approvePO(poId) {
  if (!can('poApprove')) return false;
  
  return updatePOStatus(poId, 'ordered');
}

/**
 * Receive a PO
 */
function receivePO(poId) {
  const po = poById(poId);
  if (!po || po.status !== 'shipped') return false;
  
  // Receive each line item
  po.lines.forEach((line) => {
    receivePart(line.part, line.qty, po.site);
  });
  
  updatePOStatus(poId, 'received');
  logIt('receive', `Received ${po.no} from ${po.sup}`, po.site, { po: poId });
  
  return true;
}

/**
 * Migrate old data format to new format
 * Handles updating old site codes to new ones
 */
function migrate(s) {
  if (!s || s.v >= 3) return s;

  const fresh = seed();
  s.sites = fresh.sites;
  s.users = fresh.users;

  // Map old site codes to new
  const map = (id) => SITE_MIGRATION[id] || id;

  (s.parts || []).forEach((p) => (p.site = map(p.site)));
  (s.tools || []).forEach((t) => (t.site = map(t.site)));
  (s.pos || []).forEach((o) => (o.site = map(o.site)));
  (s.log || []).forEach((l) => {
    if (l.site) l.site = map(l.site);
  });
  (s.users || []).forEach((u) => {
    if (u.site && u.site !== 'all') u.site = map(u.site);
  });
  if (s.session && s.session.site) s.session.site = map(s.session.site);

  s.v = 3;
  return s;
}

let toastTimeout;

/**
 * Show toast notification
 * @param {string} msg - Message to display
 * @param {string} [kind] - 'good', 'bad', or null for neutral
 */
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (kind ? ' ' + kind : '');
  
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    t.className = 'toast';
  }, 2400);
}

// Shorthand toast messages
const showToast = {
  success: (msg) => toast(msg, 'good'),
  error: (msg) => toast(msg, 'bad'),
  info: (msg) => toast(msg)
};

/**
 * js/ui/modals.js - Modal dialog system
 */

/**
 * Close the current modal
 */
function closeModal() {
  $('#mask').classList.remove('on');
  $('#modal').classList.remove('wide');
  $('#modal').innerHTML = '';
}

/**
 * Open a modal dialog
 * @param {string} title - Modal title
 * @param {string} sub - Subtitle/description
 * @param {string} body - Modal body HTML
 * @param {string} footer - Footer with buttons HTML
 */
function openModal(title, sub, body, footer, wide) {
  const modalHtml = `
    <div class="m-h">
      <div>
        <div class="m-t">${esc(title)}</div>
        ${sub ? `<div class="m-s">${esc(sub)}</div>` : ''}
      </div>
      <button class="m-x" onclick="closeModal()">✕</button>
    </div>
    <div class="m-b">${body}</div>
    ${footer ? `<div class="m-f">${footer}</div>` : ''}
  `;
  $('#modal').innerHTML = modalHtml;
  $('#modal').classList.toggle('wide', !!wide);
  $('#mask').classList.add('on');
  
  // Auto-focus first input (desktop only)
  const f = $('#modal').querySelector('input:not([type=file]),select,textarea');
  if (f && window.innerWidth > 860) {
    setTimeout(() => f.focus(), 60);
  }
}

/**
 * Alert dialog
 */
function alertModal(title, message) {
  openModal(
    title,
    null,
    `<p style="color:var(--ink2); line-height:1.5">${esc(message)}</p>`,
    `<button class="btn pri" onclick="closeModal()">OK</button>`
  );
}

/**
 * Confirm dialog
 */
function confirmModal(title, message, onConfirm) {
  openModal(
    title,
    null,
    `<p style="color:var(--ink2); line-height:1.5">${esc(message)}</p>`,
    `
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="(${onConfirm})(); closeModal()">Confirm</button>
    `
  );
}

// Close modal when clicking on background
$('#mask').addEventListener('click', (e) => {
  if (e.target.id === 'mask') closeModal();
});

/**

 */

let PH = {}; // Photo storage

/**
 * Get photo source URL for an item
 * @param {Object} o - Part or tool object
 * @returns {string|null} Photo URL or data URI
 */
function photoSrc(o) {
  if (!o || !o.photo) return null;
  
  // External URL
  if (/^https?:\/\//i.test(o.photo)) return o.photo;
  
  // Local storage data URI
  return PH[o.photo] || null;
}

/**
 * Save photos to storage
 */
async function savePhotos() {
  await dbSet(PH_KEY, PH);
}

/**
 * Get any item by ID (part or tool)
 */
function anyById(id) {
  return partById(id) || S.tools.find((t) => t.id === id) || null;
}

/**
 * Compress image file to data URI
 * @param {File} file - Image file to compress
 * @returns {Promise<string>} Data URI of compressed image
 */
function shrinkImage(file) {
  return new Promise((res, rej) => {
    // Validate file type
    if (!/^image\//.test(file.type)) {
      return rej(new Error('That file is not an image'));
    }
    
    const r = new FileReader();
    r.onerror = () => rej(new Error('Could not read that file'));
    r.onload = (e) => {
      const img = new Image();
      img.onerror = () => rej(new Error('Could not open that image'));
      img.onload = () => {
        try {
          // Calculate scaled dimensions
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          const sc = Math.min(1, PH_MAX / Math.max(w, h));
          w = Math.max(1, Math.round(w * sc));
          h = Math.max(1, Math.round(h * sc));
          
          // Draw to canvas
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const x = c.getContext('2d');
          x.fillStyle = '#fff';
          x.fillRect(0, 0, w, h);
          x.drawImage(img, 0, 0, w, h);
          
          // Return compressed JPEG
          res(c.toDataURL('image/jpeg', PH_Q));
        } catch (err) {
          rej(new Error('Could not process that image'));
        }
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/**
 * Create thumbnail HTML for an item
 * @param {Object} o - Item object
 * @param {string} fallback - Fallback text

}

/* ---------- photo picker (shared by the part and tool editors) ---------- */

// undefined = untouched, '' = remove, otherwise a data URI or an http link
let EDITPH;

/**
 * Photo field for an editor form - preview plus upload / link / remove
 * @param {Object} o - Part or tool being edited
 */
function photoField(o) {
  EDITPH = undefined;
  const src = photoSrc(o);
  const linked = /^https?:/i.test(o.photo || '');

  return `
    <div class="fld">
      <label>Photo</label>
      <div class="phfld">
        <div id="phPrev">
          ${src ? `<img class="pv" src="${esc(src)}" alt="">` : '<div class="pv ph0">▤</div>'}
        </div>
        <div style="flex:1;min-width:0">
          <div class="ac">
            <label class="lbl-btn">Upload photo
              <input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)">
            </label>
            <button type="button" class="btn sm" onclick="linkPhoto()">Use a link</button>
            <button type="button" class="btn sm" onclick="clearPhoto()">Remove</button>
          </div>
          <div class="hlp" id="phHint">
            ${src
              ? (linked ? 'Currently linked to an external image.' : 'Stored on this device.')
              : 'On a phone this opens the camera or your gallery.'}
          </div>
        </div>
      </div>
    </div>
  `;
}

/**
 * Update the picker preview and hint
 */
function phPreview(src, hint) {
  $('#phPrev').innerHTML = src ? `<img class="pv" src="${esc(src)}" alt="">` : '<div class="pv ph0">▤</div>';
  $('#phHint').textContent = hint;
}

/**
 * Handle a file chosen in the picker - resize, then hold it until save
 */
async function pickPhoto(inp) {
  const f = inp.files && inp.files[0];
  inp.value = '';
  if (!f) return;

  $('#phHint').textContent = 'Processing…';

  try {
    const data = await shrinkImage(f);
    const kb = Math.round(data.length * 0.75 / 1024);

    if (photoBytes(PH) + data.length > PH_BUDGET) {
      return phPreview(
        photoSrc({ photo: EDITPH }),
        'Photo storage is full. Remove some photos first, or use a link instead.'
      );
    }

    EDITPH = data;
    phPreview(data, `Ready to save · ${kb} KB (resized from ${Math.round(f.size / 1024)} KB)`);
  } catch (e) {
    phPreview(null, e.message);
  }
}

/**
 * Point the item at an external image instead of storing one
 */
function linkPhoto() {
  const cur = EDITPH !== undefined && /^https?:/i.test(EDITPH || '') ? EDITPH : '';
  const v = prompt('Paste the image address (must start with https://)', cur);
  if (v === null) return;

  const u = v.trim();
  if (!u) {
    EDITPH = '';
    return phPreview(null, 'Photo will be removed on save.');
  }
  if (!/^https?:\/\//i.test(u)) {
    return toast('Links must start with http:// or https://', 'bad');
  }

  EDITPH = u;
  phPreview(u, 'Linked image. Nothing is stored on this device.');
}

/**
 * Queue removal of the current photo
 */
function clearPhoto() {
  EDITPH = '';
  phPreview(null, 'Photo will be removed on save.');
}

/**
 * Apply the pending picker choice to an item
 * @returns {boolean} true if device photo storage changed
 */
function commitPhoto(o) {
  if (EDITPH === undefined) return false;

  // Drop the old device copy - a linked image never had one
  if (o.photo && !/^https?:/i.test(o.photo)) delete PH[o.photo];

  if (EDITPH === '') {
    o.photo = '';
  } else if (/^https?:/i.test(EDITPH)) {
    o.photo = EDITPH;
  } else {
    const id = uid('ph');
    PH[id] = EDITPH;
    o.photo = id;
  }

  EDITPH = undefined;
  return true;
}

// Initialize photos on app load
loadPhotos();

/**

  if (v < 0) v = 0;
  if (i.max && v > +i.max) v = +i.max;

  i.value = v;

}

/**
 * js/auth.js - Authentication and login system
 */

// Authentication state tracking
let AUTH_STATE = {
  loginAttempts: 0,
  lastAttemptTime: 0,
  lockoutTime: 0,
  sessionTimeout: null,
  inactivityTime: 15 * 60 * 1000, // 15 minutes
  lastActivityTime: Date.now()
};

const MAX_LOGIN_ATTEMPTS = 5;
const LOCKOUT_DURATION = 5 * 60 * 1000; // 5 minutes

/**
 * Validate username format
 */
function validateUsername(u) {
  if (!u) return { valid: false, msg: 'Username is required' };
  if (u.length < 3) return { valid: false, msg: 'Username must be at least 3 characters' };
  if (!/^[a-z0-9_-]+$/.test(u)) return { valid: false, msg: 'Username can only contain letters, numbers, - and _' };
  return { valid: true };
}

/**
 * Validate password format
 */
function validatePassword(p) {
  if (!p) return { valid: false, msg: 'Password is required' };
  if (p.length < 6) return { valid: false, msg: 'Password must be at least 6 characters' };
  return { valid: true };
}

/**
 * Check if account is locked due to too many failed attempts
 */
function isAccountLocked() {
  if (AUTH_STATE.lockoutTime > Date.now()) {
    const remaining = Math.ceil((AUTH_STATE.lockoutTime - Date.now()) / 1000);
    return { locked: true, remaining };
  }
  return { locked: false };
}

/**
 * Record failed login attempt
 */
function recordFailedAttempt() {
  AUTH_STATE.loginAttempts++;
  AUTH_STATE.lastAttemptTime = Date.now();
  
  // Lock account after max attempts
  if (AUTH_STATE.loginAttempts >= MAX_LOGIN_ATTEMPTS) {
    AUTH_STATE.lockoutTime = Date.now() + LOCKOUT_DURATION;
    return {
      failed: true,
      locked: true,
      msg: 'Too many failed attempts. Account locked for 5 minutes.'
    };
  }
  
  return {
    failed: true,
    locked: false,
    remaining: MAX_LOGIN_ATTEMPTS - AUTH_STATE.loginAttempts,
    msg: `Invalid credentials. ${MAX_LOGIN_ATTEMPTS - AUTH_STATE.loginAttempts} attempt(s) remaining.`
  };
}

/**
 * Reset login attempts on successful login
 */
function resetLoginAttempts() {
  AUTH_STATE.loginAttempts = 0;
  AUTH_STATE.lastAttemptTime = 0;
  AUTH_STATE.lockoutTime = 0;
}

/**
 * Attempt login with username and password
 */
function doLogin() {
  // Check if account is locked
  const lockCheck = isAccountLocked();
  if (lockCheck.locked) {
    showLoginError(`Account locked. Try again in ${lockCheck.remaining} seconds.`);
    return;
  }
  
  // Get and validate input
  const u = $('#lkUser').value.trim().toLowerCase();
  const p = $('#lkPass').value;
  const rememberMe = $('#lkRemember') && $('#lkRemember').checked;
  
  // Validate input format
  const userVal = validateUsername(u);
  if (!userVal.valid) {
    showLoginError(userVal.msg);
    return;
  }
  
  const passVal = validatePassword(p);
  if (!passVal.valid) {
    showLoginError(passVal.msg);
    return;
  }
  
  // Find matching user
  const acc = S.users.find((x) => x.u === u && x.p === p);

  // A deactivated account is refused even with the right password
  if (acc && acc.active === 0) {
    showLoginError('This account has been deactivated. Ask a manager to re-enable it.');
    logIt('login_failed', `Sign-in refused, account deactivated: ${u}`, 'all', { user: u });
    $('#lkPass').value = '';
    return;
  }
  
  if (!acc) {
    const attempt = recordFailedAttempt();
    showLoginError(attempt.msg);
    
    // Log failed attempt
    logIt('login_failed', `Failed login attempt for user: ${u}`, 'all', {
      attempts: AUTH_STATE.loginAttempts,
      locked: attempt.locked
    });
    
    $('#lkPass').value = '';
    $('#lkPass').focus();
    return;
  }
  
  // Clear error
  hideLoginError();
  
  // Clear inputs
  $('#lkPass').value = '';
  $('#lkUser').value = '';
  
  // Reset attempt counter
  resetLoginAttempts();
  
  // Log successful login
  logIt('login', `User logged in: ${acc.name} (${acc.role})`, 'all', {
    user: acc.u,
    role: acc.role,
    site: acc.site
  });
  
  // Enter application
  enter(acc, rememberMe);
}

/**
 * Show login error message
 */
function showLoginError(msg) {
  const e = $('#lkErr');
  e.textContent = msg;
  e.classList.remove('hide');
}

/**
 * Hide login error message
 */
function hideLoginError() {
  const e = $('#lkErr');
  e.classList.add('hide');
  e.textContent = '';
}

/**
 * Start session timeout tracking
 */
function startSessionTimeout() {
  if (AUTH_STATE.sessionTimeout) {
    clearTimeout(AUTH_STATE.sessionTimeout);
  }
  
  AUTH_STATE.lastActivityTime = Date.now();
  
  AUTH_STATE.sessionTimeout = setTimeout(() => {
    if (VIEW.user) {
      logIt('session_timeout', 'Session timed out due to inactivity', 'all');
      showTimeoutWarning();
    }
  }, AUTH_STATE.inactivityTime);
}

/**
 * Reset inactivity timer on user activity
 */
function resetInactivityTimer() {
  if (!VIEW.user) return; // Not logged in
  
  const now = Date.now();
  if (now - AUTH_STATE.lastActivityTime > 60000) { // Only reset if > 1 minute since last activity
    AUTH_STATE.lastActivityTime = now;
    startSessionTimeout();
  }
}

/**
 * Show session timeout warning
 */
function showTimeoutWarning() {
  confirmModal(
    'Session Expired',
    'Your session has timed out due to inactivity. Please log in again.',
    () => signOut()
  );
}

/**
 * Enter the application with a user account
 */
function enter(acc, rememberMe = false) {
  VIEW.user = acc;

  // An account tied to exactly one warehouse opens on it; otherwise "all",
  // which mySiteIds() already narrows to the warehouses it may reach.
  const ids = siteIdsFor(acc);
  VIEW.site = ids.length === 1 ? ids[0] : 'all';
  VIEW.page = landingPage();
  
  // Store session info
  S.session = {
    u: acc.u,
    at: Date.now(),
    rememberMe: rememberMe
  };
  
  // Update UI
  $('#lock').classList.add('gone');
  $('#app').classList.add('on');
  
  // Set user badge
  const initials = acc.name
    .split(' ')
    .map((x) => x[0])
    .join('')
    .slice(0, 2)
    .toUpperCase();
  $('#meBtn').textContent = initials;
  $('#meBtn').title = acc.name;
  
  // Build navigation
  buildSites();
  buildNav();
  render();
  
  // Save state with remember-me
  if (rememberMe) {
    S.session.rememberMe = true;
    localStorage.setItem('voltgrid_rememberMe', 'true');
  }
  saveState();
  
  // Initialize session tracking
  initSessionTracking();
  
  toast(`Welcome, ${acc.name}!`, 'good');
}

/**
 * Sign out
 */
function signOut() {
  if (VIEW.user) {
    // End session tracking
    endSession();
    
    // Log sign out
    logIt('logout', `User logged out: ${VIEW.user.name}`, 'all', {
      user: VIEW.user.u,
      duration: Date.now() - S.session.at
    });
  }
  
  // Close any open modals/menus
  closeMenu();
  closeModal();
  
  // Clear session
  VIEW.user = null;
  S.session = null;
  localStorage.removeItem('voltgrid_rememberMe');
  
  // Save state
  dbSet(LS_KEY, S);
  
  // Update UI
  $('#app').classList.remove('on');
  $('#lock').classList.remove('gone');
  
  // Update clock
  tick();
  
  // Clear inputs
  $('#lkUser').value = '';
  $('#lkPass').value = '';
  hideLoginError();
  
  // Focus on username field
  setTimeout(() => {
    $('#lkUser').focus();
  }, 300);
  
  toast('You have been signed out', 'info');
}

      <div class="fld">
        <label>New Password</label>
        <input type="password" id="pwNew" placeholder="Enter new password (min. 6 characters)" autocomplete="new-password">
        <div class="hlp">At least 6 characters recommended</div>
      </div>
      <div class="fld">
        <label>Confirm New Password</label>
        <input type="password" id="pwCon" placeholder="Confirm new password" autocomplete="new-password">
        <div class="hlp">Must match new password</div>
      </div>
    `,
    `
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="changePassword()">Update Password</button>
    `
  );
  
  // Focus first field
  setTimeout(() => $('#pwCur').focus(), 100);
  
  // Allow Enter to submit
  const handleEnter = (e) => {
    if (e.key === 'Enter') {
      changePassword();
    }
  };
  
  $('#pwCur').addEventListener('keydown', handleEnter);
  $('#pwNew').addEventListener('keydown', handleEnter);
  $('#pwCon').addEventListener('keydown', handleEnter);
}

/**
 * Validate new password strength
 */
function validateNewPassword(p) {
  if (!p) return { valid: false, msg: 'Password is required' };
  if (p.length < 6) return { valid: false, msg: 'Password must be at least 6 characters' };
  
  // Optional: check for complexity
  const hasUpper = /[A-Z]/.test(p);
  const hasLower = /[a-z]/.test(p);
  const hasNum = /[0-9]/.test(p);
  
  if (!(hasUpper && hasLower && hasNum)) {
    console.warn('Weak password: mix of uppercase, lowercase, and numbers recommended');
  }
  
  return { valid: true };
}

/**
 * Process password change
 */
function changePassword() {
  const cur = $('#pwCur').value;
  const neu = $('#pwNew').value;
  const con = $('#pwCon').value;
  
  // Validate current password
  const curUser = S.users.find((x) => x.u === VIEW.user.u && x.p === cur);
  if (!curUser) {
    toast('Current password is incorrect', 'bad');
    $('#pwCur').focus();
    return;
  }
  
  // Validate new password
  const newVal = validateNewPassword(neu);
  if (!newVal.valid) {
    toast(newVal.msg, 'bad');
    $('#pwNew').focus();
    return;
  }
  
  // Check passwords match
  if (neu !== con) {
    toast('New passwords do not match', 'bad');
    $('#pwCon').focus();
    return;
  }
  
  // Check new password is different from old
  if (neu === cur) {
    toast('New password must be different from current password', 'bad');
    $('#pwNew').focus();
    return;
  }
  
  // Update password
  const user = S.users.find((x) => x.u === VIEW.user.u);
  if (user) {
    user.p = neu;
    saveState();
    
    // Log password change
    logIt('password_changed', `User changed password: ${VIEW.user.name}`, 'all', {
      user: VIEW.user.u
    });
    
    closeModal();
    toast('Password updated successfully', 'good');
  }
}

/**
 * Initialize authentication UI
 */
function initAuth() {
  // Update clock
  tick();
  
  // Login button
  $('#lkGo').onclick = doLogin;
  
  // Password show/hide toggle
  $('#lkEye').onclick = () => {
    const i = $('#lkPass');
    const s = i.type === 'password';
    i.type = s ? 'text' : 'password';
    $('#lkEye').textContent = s ? 'Hide' : 'Show';
  };
  
  // Keyboard navigation
  $('#lkUser').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('#lkPass').focus();
  });
  
  $('#lkPass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
  
  // Check for remembered session
  const remembered = localStorage.getItem('voltgrid_rememberMe') === 'true';
  if (remembered && S.session) {
    const user = S.users.find((u) => u.u === S.session.u);
    if (user) {
      // Pre-fill username
      $('#lkUser').value = user.u;
      if ($('#lkRemember')) {
        $('#lkRemember').checked = true;
      }
      $('#lkPass').focus();
    }
  }
}

/**

 */
function go(p) {
  VIEW.page = p;

  VIEW.stock = 'all';
  VIEW.tab = 'all';

/**
 * Navigate to log page with optional filter
 */
function goLog(type) {
  if (!canSee('log')) return toast('The activity log is manager-only', 'bad');

  VIEW.page = 'log';
  VIEW.q = '';
  VIEW.cat = 'all';
  VIEW.stock = 'all';
  VIEW.tab = type || 'all';

  $('#rail').classList.remove('on');
  $('#scrim').classList.remove('on');
  
  closeModal();
  buildNav();
  render();
  window.scrollTo(0, 0);
}

/**
 * Build and render navigation
 */
function buildNav() {
  const pages = visiblePages();
  const b = {
    parts: lowParts().length,
    tools: overTools().length,
    cal: calDue().length,
    war: warExpiring().length + warExpired().length,
    po: openPOs()
      .filter((o) => o.status === 'draft').length
  };
  
  $('#nav').innerHTML = NAV.map((n, i) => {
    // A group heading belongs to the entries that follow it, up to the next
    // heading. Show it only when this role can actually see one of them,
    // otherwise a restricted account gets a bare label with nothing beneath.
    if (n.g) {
      const mine = [];
      for (let j = i + 1; j < NAV.length && !NAV[j].g; j++) mine.push(NAV[j]);
      return mine.some((x) => pages.includes(x.id)) ? `<div class="nav-lbl">${n.g}</div>` : '';
    }
    if (!pages.includes(n.id)) return '';
    
    const c = b[n.id] || 0;
    const amber = n.id === 'cal' || n.id === 'po' || n.id === 'war';
    
    return `
      <a data-p="${n.id}" class="${VIEW.page === n.id ? 'on' : ''}">
        <span class="ic">${n.ic}</span>${n.t}
        ${c ? `<span class="bdg ${amber ? 'amber' : ''}">${c}</span>` : ''}
      </a>
    `;
  }).join('');
  
  $$('#nav a').forEach((a) => {
    a.onclick = () => go(a.dataset.p);
  });
  
  const n = alertCount();
  $('#alertDot').classList.toggle('hide', !n);
}

/**
 * Get alert count (for badge)
 */
function alertCount() {
  return lowParts().length + overTools().length + calDue().length + warExpiring().length;
}

/**
 * Page title for the top bar, taken from the navigation definition
 */
function pageTitle(id) {
  const n = NAV.find((x) => x.id === id);
  return n ? n.t : '';
}

/**
 * Build site selector
 */
function buildSites() {
  const lock = VIEW.user.site && VIEW.user.site !== 'all';
  
  if (lock && VIEW.site !== VIEW.user.site) VIEW.site = VIEW.user.site;
  if (!lock && VIEW.site !== 'all' && !S.sites.some((s) => s.id === VIEW.site)) VIEW.site = 'all';
  
  const cur = VIEW.site === 'all' ? null : S.sites.find((s) => s.id === VIEW.site);
  const st = siteStats(VIEW.site);
  
  $('#siteBtn').innerHTML = `
    <span class="cd">${cur ? esc(cur.code) : 'ALL'}</span>
    <span class="nm">${cur ? esc(cur.name) : 'All warehouses'}</span>
    ${st.alerts ? '<span class="wd"></span>' : ''}<span class="cv">▾</span>
  `;
  
  const ps = $('#pgSite');
  if (ps) ps.textContent = cur ? cur.name : `All warehouses · ${S.sites.length} locations`;
}

/**
 * Get stats for a site
 */
function siteStats(id) {
  const P = S.parts.filter((p) => id === 'all' || p.site === id);
  const T = S.tools.filter((t) => id === 'all' || t.site === id);
  const low = P.filter((p) => stockState(p) !== 'ok').length;
  const over = T.filter((t) => toolState(t) === 'over').length;
  const cal = T.filter((t) => ['due', 'exp'].includes(calState(t))).length;
  
  return {
    parts: P.length,
    tools: T.length,
    low,
    over,
    cal,
    alerts: low + over + cal
  };
}

/**
 * Show site selection modal
 */
function siteSheet() {
  const lock = VIEW.user.site && VIEW.user.site !== 'all';
  
  const row = (id, code, name, sub) => {
    const st = siteStats(id);
    const on = VIEW.site === id;
    
    return `
      <button class="siterow ${on ? 'on' : ''}" onclick="setSite('${id}')">
        <span class="cd">${esc(code)}</span>
        <span style="min-width:0;flex:1">

        </span>

            st.alerts
              ? `<span class="pill ${st.low || st.over ? 'out' : 'low'}">${st.alerts} alert${st.alerts > 1 ? 's' : ''}</span>`
              : '<span class="pill ok">clear</span>'
          }
          ${on ? '<div style="color:var(--brand);font-weight:700;font-size:12px;margin-top:4px">Selected</div>' : ''}
        </span>
      </button>
    `;

  openModal(

    `

    `<button class="btn" onclick="closeModal()">Close</button>`
  );
}

/**

 */
function setSite(id) {
  if (!siteAllowed(id)) return toast('That warehouse is not assigned to your account', 'bad');

  VIEW.site = id;
  VIEW.sel = [];
  closeModal();
  buildSites();

/* ---------- stock by category ---------- */

/**
 * Category breakdown card - share of value or line count, with the at-risk portion
 */
function catBlock() {
  const parts = S.parts.filter(inSite);
  const byVal = VIEW.catMode !== 'items';

  const cats = [...new Set(parts.map((p) => p.cat))]
    .map((c) => {
      const g = parts.filter((p) => p.cat === c);
      const bad = g.filter((p) => stockState(p) !== 'ok');
      return {
        c,
        items: g.length,
        qty: g.reduce((a, p) => a + p.qty, 0),
        val: g.reduce((a, p) => a + p.qty * p.cost, 0),
        riskVal: bad.reduce((a, p) => a + p.qty * p.cost, 0),
        low: g.filter((p) => stockState(p) === 'low').length,
        out: g.filter((p) => stockState(p) === 'out').length
      };
    })
    .sort((a, b) => (byVal ? b.val - a.val : b.items - a.items));

  const totVal = cats.reduce((a, x) => a + x.val, 0);
  const totItems = cats.reduce((a, x) => a + x.items, 0);
  const tot = byVal ? totVal : totItems;

  return `
    <div class="card">
      <div class="card-h">
        <div>
          <div class="card-t">Stock by category</div>
          <div class="card-s">
            ${VIEW.site === 'all' ? 'All warehouses' : siteName(VIEW.site)} ·
            ${money(totVal).replace('.00', '')} across ${totItems} line items
          </div>
        </div>
        <div class="r">
          <div class="seg">
            <button class="${byVal ? 'on' : ''}" onclick="setCatMode('value')">By value</button>
            <button class="${byVal ? '' : 'on'}" onclick="setCatMode('items')">By count</button>
          </div>
        </div>
      </div>
      <div class="card-b flush">
        ${cats.length
          ? cats.map((x) => {
              const mine = byVal ? x.val : x.items;
              const risk = byVal ? x.riskVal : x.low + x.out;
              const share = tot ? mine / tot * 100 : 0;
              const riskShare = mine ? risk / mine * 100 : 0;

              return `
                <button class="catrow" onclick="goCat('${esc(x.c)}')">
                  <span class="cat-n">
                    <b>${esc(x.c)}</b>
                    <span>${x.items} item${x.items > 1 ? 's' : ''} · ${x.qty} units</span>
                  </span>
                  <span class="cat-b">
                    <span class="stack" title="${money(x.val)} total, ${money(x.riskVal)} below minimum">
                      <i class="g" style="width:${share * (100 - riskShare) / 100}%"></i>
                      <i class="r" style="width:${share * riskShare / 100}%"></i>
                    </span>
                    ${x.low || x.out
                      ? `<span class="cat-chips">
                          ${x.out ? `<span class="pill out">${x.out} out</span>` : ''}
                          ${x.low ? `<span class="pill low">${x.low} low</span>` : ''}
                        </span>`
                      : ''}
                  </span>
                  <span class="cat-v">
                    <b>${byVal ? money(x.val).replace('.00', '') : x.items}</b>
                    <span>${Math.round(share)}% of ${byVal ? 'value' : 'lines'}</span>
                  </span>
                </button>
              `;
            }).join('')
          : empty('▤', 'No parts at this warehouse', 'Add stock or switch warehouse to see the breakdown.')}
      </div>
      <div class="card-b" style="border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2)">
        Bar length is each category's share of ${byVal ? 'total stock value' : 'total line items'};
